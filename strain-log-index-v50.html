<script>
  function showDiag(title, detail) {
    var root = document.getElementById("root");
    if (!root) return;
    root.innerHTML = '<div style="min-height:100vh;background:#0B1526;color:#EDBAB3;font-family:monospace;padding:24px;white-space:pre-wrap;line-height:1.5;">' +
      '<h2 style="color:#C1443A;margin-bottom:12px;">' + title + '</h2>' +
      '<div style="color:#B0A991;font-size:13px;">' + detail + '</div>' +
      '</div>';
  }
  var OUR_CDN_HOSTS = ["unpkg.com", "cdn.jsdelivr.net", "fonts.googleapis.com"];
  function isOurResource(url) {
    if (!url) return false;
    try {
      var host = new URL(url, location.href).hostname;
      return OUR_CDN_HOSTS.indexOf(host) !== -1;
    } catch (e) { return false; }
  }
  function isFromExtension(filename) {
    return !!filename && (filename.indexOf("extension://") !== -1 || filename.indexOf("chrome-extension") !== -1);
  }
  window.addEventListener("error", function (e) {
    if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      var url = e.target.src || e.target.href;
      if (!isOurResource(url)) return;
      showDiag("A required resource failed to load", "Blocked or unreachable: " + url + "\n\nThis is usually an ad blocker, browser extension, or network/firewall blocking the CDN. Try disabling ad blockers for this page, or try a different network/browser.");
      return;
    }
    if (isFromExtension(e.filename)) return;
    var root = document.getElementById("root");
    if (root && root.querySelector("#__strain_loading")) {
      showDiag("Something failed to load", (e.message || "Unknown error") + (e.filename ? ("\n\nFile: " + e.filename + ":" + e.lineno) : ""));
    }
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var msg = String(e.reason && e.reason.message ? e.reason.message : e.reason);
    if (/extension/i.test(msg)) return;
    var root = document.getElementById("root");
    if (root && root.querySelector("#__strain_loading")) {
      showDiag("A background request failed", msg);
    }
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.querySelector("#__strain_loading")) {
      showDiag("Still loading after 8 seconds", "The app scripts (React/Supabase) haven't finished running. This usually means:\n\n1. An ad blocker or privacy extension is blocking unpkg.com or jsdelivr.net\n2. Your network/firewall is blocking those CDNs\n3. A slow connection\n\nTry: disabling browser extensions for this page, switching networks, or opening in a different browser.");
    }
  }, 8000);
</script>

  function AuthGate() {
    const [role, setRole] = useState(null); // null | "client" | "trainer"
    const [mode, setMode] = useState("login"); // "login" | "signup" | "forgot"
    const [displayName, setDisplayName] = useState("");
    const [identifierType, setIdentifierType] = useState("email"); // "email" | "phone" — clients only, trainers always use email
    const [email, setEmail] = useState("");
    const [phone, setPhone] = useState("");
    const [password, setPassword] = useState("");
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState("");
    const [notice, setNotice] = useState("");

    function switchMode(next) {
      setError(""); setNotice(""); setMode(next);
    }

    function backToRoles() {
      setError(""); setNotice(""); setMode("login"); setRole(null);
    }

    async function handleSubmit() {
      setError(""); setNotice("");
      if (!sb) { setError("Backend not configured yet."); return; }
      if (mode === "forgot") {
        if (!email.trim()) { setError("Enter your email."); return; }
        setLoading(true);
        const { error: err } = await sb.auth.resetPasswordForEmail(email.trim(), {
          redirectTo: window.location.origin + window.location.pathname
        });
        setLoading(false);
        if (err) { setError(err.message || "Couldn't send that reset link."); return; }
        setNotice("Check your email for a password reset link.");
        return;
      }
      // Clients can sign in with either an email or a WhatsApp/phone number;
      // trainers always use email (identifierType stays "email" for that role).
      const usingPhone = role === "client" && identifierType === "phone";
      const identifier = usingPhone ? phone.trim() : email.trim();
      if (!identifier || !password) {
        setError(usingPhone ? "Enter your phone number and password." : "Enter your email and password.");
        return;
      }
      if (mode === "signup" && !displayName.trim()) { setError("Enter the name you want to log workouts under."); return; }
      setLoading(true);
      const authField = usingPhone ? { phone: identifier } : { email: identifier };
      if (mode === "signup") {
        const { data, error: err } = await sb.auth.signUp({
          ...authField,
          password,
          options: { data: { display_name: displayName.trim() } }
        });
        if (err) { setLoading(false); setError(err.message || "Couldn't create your account."); return; }
        if (data && data.session) { setLoading(false); return; } // signed in immediately, onAuthStateChange picks it up
        setLoading(false);
        setNotice(usingPhone ? "Account created! Log in below." : "Account created! Check your email to confirm it, then log in below.");
        setMode("login");
      } else {
        const { error: err } = await sb.auth.signInWithPassword({ ...authField, password });
        if (err) { setLoading(false); setError(err.message || "Couldn't log you in."); return; }
        if (role === "trainer") {
          // Only checkable AFTER signing in — the trainers table is locked down
          // to logged-in users now, so this lookup has to run with a session.
          const { data: trainerRow, error: tErr } = await sb.from("trainers").select("id").eq("email", email.trim()).maybeSingle();
          if (tErr || !trainerRow) {
            await sb.auth.signOut();
            setLoading(false);
            setError("This email isn't set up as a trainer yet — ask your manager to add you, or log in as a client instead.");
            return;
          }
        }
        setLoading(false);
      }
    }

    if (!role) return e(RoleGate, { onPick: setRole });

    return e("div", { style: styles.gateWrap },
      e("div", { style: styles.gateCard },
        e(BrandMark, {}),
        e("h1", { style: styles.gateTitle }, "JimFit"),
        e("p", { style: styles.gateSub },
          role === "trainer" ? "Log in with the email and password your manager set up for you."
            : mode === "signup" ? "Create your account. Your log stays private to you."
            : mode === "forgot" ? "Enter your email and we'll send you a reset link."
            : "Log in to see your training log."
        ),
        mode === "signup" && role === "client" && e("input", {
          autoFocus: true, style: styles.input, placeholder: "Your name (e.g. Alex)", value: displayName,
          onChange: (ev) => setDisplayName(ev.target.value)
        }),
        role === "client" && mode !== "forgot" && e(Segmented, {
          options: [{ value: "email", label: "Email" }, { value: "phone", label: "WhatsApp number" }],
          value: identifierType, onChange: setIdentifierType
        }),
        (mode === "forgot" || identifierType === "email" || role === "trainer")
          ? e("input", {
              type: "email", style: styles.input, placeholder: "Email", value: email,
              onChange: (ev) => setEmail(ev.target.value)
            })
          : e("input", {
              type: "tel", style: styles.input, placeholder: "WhatsApp number, e.g. +961 71 234567", value: phone,
              onChange: (ev) => setPhone(ev.target.value)
            }),
        mode !== "forgot" && e("input", {
          type: "password", style: styles.input, placeholder: "Password", value: password,
          onChange: (ev) => setPassword(ev.target.value),
          onKeyDown: (ev) => { if (ev.key === "Enter") handleSubmit(); }
        }),
        mode === "login" && role === "client" && identifierType === "email" && e("button", {
          style: styles.forgotBtn, onClick: () => switchMode("forgot")
        }, "Forgot password?"),
        error && e("span", { style: styles.inlineError }, error),
        notice && e("span", { style: styles.inlineNotice }, notice),
        e("button", {
          style: { ...styles.saveBtn, ...(loading ? styles.btnDisabled : {}) }, disabled: loading, onClick: handleSubmit
        }, loading ? "Please wait…" : mode === "signup" ? "Create account" : mode === "forgot" ? "Send reset link" : "Log in"),

            }, mode === "signup" ? "Already have an account? Log in" : "New here? Create an account"),
        e("button", { style: styles.switchModeBtn, onClick: backToRoles }, "← Back")
      )
    );
  }

  function CalendarMonth({ year, month, sessionCountByDate, selectedDate, onSelectDate, onPrevMonth, onNextMonth }) {
    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = firstOfMonth.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = todayISO();
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);
    const monthLabel = firstOfMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });

    return e("div", { style: styles.calendarWrap },
      e("div", { style: styles.calendarHeader },
        e("button", { style: styles.calendarNavBtn, onClick: onPrevMonth, "aria-label": "Previous month" }, e(Icon, { name: "back", size: 15 })),
        e("span", { style: styles.calendarMonthLabel }, monthLabel),
        e("button", { style: { ...styles.calendarNavBtn, transform: "rotate(180deg)" }, onClick: onNextMonth, "aria-label": "Next month" }, e(Icon, { name: "back", size: 15 }))
      ),
      e("div", { style: styles.calendarWeekRow }, ["S", "M", "T", "W", "T", "F", "S"].map((d, i) => e("span", { key: i, style: styles.calendarWeekday }, d))),
      e("div", { style: styles.calendarGrid }, cells.map((d, i) => {
        if (d == null) return e("div", { key: "empty" + i, style: styles.calendarCellEmpty });
        const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const count = sessionCountByDate[dateStr] || 0;
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDate;
        return e("button", {
          key: dateStr, onClick: () => onSelectDate(dateStr),
          style: { ...styles.calendarCell, ...(isToday && !isSelected ? styles.calendarCellToday : {}), ...(isSelected ? styles.calendarCellSelected : {}) }
        },
          e("span", { style: styles.calendarCellNum }, d),
          count > 0 && e("span", { style: { ...styles.calendarCellDot, ...(isSelected ? { background: C.brandInk } : {}) } })
        );
      }))
    );
  }

  function shiftDateISO(iso, delta) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + delta);
    return d.toISOString().slice(0, 10);
  }

  function hourLabel12(h) {
    const period = h < 12 ? "AM" : "PM";
    const displayH = h % 12 === 0 ? 12 : h % 12;
    return `${displayH} ${period}`;
  }

  function DayTimeline({ daySessions, onSend, onDelete, sendingId, past, canPickTrainer, trainerNameById }) {
    const HOURS = [];
    for (let h = 6; h <= 22; h++) HOURS.push(h);
    const byHour = {};
    const other = [];
    daySessions.forEach((s) => {
      const h = s.time ? parseInt(s.time.split(":")[0], 10) : NaN;
      if (Number.isFinite(h) && h >= 6 && h <= 22) (byHour[h] = byHour[h] || []).push(s);
      else other.push(s);
    });
    function rowFor(s) {
      return e(SessionRow, {
        key: s.id, session: s, onSend, onDelete, sending: sendingId === s.id, past,
        trainerName: canPickTrainer ? (trainerNameById[s.trainerId] || "Unassigned") : null
      });
    }
    return e("div", { style: styles.timelineWrap },
      HOURS.map((h) => {
        const items = byHour[h] || [];
        return e("div", { key: h, style: styles.timelineRow },
          e("div", { style: styles.timelineHourCol }, e("span", { style: styles.timelineHourLabel }, hourLabel12(h))),
          e("div", { style: styles.timelineBody },
            items.length === 0
              ? e("div", { style: styles.timelineEmptyLine })

      other.length > 0 && e("div", { style: { marginTop: 14 } },
        e("div", { style: styles.timelineOtherHeading }, "No time set"),
        e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, other.map(rowFor))
      )
    );
  }

  function SessionsPanel({ trainerId = null, canPickTrainer = false, trainers = [], clientOptions = [] }) {
    const [sessions, setSessions] = useState([]);
    const [loaded, setLoaded] = useState(false);
    const [name, setName] = useState("");
    const [phone, setPhone] = useState("");
    const [date, setDate] = useState(todayISO());
    const [time, setTime] = useState("09:00");
    const [note, setNote] = useState("");
    const [formTrainerId, setFormTrainerId] = useState("");
    const [saving, setSaving] = useState(false);
    const [sendingId, setSendingId] = useState(null);
    const [error, setError] = useState("");
    const today0 = new Date();
    const [calYear, setCalYear] = useState(today0.getFullYear());
    const [calMonth, setCalMonth] = useState(today0.getMonth());
    const [selectedDate, setSelectedDate] = useState(todayISO());

    function goPrevMonth() {
      if (calMonth === 0) { setCalMonth(11); setCalYear((y) => y - 1); } else { setCalMonth((m) => m - 1); }
    }
    function goNextMonth() {
      if (calMonth === 11) { setCalMonth(0); setCalYear((y) => y + 1); } else { setCalMonth((m) => m + 1); }
    }
    function goToDate(iso) {
      setSelectedDate(iso);
      const d = new Date(iso + "T00:00:00");
      setCalYear(d.getFullYear());
      setCalMonth(d.getMonth());
    }
    function goPrevDay() { goToDate(shiftDateISO(selectedDate, -1)); }
    function goNextDay() { goToDate(shiftDateISO(selectedDate, 1)); }

    const trainerNameById = useMemo(() => {
      const map = {};
      trainers.forEach((t) => { map[t.id] = t.name; });
      return map;
    }, [trainers]);

    useEffect(() => {
      if (!sb) { setLoaded(true); return; }
      let q = sb.from("scheduled_sessions").select("*").order("session_date", { ascending: true });
      if (trainerId) q = q.eq("trainer_id", trainerId);
      q.then(({ data, error: err }) => {
        if (!err && data) {
          setSessions(data.map((r) => ({ id: r.id, name: r.client_name, phone: r.client_phone, date: r.session_date, time: r.session_time, note: r.note, sentAt: r.reminder_sent_at, trainerId: r.trainer_id })));
        }
        setLoaded(true);
      });
    }, []);

    async function handleSchedule() {
      if (!name.trim() || !phone.trim() || !date) {
        setError("Add a client name, phone number, and date.");
        return;
      }
      if (!sb) { setError("Backend not configured yet."); return; }
      setSaving(true);
      const assignedTrainerId = canPickTrainer ? (formTrainerId || null) : trainerId;
      const payload = { client_name: name.trim(), client_phone: phone.trim(), session_date: date, session_time: time || null, note: note.trim() || null, trainer_id: assignedTrainerId };
      const { data, error: err } = await sb.from("scheduled_sessions").insert([payload]).select();
      setSaving(false);
      if (err || !data) { setError("Couldn't schedule that session. Check the scheduled_sessions table has a client_phone column (see setup guide)."); return; }
      const row = data[0];
      const mapped = { id: row.id, name: row.client_name, phone: row.client_phone, date: row.session_date, time: row.session_time, note: row.note, sentAt: row.reminder_sent_at, trainerId: row.trainer_id };
      setSessions((prev) => [...prev, mapped].sort((a, b) => ((a.date + (a.time || "")) < (b.date + (b.time || "")) ? -1 : 1)));
      setName(""); setPhone(""); setNote(""); setError("");
    }

    async function handleDeleteSession(id) {
      setSessions((prev) => prev.filter((s) => s.id !== id));
      if (sb) await sb.from("scheduled_sessions").delete().eq("id", id);
    }

    async function handleSendReminder(session) {
      setError("");
      const link = whatsappReminderLink(session);
      if (!link) {
        setError("No phone number saved for this session — delete it and reschedule with a phone number to send a WhatsApp reminder.");
        return;
      }
      // Open WhatsApp before any await, so the browser still treats this as a
      // direct result of the click (otherwise popup blockers can kill it).
      window.open(link, "_blank", "noopener,noreferrer");
      setSendingId(session.id);
      const sentAt = new Date().toISOString();
      if (sb) await sb.from("scheduled_sessions").update({ reminder_sent_at: sentAt }).eq("id", session.id);
      setSessions((prev) => prev.map((s) => (s.id === session.id ? { ...s, sentAt } : s)));
      setSendingId(null);
    }

    const sessionCountByDate = useMemo(() => {
      const map = {};
      sessions.forEach((s) => { map[s.date] = (map[s.date] || 0) + 1; });
      return map;
    }, [sessions]);
    const daySessions = useMemo(() => sessions
      .filter((s) => s.date === selectedDate)
      .sort((a, b) => ((a.time || "") < (b.time || "") ? -1 : 1)), [sessions, selectedDate]);
    const isDayPast = selectedDate < todayISO();

    if (!loaded) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading rota…"));

    return e("div", null,
      e("div", { style: styles.sessionForm },
        e("div", { style: styles.sessionFormRow },
          e("input", { style: styles.input, list: "rota-client-list", placeholder: "Client name", value: name, onChange: (ev) => setName(ev.target.value) }),
          e("input", { style: styles.input, type: "tel", placeholder: "Client phone, e.g. +961 71 234567", value: phone, onChange: (ev) => setPhone(ev.target.value) })
        ),
        e("datalist", { id: "rota-client-list" }, clientOptions.map((n) => e("option", { key: n, value: n }))),
        e("div", { style: styles.sessionFormRow },
          e("input", { style: styles.input, type: "date", value: date, onChange: (ev) => setDate(ev.target.value) }),
          e("input", { style: styles.input, type: "time", value: time, onChange: (ev) => setTime(ev.target.value) })
        ),
        canPickTrainer && e("select", {
          value: formTrainerId, onChange: (ev) => setFormTrainerId(ev.target.value),
          style: { ...styles.input, marginBottom: 10 }
        }, [e("option", { key: "", value: "" }, "Unassigned"), ...trainers.map((t) => e("option", { key: t.id, value: t.id }, t.name))]),
        e("input", { style: { ...styles.input, marginBottom: 12 }, placeholder: "Note (optional) — e.g. \"Upper body day\"", value: note, onChange: (ev) => setNote(ev.target.value) }),
        error && e("div", { style: { ...styles.errorBanner, marginBottom: 12 } }, e(Icon, { name: "x", size: 13, color: C.critical }), error),
        e("button", { style: { ...styles.saveBtn, marginTop: 0, ...(saving ? styles.btnDisabled : {}) }, disabled: saving, onClick: handleSchedule }, e(Icon, { name: "calendar", size: 15 }), saving ? "Scheduling…" : "Schedule session")
      ),
      e(CalendarMonth, {
        year: calYear, month: calMonth, sessionCountByDate, selectedDate,
        onSelectDate: goToDate, onPrevMonth: goPrevMonth, onNextMonth: goNextMonth
      }),
      e("div", { style: { ...styles.sectionHead, marginTop: 18, flexDirection: "row", alignItems: "center", justifyContent: "space-between" } },
        e("button", { style: styles.calendarNavBtn, onClick: goPrevDay, "aria-label": "Previous day" }, e(Icon, { name: "back", size: 15 })),
        e("span", { style: styles.sectionTitle }, fmtDateFull(selectedDate)),
        e("button", { style: { ...styles.calendarNavBtn, transform: "rotate(180deg)" }, onClick: goNextDay, "aria-label": "Next day" }, e(Icon, { name: "back", size: 15 }))
      ),
      e(DayTimeline, {
        daySessions, onSend: handleSendReminder, onDelete: handleDeleteSession, sendingId, past: isDayPast,
        canPickTrainer, trainerNameById
      })
    );
  }

      if (!selectedMonth) return [];

      entries.forEach((x) => {

        seen.add(key);
        rows.push({ name: x.clientName, date: x.date });

            return e("span", { style: { ...styles.goalChip, ...(paidUp ? styles.goalChipGood : styles.goalChipBad) } }, paidUp ? "Paid up" : `${balance.toLocaleString()} due`);
          })(),

        )
      )))
    );

  function CoachView({ unlocked, onUnlock }) {

    const paidByName = useMemo(() => {

        const lastDate = list.reduce((max, x) => (x.date > max ? x.date : max), list[0]?.date || "");
        const vol7 = computeWeekVolume(list);
        return { name, sessions, lastDate, vol7, entries: list };
      }).sort((a, b) => (a.lastDate < b.lastDate ? 1 : -1));
    }, [allEntries]);

    const profileByName = useMemo(() => {
      const map = {};
      profiles.forEach((p) => { map[p.client_name] = p; });

    }, [profiles]);

    const ownerTrainer = useMemo(() => trainers.find((t) => t.email === OWNER_TRAINER_EMAIL), [trainers]);

      const cp = profileByName[name];

  // ---- progress photos ----

  function ProgressPanel({ userId, clientName, canManage = false }) {
    const [photos, setPhotos] = useState([]);
    const [loaded, setLoaded] = useState(false);
    const [uploading, setUploading] = useState(false);
    const [takenOn, setTakenOn] = useState(todayISO());
    const [note, setNote] = useState("");
    const [error, setError] = useState("");
    const fileInputRef = useRef(null);

    useEffect(() => {
      if (!userId || !sb) { setPhotos([]); setLoaded(true); return; }
      setLoaded(false);
      sb.from("progress_photos").select("*").eq("user_id", userId).order("taken_on", { ascending: true }).then(async ({ data, error: err }) => {
        if (err || !data) { setPhotos([]); setLoaded(true); return; }
        const withUrls = await Promise.all(data.map(async (r) => {
          const { data: signed } = await sb.storage.from("progress-photos").createSignedUrl(r.storage_path, 3600);
          return { id: r.id, takenOn: r.taken_on, note: r.note, path: r.storage_path, url: signed ? signed.signedUrl : null };
        }));
        setPhotos(withUrls);
        setLoaded(true);
      });
    }, [userId]);

    async function handleUpload(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      setError("");
      if (!sb || !userId) { setError("Backend not configured yet."); return; }
      setUploading(true);
      const path = `${userId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, "")}`;
      const { error: upErr } = await sb.storage.from("progress-photos").upload(path, file);
      if (upErr) { setUploading(false); setError("Couldn't upload that photo. Try again."); return; }
      const { data, error: insErr } = await sb.from("progress_photos").insert([{
        user_id: userId, client_name: clientName, storage_path: path, taken_on: takenOn, note: note.trim() || null
      }]).select();
      setUploading(false);
      if (insErr || !data) { setError("Photo uploaded but couldn't save the record. Try again."); return; }
      const { data: signed } = await sb.storage.from("progress-photos").createSignedUrl(path, 3600);
      const row = data[0];
      setPhotos((prev) => [...prev, { id: row.id, takenOn: row.taken_on, note: row.note, path, url: signed ? signed.signedUrl : null }].sort((a, b) => (a.takenOn < b.takenOn ? -1 : 1)));
      setNote("");
      if (fileInputRef.current) fileInputRef.current.value = "";
    }

    async function handleDeletePhoto(photo) {
      const ok = window.confirm("Delete this photo? This can't be undone.");
      if (!ok) return;
      setPhotos((prev) => prev.filter((p) => p.id !== photo.id));
      if (sb) {
        await sb.from("progress_photos").delete().eq("id", photo.id);
        await sb.storage.from("progress-photos").remove([photo.path]);
      }
    }

    if (!loaded) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading photos…"));

    const first = photos.length > 0 ? photos[0] : null;
    const last = photos.length > 1 ? photos[photos.length - 1] : null;

    return e("div", null,
      canManage && e("div", { style: styles.sessionForm },
        e("label", { style: styles.formLabel }, "Date"),
        e("input", { type: "date", value: takenOn, max: todayISO(), onChange: (ev) => setTakenOn(ev.target.value), style: styles.input }),
        e("input", { style: { ...styles.input, marginTop: 10, marginBottom: 12 }, placeholder: 'Note (optional) — e.g. "Week 4"', value: note, onChange: (ev) => setNote(ev.target.value) }),
        error && e("div", { style: { ...styles.errorBanner, marginBottom: 12 } }, e(Icon, { name: "x", size: 13, color: C.critical }), error),
        e("input", { ref: fileInputRef, type: "file", accept: "image/*", onChange: handleUpload, disabled: uploading, style: { display: "none" }, id: "progress-photo-input" }),
        e("label", { htmlFor: "progress-photo-input", style: { ...styles.saveBtn, ...(uploading ? styles.btnDisabled : {}), display: "flex", justifyContent: "center", cursor: uploading ? "default" : "pointer" } },
          e(Icon, { name: "camera", size: 16 }), uploading ? "Uploading…" : "Add progress photo"
        )
      ),
      photos.length === 0 && e("div", { style: styles.empty }, e(Icon, { name: "camera", size: 24, color: C.ink3 }), e("p", { style: styles.emptyText }, "No progress photos yet.")),
      first && last && e(React.Fragment, null,
        e("div", { style: styles.sectionHead }, e("span", { style: styles.sectionTitle }, "Before / after")),

  // ---- diet plan + macro/water tracking ----

  const DIET_FIELD_MAP = { calories: "calories_target", protein: "protein_target", carbs: "carbs_target", fat: "fat_target", water: "water_target_ml" };

  function macroHit(actual, target, tolerancePct, floorOnly) {
    if (target == null || actual == null) return null;
    if (floorOnly) return actual >= target;
    const lo = target * (1 - tolerancePct);
    const hi = target * (1 + tolerancePct);
    return actual >= lo && actual <= hi;
  }

  // Per-macro status: how far actual intake is from target, and in which direction.
  function macroStatusInfo(actual, target, tolerancePct, floorOnly) {
    if (target == null || actual == null) return null;
    const diff = Math.round(actual - target);
    const hit = macroHit(actual, target, tolerancePct, floorOnly);
    if (hit) return { label: "On target", diff: 0, kind: "good" };
    if (diff > 0) return { label: `${diff} over`, diff, kind: "over" };
    return { label: `${Math.abs(diff)} under`, diff, kind: "under" };
  }

  function macroStatusColors(kind) {
    if (kind === "good") return { color: C.good, background: C.goodSoft };
    if (kind === "over") return { color: C.critical, background: C.criticalSoft };
    return { color: C.brand, background: C.brandSoft };
  }

  function macroDeltaTag(actual, target, tolerancePct, floorOnly) {
    const info = macroStatusInfo(actual, target, tolerancePct, floorOnly);
    if (!info) return null;
    return e("span", { style: { color: macroStatusColors(info.kind).color, fontWeight: 600 } }, ` (${info.label})`);
  }

  function DietTargetTile({ label, value, suffix, editable, onCommit, full }) {
    const [editing, setEditing] = useState(false);
    const [draft, setDraft] = useState(value != null ? String(value) : "");
    useEffect(() => { setDraft(value != null ? String(value) : ""); }, [value]);
    function commit() {
      setEditing(false);
      if (draft === "") { onCommit(null); return; }
      const n = Number(draft);
      if (Number.isNaN(n)) { setDraft(value != null ? String(value) : ""); return; }
      onCommit(n);
    }
    return e("div", { style: { ...styles.dashTile, ...(full ? { gridColumn: "1 / -1" } : {}) } },
      e("span", { style: styles.profileLabel }, label),
      editing
        ? e("input", {

    );
  }

    const info = macroStatusInfo(actual, target, tolerancePct, floorOnly);
    const chipStyle = info

  const ACTIVITY_LEVELS = [
    { key: "sedentary", label: "Sedentary — little/no exercise", mult: 1.2 },
    { key: "light", label: "Light — 1-3 days/week", mult: 1.375 },
    { key: "moderate", label: "Moderate — 3-5 days/week", mult: 1.55 },
    { key: "active", label: "Active — 6-7 days/week", mult: 1.725 },
    { key: "very_active", label: "Very active — 2x/day training", mult: 1.9 }

  const GOAL_TYPES = [
    { key: "cut", label: "Cut (fat loss)", mult: 0.8 },
    { key: "maintain", label: "Maintain", mult: 1.0 },
    { key: "lean_bulk", label: "Lean bulk", mult: 1.1 },
    { key: "bulk", label: "Bulk", mult: 1.2 }

  function defaultActivityKey(daysPerWeek) {
    const d = daysPerWeek || 3;
    if (d <= 1) return "sedentary";

  // Suggests a daily calorie/macro target from the client's latest BMR reading, an activity
  // multiplier, and a goal adjustment — the trainer picks the levers, then applies the result.
  const FAT_PCT_OPTIONS = [0.2, 0.25, 0.3, 0.35];

  function CalorieCalculator({ latestAssessment, profile, onApply }) {
    const bmr = latestAssessment && latestAssessment.bmr;
    const bodyWeight = (latestAssessment && latestAssessment.weight) || (profile && profile.weight_kg);
    const [activityKey, setActivityKey] = useState(defaultActivityKey(profile && profile.days_per_week));
    const [goalKey, setGoalKey] = useState("maintain");
    const [fatPct, setFatPct] = useState(0.25);
    const [applied, setApplied] = useState(false);

    if (bmr == null) return null;

    const activity = ACTIVITY_LEVELS.find((a) => a.key === activityKey) || ACTIVITY_LEVELS[2];
    const goal = GOAL_TYPES.find((g) => g.key === goalKey) || GOAL_TYPES[1];
    const tdee = Math.round(bmr * activity.mult);
    const suggestedCalories = Math.round(tdee * goal.mult);
    const proteinPerKg = (profile && profile.gender === "Female") ? 1.6 : 2;
    const suggestedProtein = bodyWeight ? Math.round(bodyWeight * proteinPerKg) : null;
    const proteinCals = suggestedProtein ? suggestedProtein * 4 : 0;
    const suggestedFat = Math.round((suggestedCalories * fatPct) / 9);
    const fatCals = suggestedFat * 9;
    const suggestedCarbs = Math.max(0, Math.round((suggestedCalories - proteinCals - fatCals) / 4));

        e("select", { style: { ...styles.input, flex: "1 1 120px" }, value: goalKey, onChange: (ev) => { setGoalKey(ev.target.value); setApplied(false); } },

        )

      e("div", { style: { marginBottom: 10 } },
        e("span", { style: { ...styles.profileLabel, marginBottom: 6 } }, "Fat % of calories"),
        e("select", { style: styles.input, value: String(fatPct), onChange: (ev) => { setFatPct(Number(ev.target.value)); setApplied(false); } },
          FAT_PCT_OPTIONS.map((p) => e("option", { key: p, value: String(p) }, `${Math.round(p * 100)}% — carbs fill the rest`))
        )
      ),
      e("p", { style: { ...styles.profileGoalText, marginBottom: 6 } },
        `${bmr} kcal BMR × ${activity.mult} activity = ${tdee} kcal maintenance, × ${goal.mult} for ${goal.label.split(" (")[0].toLowerCase()} = `,
        e("span", { style: { color: C.brand, fontWeight: 700 } }, `${suggestedCalories} kcal/day`)
      ),
      e("p", { style: { ...styles.profileGoalText, marginBottom: 12, fontSize: 12 } },
        bodyWeight != null
          ? `Suggested split (protein at ${proteinPerKg}g/kg, fat at ${Math.round(fatPct * 100)}%): ${suggestedProtein}g protein · ${suggestedCarbs}g carbs · ${suggestedFat}g fat`
          : "Add a body weight in Assessments to also get a suggested macro split."
      ),
      e("button", {
        style: { ...styles.saveBtn, marginTop: 0, ...(applied ? { background: C.good } : {}) },

      }, applied ? "Applied to targets ✓" : "Apply to daily targets")
    );
  }

                e(EditableStat, { label: "Goal", value: clientProfile.goal, type: "text", block: true, placeholder: "Tap to set a goal", onCommit: (v) => handleUpdateProfileField(client.name, "goal", v) }),
                clientProfile.has_medical_condition && e("div", { style: styles.medicalNotice },
                  e(Icon, { name: "alert", size: 14, color: C.critical }),

                )
              )
            : e("div", { style: styles.setupNotice }, e(Icon, { name: "alert", size: 14, color: C.ink3 }), "This client hasn't filled in their profile questionnaire yet.")
        ),
        e("div", { style: { padding: "0 18px 14px" } },
          e("button", { style: styles.menuBtn, onClick: () => setMenuOpen(true) },

        ),

          : detailTab === "measurements"

        e("div", { style: styles.headerRight }, e("button", { style: styles.logoutBtn, onClick: onLogout }, e(Icon, { name: "logout", size: 13 }), "Log out"))
      ),
      e("main", { style: styles.feed },

          )

  function TrainingLog() {
    const [clientName, setClientName] = useState(null);
    const [userId, setUserId] = useState(null);
    const [userEmail, setUserEmail] = useState(null);
    const [nameChecked, setNameChecked] = useState(false);
    const [recoveryMode, setRecoveryMode] = useState(false);
    const [trainerChecked, setTrainerChecked] = useState(false);
    const [trainerInfo, setTrainerInfo] = useState(null);
    const [profileChecked, setProfileChecked] = useState(false);
    const [profile, setProfile] = useState(null);
    const [loaded, setLoaded] = useState(false);
    const [entries, setEntries] = useState([]);
    const unit = "kg"; // locked to kg — no lb toggle
    const [appName, setAppName] = useState("JimFit");
    const [editingName, setEditingName] = useState(false);
    const [nameDraft, setNameDraft] = useState("");
    const [titleFilter, setTitleFilter] = useState("All");
    const [dateFilter, setDateFilter] = useState("none");
    const [showForm, setShowForm] = useState(false);
    const [tab, setTab] = useState("log");
    const [statsRange, setStatsRange] = useState("week");
    const [statsMetric, setStatsMetric] = useState("volume");
    const [coachUnlocked, setCoachUnlocked] = useState(false);
    const isManager = !!userEmail && MANAGER_EMAILS.includes(userEmail.toLowerCase());
    const [editingId, setEditingId] = useState(null);
    const [date, setDate] = useState(todayISO());
    const [sessionTitle, setSessionTitle] = useState("");
    const [exercise, setExercise] = useState("");
    const [muscleGroup, setMuscleGroup] = useState("Full Body");
    const [muscleTouched, setMuscleTouched] = useState(false);
    const [sets, setSets] = useState([{ reps: "", weight: "" }]);
    const [saving, setSaving] = useState(false);
    const errorTimer = useRef(null);
    const [error, setError] = useState("");

    useEffect(() => {
      try {
        const raw = localStorage.getItem(PREF_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          setAppName(p.appName || "JimFit");
        }
      } catch (err) {}
      if (!sb) { setNameChecked(true); return; }
      sb.auth.getSession().then(({ data }) => {
        const user = data.session && data.session.user;
        setClientName(deriveClientName(user));
        setUserId(user ? user.id : null);
        setUserEmail(user ? user.email : null);
        setNameChecked(true);
      });
      const { data: authListener } = sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") { setRecoveryMode(true); return; }
        const user = session && session.user;
        setClientName(deriveClientName(user));
        setUserId(user ? user.id : null);
        setUserEmail(user ? user.email : null);
      });
      return () => { authListener && authListener.subscription && authListener.subscription.unsubscribe(); };
    }, []);

    async function handleRecoveryDone() {
      const { data } = await sb.auth.getSession();
      const user = data.session && data.session.user;
      setClientName(deriveClientName(user));
      setUserId(user ? user.id : null);
      setUserEmail(user ? user.email : null);
      setRecoveryMode(false);
    }

    useEffect(() => {
      if (!userEmail || !sb) { setTrainerChecked(true); return; }
      setTrainerChecked(false);
      sb.from("trainers").select("*").eq("email", userEmail).maybeSingle().then(({ data, error: err }) => {
        setTrainerInfo(!err && data ? data : null);
        setTrainerChecked(true);
      });
    }, [userEmail]);

    useEffect(() => {
      if (!userId || trainerInfo || !sb) { setProfileChecked(true); return; }
      setProfileChecked(false);
      sb.from("client_profiles").select("*").eq("user_id", userId).maybeSingle().then(({ data, error: err }) => {
        setProfile(!err && data ? data : null);
        setProfileChecked(true);
      });
    }, [userId, trainerInfo]);

    useEffect(() => {
      if (!clientName || !sb) { setLoaded(true); return; }
      sb.from("workout_entries").select("*").eq("client_name", clientName).order("date", { ascending: false }).then(({ data, error: err }) => {
        if (!err && data) setEntries(data.map((r) => ({ id: r.id, date: r.date, exercise: r.exercise, muscleGroup: r.muscle_group, sets: r.sets, workoutTitle: r.workout_title })));
        setLoaded(true);
      });
    }, [clientName]);

    function persistPrefs(nextName) {
      localStorage.setItem(PREF_KEY, JSON.stringify({ appName: nextName !== undefined ? nextName : appName }));
    }
    async function handleLogout() {
      if (sb) await sb.auth.signOut();
      setClientName(null);
      setUserId(null);
      setUserEmail(null);
      setTrainerInfo(null);
      setProfile(null);
    }

    const weekVolume = useMemo(() => computeWeekVolume(entries), [entries]);
    const prevWeekVolume = useMemo(() => computePrevWeekVolume(entries), [entries]);
    const delta = useMemo(() => {
      if (prevWeekVolume <= 0) return weekVolume > 0 ? { dir: "up", text: "new" } : null;
      const pct = Math.round(((weekVolume - prevWeekVolume) / prevWeekVolume) * 100);
      if (pct === 0) return { dir: "flat", text: "flat" };
      return { dir: pct > 0 ? "up" : "down", text: `${pct > 0 ? "+" : ""}${pct}%` };
    }, [weekVolume, prevWeekVolume]);

    function updateSetRow(idx, field, val) { setSets((p) => p.map((s, i) => (i === idx ? { ...s, [field]: val } : s))); }
    function addSetRow() { setSets((p) => [...p, { reps: "", weight: "" }]); }
    function removeSetRow(idx) { setSets((p) => (p.length === 1 ? p : p.filter((_, i) => i !== idx))); }
    function handleExerciseChange(val) { setExercise(val); if (!muscleTouched) setMuscleGroup(guessMuscleGroup(val)); }
    function resetForm() { setDate(todayISO()); setExercise(""); setMuscleGroup("Full Body"); setMuscleTouched(false); setSets([{ reps: "", weight: "" }]); setEditingId(null); }
    function openNewExercise() { setEditingId(null); resetForm(); setShowForm(true); }
    function closeSheet() { setShowForm(false); setEditingId(null); }
    function startEdit(entry) {
      setEditingId(entry.id);
      setDate(entry.date);
      setSessionTitle(entry.workoutTitle || "");
      setExercise(entry.exercise);
      setMuscleGroup(entry.muscleGroup || "Full Body");
      setMuscleTouched(true);

        return;

      if (!sb) { setError("Backend not configured yet."); return; }
      setSaving(true);

        errorTimer.current = setTimeout(() => setError(""), 3000);
        return;
