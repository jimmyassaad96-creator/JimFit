    useEffect(() => {
      const savedName = localStorage.getItem(NAME_KEY);
      if (savedName) setClientName(savedName);
      setNameChecked(true);
      try {
        const raw = localStorage.getItem(PREF_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          setAppName(p.appName || "Strain Log");
        }
      } catch (err) {}
    }, []);

    useEffect(() => {
      if (!clientName || !sb) { setLoaded(true); return; }

        if (!err && data) setEntries(data.map((r) => ({ id: r.id, date: r.date, exercise: r.exercise, muscleGroup: r.muscle_group, sets: r.sets, workoutTitle: r.workout_title })));
        setLoaded(true);

    }, [weekVolume, prevWeekVolume]);

      const cleanSets = sets.map((s) => ({ reps: Number(s.reps), weight: Number(s.weight) })).filter((s) => s.reps > 0 && !Number.isNaN(s.weight) && s.weight >= 0);
      if (!exercise.trim() || cleanSets.length === 0) {

        clearTimeout(errorTimer.current);
        errorTimer.current = setTimeout(() => setError(""), 3000);
        return;

      if (!sb) { setError("Backend not configured yet."); return; }
      setSaving(true);
      const payload = { date, exercise: exercise.trim(), muscle_group: muscleGroup, workout_title: sessionTitle.trim() || null, sets: cleanSets };
