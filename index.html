  var OUR_CDN_HOSTS = ["unpkg.com", "cdn.jsdelivr.net", "fonts.googleapis.com"];

    if (!url) return false;

      var host = new URL(url, location.href).hostname;
      return OUR_CDN_HOSTS.indexOf(host) !== -1;
    } catch (e) { return false; }
  }

    return !!filename && (filename.indexOf("extension://") !== -1 || filename.indexOf("chrome-extension") !== -1);
  }

      if (!isOurResource(url)) return;

      showDiag("Something failed to load", (e.message || "Unknown error") + (e.filename ? ("\n\nFile: " + e.filename + ":" + e.lineno) : ""));
    }

  window.addEventListener("unhandledrejection", function (e) {
    var msg = String(e.reason && e.reason.message ? e.reason.message : e.reason);
    if (/extension/i.test(msg)) return;
    var root = document.getElementById("root");
    if (root && root.querySelector("#__strain_loading")) {

  });

      setError(""); setNotice(""); setMode("login"); setRole(null);
    }

    async function handleSubmit() {
      setError(""); setNotice("");
      if (!sb) { setError("Backend not configured yet."); return; }
      if (mode === "forgot") {
        if (!email.trim()) { setError("Enter your email."); return; }
        setLoading(true);
        const { error: err } = await sb.auth.resetPasswordForEmail(email.trim(), {
          redirectTo: window.location.origin + window.location.pathname
        });
        setLoading(false);
        if (err) { setError(err.message || "Couldn't send that reset link."); return; }
        setNotice("Check your email for a password reset link.");
        return;
      }
      if (!email.trim() || !password) { setError("Enter your email and password."); return; }
      if (mode === "signup" && !displayName.trim()) { setError("Enter the name you want to log workouts under."); return; }
      setLoading(true);
      if (mode === "signup") {
        const { data, error: err } = await sb.auth.signUp({
          email: email.trim(),
          password,
          options: { data: { display_name: displayName.trim() } }
        });
        if (err) { setLoading(false); setError(err.message || "Couldn't create your account."); return; }
        if (data && data.session) { setLoading(false); return; } // signed in immediately, onAuthStateChange picks it up
        setLoading(false);
        setNotice("Account created! Check your email to confirm it, then log in below.");
        setMode("login");
      } else {
        if (role === "trainer") {
          const { data: trainerRow, error: tErr } = await sb.from("trainers").select("id").eq("email", email.trim()).maybeSingle();
          if (tErr || !trainerRow) {
            setLoading(false);
            setError("This email isn't set up as a trainer yet — ask your manager to add you, or log in as a client instead.");
            return;
          }
        }
        const { error: err } = await sb.auth.signInWithPassword({ email: email.trim(), password });
        setLoading(false);
        if (err) { setError(err.message || "Couldn't log you in."); return; }
      }
    }

      const mapped = { id: row.id, name: row.client_name, email: row.client_email, date: row.session_date, time: row.session_time, note: row.note, sentAt: row.reminder_sent_at };
      setSessions((prev) => [...prev, mapped].sort((a, b) => ((a.date + (a.time || "")) < (b.date + (b.time || "")) ? -1 : 1)));
      setName(""); setEmail(""); setNote(""); setError("");
    }

    async function handleDeleteSession(id) {
      setSessions((prev) => prev.filter((s) => s.id !== id));
      if (sb) await sb.from("scheduled_sessions").delete().eq("id", id);

    async function handleSendReminder(session) {
      setError("");
      if (!EMAILJS_READY || !window.emailjs) {
        setError("Email reminders aren't set up yet — add your EmailJS keys near the top of the file (see the setup guide).");
        return;
      }
      setSendingId(session.id);
      try {
        await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_name: session.name,
          to_email: session.email,
          session_date: fmtDateFull(session.date),
          session_time: session.time || "",
          note: session.note || ""
        }, EMAILJS_PUBLIC_KEY);
        const sentAt = new Date().toISOString();
        if (sb) await sb.from("scheduled_sessions").update({ reminder_sent_at: sentAt }).eq("id", session.id);
        setSessions((prev) => prev.map((s) => (s.id === session.id ? { ...s, sentAt } : s)));

        setError("Couldn't send that email — double check your EmailJS service/template IDs and public key.");

      setSendingId(null);
    }

  function ProgressPanel({ userId, clientName, canManage = false }) {
    const [photos, setPhotos] = useState([]);
    const [loaded, setLoaded] = useState(false);
    const [uploading, setUploading] = useState(false);
    const [takenOn, setTakenOn] = useState(todayISO());
    const [note, setNote] = useState("");
    const [error, setError] = useState("");
    const fileInputRef = useRef(null);

    useEffect(() => {
      if (!userId || !sb) { setPhotos([]); setLoaded(true); return; }
      setLoaded(false);
      sb.from("progress_photos").select("*").eq("user_id", userId).order("taken_on", { ascending: true }).then(async ({ data, error: err }) => {
        if (err || !data) { setPhotos([]); setLoaded(true); return; }
        const withUrls = await Promise.all(data.map(async (r) => {
          const { data: signed } = await sb.storage.from("progress-photos").createSignedUrl(r.storage_path, 3600);
          return { id: r.id, takenOn: r.taken_on, note: r.note, path: r.storage_path, url: signed ? signed.signedUrl : null };
        }));
        setPhotos(withUrls);
        setLoaded(true);
      });
    }, [userId]);

    async function handleUpload(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      setError("");
      if (!sb || !userId) { setError("Backend not configured yet."); return; }
      setUploading(true);
      const path = `${userId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, "")}`;
      const { error: upErr } = await sb.storage.from("progress-photos").upload(path, file);
      if (upErr) { setUploading(false); setError("Couldn't upload that photo. Try again."); return; }
      const { data, error: insErr } = await sb.from("progress_photos").insert([{
        user_id: userId, client_name: clientName, storage_path: path, taken_on: takenOn, note: note.trim() || null
      }]).select();
      setUploading(false);
      if (insErr || !data) { setError("Photo uploaded but couldn't save the record. Try again."); return; }
      const { data: signed } = await sb.storage.from("progress-photos").createSignedUrl(path, 3600);
      const row = data[0];
      setPhotos((prev) => [...prev, { id: row.id, takenOn: row.taken_on, note: row.note, path, url: signed ? signed.signedUrl : null }].sort((a, b) => (a.takenOn < b.takenOn ? -1 : 1)));
      setNote("");
      if (fileInputRef.current) fileInputRef.current.value = "";
    }

    async function handleDeletePhoto(photo) {
      const ok = window.confirm("Delete this photo? This can't be undone.");
      if (!ok) return;
      setPhotos((prev) => prev.filter((p) => p.id !== photo.id));
      if (sb) {
        await sb.from("progress_photos").delete().eq("id", photo.id);
        await sb.storage.from("progress-photos").remove([photo.path]);
      }
    }

    if (!loaded) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading photos…"));

    const first = photos.length > 0 ? photos[0] : null;
    const last = photos.length > 1 ? photos[photos.length - 1] : null;

    return e("div", null,
      canManage && e("div", { style: styles.sessionForm },
        e("label", { style: styles.formLabel }, "Date"),
        e("input", { type: "date", value: takenOn, max: todayISO(), onChange: (ev) => setTakenOn(ev.target.value), style: styles.input }),
        e("input", { style: { ...styles.input, marginTop: 10, marginBottom: 12 }, placeholder: 'Note (optional) — e.g. "Week 4"', value: note, onChange: (ev) => setNote(ev.target.value) }),
        error && e("div", { style: { ...styles.errorBanner, marginBottom: 12 } }, e(Icon, { name: "x", size: 13, color: C.critical }), error),
        e("input", { ref: fileInputRef, type: "file", accept: "image/*", onChange: handleUpload, disabled: uploading, style: { display: "none" }, id: "progress-photo-input" }),
        e("label", { htmlFor: "progress-photo-input", style: { ...styles.saveBtn, ...(uploading ? styles.btnDisabled : {}), display: "flex", justifyContent: "center", cursor: uploading ? "default" : "pointer" } },
          e(Icon, { name: "camera", size: 16 }), uploading ? "Uploading…" : "Add progress photo"
        )
      ),
      photos.length === 0 && e("div", { style: styles.empty }, e(Icon, { name: "camera", size: 24, color: C.ink3 }), e("p", { style: styles.emptyText }, "No progress photos yet.")),
      first && last && e(React.Fragment, null,
        e("div", { style: styles.sectionHead }, e("span", { style: styles.sectionTitle }, "Before / after")),
        e("div", { style: styles.beforeAfterRow },
          e("div", { style: styles.beforeAfterCol },
            e("img", { src: first.url, style: styles.beforeAfterImg }),
            e("span", { style: styles.profileLabel }, fmtDate(first.takenOn))
          ),
          e("div", { style: styles.beforeAfterCol },
            e("img", { src: last.url, style: styles.beforeAfterImg }),
            e("span", { style: styles.profileLabel }, fmtDate(last.takenOn))
          )
        )
      ),
      photos.length > 0 && e(React.Fragment, null,
        e("div", { style: styles.sectionHead }, e("span", { style: styles.sectionTitle }, "All photos")),
        e("div", { style: styles.photoGrid }, photos.slice().reverse().map((p) => e("div", { key: p.id, style: styles.photoCard },
          e("img", { src: p.url, style: styles.photoThumb }),
          e("div", { style: styles.photoMeta },
            e("span", { style: styles.profileLabel }, fmtDate(p.takenOn)),
            p.note && e("span", { style: styles.profileGoalText }, p.note)
          ),
          canManage && e("button", { style: styles.deleteBtn, onClick: () => handleDeletePhoto(p), "aria-label": "Delete photo" }, e(Icon, { name: "trash", size: 14 }))
        )))
      )
    );

  const ASSESSMENT_METRICS = [
    { key: "weight", label: "Weight", unit: "kg" },
    { key: "bodyFat", label: "Body fat", unit: "%" },
    { key: "muscleMass", label: "Muscle mass", unit: "kg" },
    { key: "fatMass", label: "Fat mass", unit: "kg" },

  ];

  function AssessmentPanel({ userId, clientName, canManage = false }) {
    const [assessments, setAssessments] = useState([]);
    const [loaded, setLoaded] = useState(false);
    const [date, setDate] = useState(todayISO());
    const [weight, setWeight] = useState("");
    const [bodyFat, setBodyFat] = useState("");
    const [muscleMass, setMuscleMass] = useState("");
    const [fatMass, setFatMass] = useState("");
    const [waterPct, setWaterPct] = useState("");
    const [bmr, setBmr] = useState("");
    const [note, setNote] = useState("");
    const [saving, setSaving] = useState(false);
    const [error, setError] = useState("");

    useEffect(() => {
      if (!userId || !sb) { setAssessments([]); setLoaded(true); return; }
      setLoaded(false);
      sb.from("body_assessments").select("*").eq("user_id", userId).order("assessed_on", { ascending: true }).then(({ data, error: err }) => {
        if (!err && data) {
          setAssessments(data.map((r) => ({
            id: r.id, date: r.assessed_on, weight: r.weight_kg, bodyFat: r.body_fat_pct,
            muscleMass: r.muscle_mass_kg, fatMass: r.fat_mass_kg, waterPct: r.water_pct, bmr: r.bmr, note: r.note
          })));
        } else {
          setAssessments([]);
        }
        setLoaded(true);
      });
    }, [userId]);

    async function handleSave() {
      setError("");
      if (!date) { setError("Pick a date."); return; }
      const hasAny = [weight, bodyFat, muscleMass, fatMass, waterPct, bmr].some((v) => v !== "");
      if (!hasAny) { setError("Fill in at least one measurement."); return; }
      if (!sb || !userId) { setError("Backend not configured yet."); return; }
      setSaving(true);
      const payload = {
        user_id: userId, client_name: clientName, assessed_on: date,
        weight_kg: weight === "" ? null : Number(weight),
        body_fat_pct: bodyFat === "" ? null : Number(bodyFat),
        muscle_mass_kg: muscleMass === "" ? null : Number(muscleMass),
        fat_mass_kg: fatMass === "" ? null : Number(fatMass),
        water_pct: waterPct === "" ? null : Number(waterPct),
        bmr: bmr === "" ? null : Number(bmr),
        note: note.trim() || null
      };
      const { data, error: err } = await sb.from("body_assessments").insert([payload]).select();
      setSaving(false);

        const user = session && session.user;
        setClientName(deriveClientName(user));
        setUserId(user ? user.id : null);
        setUserEmail(user ? user.email : null);
      });
      return () => { authListener && authListener.subscription && authListener.subscription.unsubscribe(); };

      const user = data.session && data.session.user;

      setUserEmail(user ? user.email : null);
      setRecoveryMode(false);
