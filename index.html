<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JimFit" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body {
    background: #0B1526;
    -webkit-font-smoothing: antialiased;
  }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.75); cursor: pointer; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
  input:focus, select:focus, button:focus-visible, textarea:focus {
    outline: 2px solid #3E7BFA;
    outline-offset: 1px;
  }
  ::placeholder { color: #6B6255; }
  ::selection { background: rgba(62,123,250,0.35); }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
  function showDiag(title, detail) {
    var root = document.getElementById("root");
    if (!root) return;
    root.innerHTML = '<div style="min-height:100vh;background:#0B1526;color:#EDBAB3;font-family:monospace;padding:24px;white-space:pre-wrap;line-height:1.5;">' +
      '<h2 style="color:#C1443A;margin-bottom:12px;">' + title + '</h2>' +
      '<div style="color:#B0A991;font-size:13px;">' + detail + '</div>' +
      '</div>';
  }
  var OUR_CDN_HOSTS = ["unpkg.com", "cdn.jsdelivr.net", "fonts.googleapis.com"];
  function isOurResource(url) {
    if (!url) return false;
    try {
      var host = new URL(url, location.href).hostname;
      return OUR_CDN_HOSTS.indexOf(host) !== -1;
    } catch (e) { return false; }
  }
  function isFromExtension(filename) {
    return !!filename && (filename.indexOf("extension://") !== -1 || filename.indexOf("chrome-extension") !== -1);
  }
  window.addEventListener("error", function (e) {
    if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      var url = e.target.src || e.target.href;
      if (!isOurResource(url)) return;
      showDiag("A required resource failed to load", "Blocked or unreachable: " + url + "\n\nThis is usually an ad blocker, browser extension, or network/firewall blocking the CDN. Try disabling ad blockers for this page, or try a different network/browser.");
      return;
    }
    if (isFromExtension(e.filename)) return;
    var root = document.getElementById("root");
    if (root && root.querySelector("#__strain_loading")) {
      showDiag("Something failed to load", (e.message || "Unknown error") + (e.filename ? ("\n\nFile: " + e.filename + ":" + e.lineno) : ""));
    }
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var msg = String(e.reason && e.reason.message ? e.reason.message : e.reason);
    if (/extension/i.test(msg)) return;
    var root = document.getElementById("root");
    if (root && root.querySelector("#__strain_loading")) {
      showDiag("A background request failed", msg);
    }
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.querySelector("#__strain_loading")) {
      showDiag("Still loading after 8 seconds", "The app scripts (React/Supabase) haven't finished running. This usually means:\n\n1. An ad blocker or privacy extension is blocking unpkg.com or jsdelivr.net\n2. Your network/firewall is blocking those CDNs\n3. A slow connection\n\nTry: disabling browser extensions for this page, switching networks, or opening in a different browser.");
    }
  }, 8000);
</script>

  // ---- training calendar heatmap ----

  function computeTrainingHeatmap(entries, weeks = 14) {
    const byDate = {};

  function computeDashboardStats(entries, payments) {

  function EditableStat({ label, value, suffix = "", type = "number", options, onCommit, block = false, placeholder = "Set" }) {

  // ---- feed / plates ----

  // ---- exercise demo animations ----
  // Free, keyless lookup against the "free-exercise-db" open dataset (public domain / Unlicense,
  // safe for a paid or resold product) — 873 exercises, each with two position photos we flip
  // between to fake a simple animation. It's one plain JSON file (no flaky paginated API), so
  // it's pulled into our own Supabase table (exercise_catalog) ONE TIME EVER — whoever taps
  // "Show demo" first triggers it, everyone after just reads from our own table — and matched
  // by name ourselves. Results are cached in Supabase (table: exercise_gifs) so we only ever
  // look an exercise name up once, and a trainer/manager can paste their own link to override.
  const exerciseGifMemCache = {};

  function exerciseGifKey(name) {
    return (name || "").trim().toLowerCase();
  }

  // Try the name as typed, then a naive singular/plural flip of its last word
  // ("Squats" <-> "Squat"), so a trainer typing either form still finds a match.
  function exerciseSearchVariants(name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return [];
    const words = trimmed.split(/\s+/);
    const last = words[words.length - 1];
    const flipped = /s$/i.test(last) && last.length > 1
      ? [...words.slice(0, -1), last.slice(0, -1)].join(" ")
      : [...words.slice(0, -1), last + "s"].join(" ");
    return flipped.toLowerCase() === trimmed.toLowerCase() ? [trimmed] : [trimmed, flipped];
  }

  function pickBestExerciseMatch(list, name) {
    const key = exerciseGifKey(name);
    if (!list || !list.length) return null;
    const exact = list.find((x) => (x.name || "").trim().toLowerCase() === key);
    if (exact) return exact;
    const startsWith = list.find((x) => (x.name || "").trim().toLowerCase().startsWith(key));
    if (startsWith) return startsWith;
    const contains = list.filter((x) => (x.name || "").trim().toLowerCase().includes(key));
    if (contains.length) {
      // Prefer the shortest matching name — closest to what was actually typed,
      // rather than a longer variant that happens to contain the same words.
      return contains.sort((a, b) => (a.name || "").length - (b.name || "").length)[0];
    }
    return list[0];
  }

  const FREE_EXERCISE_DB_JSON = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json";
  const FREE_EXERCISE_DB_IMAGE_BASE = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";

  let exerciseCatalogSyncPromise = null;
  async function ensureExerciseCatalogSynced() {
    if (!sb) return;
    if (exerciseCatalogSyncPromise) return exerciseCatalogSyncPromise;
    exerciseCatalogSyncPromise = (async () => {
      try {
        const { count } = await sb.from("exercise_catalog").select("exercise_id", { count: "exact", head: true });
        if (count && count > 0) return;
      } catch (e) { return; /* table missing — nothing we can do until the setup SQL is run */ }
      try {
        const res = await fetch(FREE_EXERCISE_DB_JSON);
        if (!res.ok) return;
        const list = await res.json();
        // De-dupe by exercise id — otherwise saving a batch with the same id twice makes the
        // database reject the whole batch ("cannot affect row a second time").
        const seenIds = new Set();
        const rows = [];
        (Array.isArray(list) ? list : []).forEach((x) => {
          if (!x || !x.id || !x.name || !Array.isArray(x.images) || !x.images.length) return;
          if (seenIds.has(x.id)) return;
          seenIds.add(x.id);
          rows.push({
            exercise_id: x.id,
            name: x.name,
            gif_url: FREE_EXERCISE_DB_IMAGE_BASE + encodeURI(x.images[0]),
            frame2_url: x.images[1] ? FREE_EXERCISE_DB_IMAGE_BASE + encodeURI(x.images[1]) : null,
          });
        });
        for (let i = 0; i < rows.length; i += 300) {
          const { error } = await sb.from("exercise_catalog").upsert(rows.slice(i, i + 300));
          if (error) { console.error("exercise_catalog upsert failed", error); break; }
        }
      } catch (e) { /* offline/blocked — per-name lookups will just come up empty this time */ }
    })();
    return exerciseCatalogSyncPromise;
  }
  window.ensureExerciseCatalogSynced = ensureExerciseCatalogSynced; // exposed for debugging

  async function fetchExerciseGif(name) {
    const key = exerciseGifKey(name);
    if (!key) return null;
    if (key in exerciseGifMemCache) return exerciseGifMemCache[key];
    // 1) Check our own cache first (covers both auto-found and manually-added links).
    if (sb) {
      try {
        const { data } = await sb.from("exercise_gifs").select("gif_url, frame2_url, matched_name").eq("name_key", key).limit(1).maybeSingle();
        if (data && data.gif_url) {
          const result = { gifUrl: data.gif_url, frame2Url: data.frame2_url || null, matchedName: data.matched_name || null };
          exerciseGifMemCache[key] = result;
          return result;
        }
      } catch (e) { /* table may not exist yet — fall through */ }
    }
    // 2) Search our own local copy of the exercise catalog (syncing it first if needed).
    if (sb) {
      await ensureExerciseCatalogSynced();
      try {
        // Treat spaces/hyphens as interchangeable ("Push Up" vs "Push-Up") by turning each
        // run of whitespace/dashes in the search term into a wildcard, so naming-convention
        // differences between what a trainer types and how the dataset spells it don't miss.
        // Also try a naive singular/plural flip ("Squats" vs "Squat") if the first try is empty.
        for (const variant of exerciseSearchVariants(name)) {
          const searchPattern = `%${variant.replace(/[\s-]+/g, "%")}%`;
          const { data } = await sb.from("exercise_catalog").select("name, gif_url, frame2_url").ilike("name", searchPattern).order("name", { ascending: true }).limit(20);
          if (data && data.length) {
            const found = pickBestExerciseMatch(data.map((x) => ({ name: x.name, gifUrl: x.gif_url, frame2Url: x.frame2_url || null })), name);
            if (found && found.gifUrl) {
              const result = { gifUrl: found.gifUrl, frame2Url: found.frame2Url || null, matchedName: found.name || null };
              exerciseGifMemCache[key] = result;
              sb.from("exercise_gifs").upsert([{ name_key: key, gif_url: found.gifUrl, frame2_url: found.frame2Url || null, matched_name: found.name || null, source: "auto" }]).then(() => {});
              return result;
            }
          }
        }
      } catch (e) { /* catalog table missing or query failed — treat as "no demo available" */ }
    }
    exerciseGifMemCache[key] = null;
    return null;
  }
  window.fetchExerciseGif = fetchExerciseGif; // exposed for debugging

  async function saveManualExerciseGif(name, url) {
    const key = exerciseGifKey(name);
    if (!key || !url) return;
    const result = { gifUrl: url, matchedName: null };
    exerciseGifMemCache[key] = result;
    if (sb) await sb.from("exercise_gifs").upsert([{ name_key: key, gif_url: url, matched_name: null, source: "manual" }]);
  }

  function youtubeEmbedUrl(url) {
    if (!url) return null;
    const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{6,})/);
    return m ? `https://www.youtube.com/embed/${m[1]}` : null;
  }

  // One-click jump to a pre-filled YouTube search for an exercise with no demo
  // yet, so finding a video is "click, pick the best result, copy the link"
  // instead of opening YouTube and typing the name in yourself every time.
  function youtubeSearchUrl(name) {
    return `https://www.youtube.com/results?search_query=${encodeURIComponent((name || "").trim() + " exercise tutorial")}`;
  }

  function ExerciseDemo({ name }) {
    const [open, setOpen] = useState(false);
    const [loading, setLoading] = useState(false);
    const [result, setResult] = useState(exerciseGifMemCache[exerciseGifKey(name)] || null);
    const [checked, setChecked] = useState(exerciseGifKey(name) in exerciseGifMemCache);
    const [showManual, setShowManual] = useState(false);
    const [manualUrl, setManualUrl] = useState("");

    async function handleOpen() {
      const next = !open;
      setOpen(next);
      if (next && !checked) {
        setLoading(true);
        const r = await fetchExerciseGif(name);
        setResult(r);
        setChecked(true);
        setLoading(false);
      }
    }

    async function handleSaveManual() {
      if (!manualUrl.trim()) return;
      await saveManualExerciseGif(name, manualUrl.trim());
      setResult({ gifUrl: manualUrl.trim(), frame2Url: null, matchedName: null });
      setShowManual(false);
      setManualUrl("");
    }

    const gifUrl = result && result.gifUrl;
    const frame2Url = result && result.frame2Url;
    const matchedName = result && result.matchedName;
    const looksOff = matchedName && exerciseGifKey(matchedName) !== exerciseGifKey(name);
    const ytEmbed = youtubeEmbedUrl(gifUrl);

    // Fake a simple animation by flipping between the exercise's two position photos —
    // the free dataset doesn't have true looping GIFs, but alternating start/end poses
    // reads as "in motion" at a glance, which is what a client actually needs.
    const [frameOn, setFrameOn] = useState(false);
    useEffect(() => {
      if (!open || ytEmbed || !frame2Url) return;
      const id = setInterval(() => setFrameOn((v) => !v), 700);
      return () => clearInterval(id);
    }, [open, ytEmbed, frame2Url]);
    const displaySrc = frame2Url && frameOn ? frame2Url : gifUrl;

    return e("div", { style: { marginTop: open ? 8 : 0 } },
      e("button", { style: styles.demoToggleBtn, onClick: handleOpen },
        e(Icon, { name: "play", size: 12 }), open ? "Hide demo" : "Show demo"),
      open && e("div", { style: styles.demoPanel },
        loading && e("span", { style: styles.demoNote }, "Looking up a demo…"),
        !loading && gifUrl && e("div", null,
          ytEmbed
            ? e("iframe", { src: ytEmbed, style: { ...styles.demoImg, height: 150, border: "none" }, allow: "autoplay; encrypted-media", allowFullScreen: true })
            : e("img", { src: displaySrc, alt: `${name} demo`, style: styles.demoImg }),
          matchedName && e("span", { style: { ...styles.demoNote, display: "block", marginTop: 6 } },
            "Matched: “", matchedName, "”", looksOff ? " — does this look right?" : ""),
          !showManual && e("button", { style: styles.demoLinkBtn, onClick: () => setShowManual(true) },
            looksOff ? "That's not right — add the correct link" : "Not right? Add your own link")
        ),
        !loading && !gifUrl && !showManual && e("div", null,
          e("span", { style: styles.demoNote }, "No demo found for “", name, "”."),
          e("div", { style: { display: "flex", gap: 14, marginTop: 4 } },
            e("a", { href: youtubeSearchUrl(name), target: "_blank", rel: "noopener noreferrer", style: { ...styles.demoLinkBtn, marginTop: 0 } }, "Search YouTube ↗"),
            e("button", { style: { ...styles.demoLinkBtn, marginTop: 0 }, onClick: () => setShowManual(true) }, "+ Add your own link")
          )
        ),
        !loading && showManual && e("div", { style: { display: "flex", gap: 8, marginTop: 6, flexWrap: "wrap" } },
          e("input", {
            style: { ...styles.input, flex: 1, minWidth: 160 }, placeholder: "Paste a YouTube link or direct GIF/image URL",
            value: manualUrl, onChange: (ev) => setManualUrl(ev.target.value)
          }),
          e("button", { style: styles.saveBtn, onClick: handleSaveManual }, "Save")
        )
      )
    );
  }

  // Owner-facing screen: every distinct exercise name used anywhere across
  // programs and logged workouts, in one list, with its demo status — so
  // filling in the gaps doesn't mean hunting through every program one at a
  // time. Reuses the exact same lookup/caching "Show demo" uses everywhere
  // else, so what this screen reports always matches what a trainer or
  // client actually sees when they tap "Show demo" themselves.
  // Splits a pasted line into "everything before the link" (the exercise name)
  // and the link itself, by locating the URL rather than guessing a delimiter —
  // so it works whether the manager typed "Squat - https://…", "Squat: https://…",
  // "Squat, https://…", or pasted a tab-separated row straight out of a spreadsheet.
  function parseBulkExerciseLines(text) {
    return (text || "")
      .split("\n")
      .map((line) => line.trim())
      .filter(Boolean)
      .map((raw) => {
        const m = raw.match(/^(.*?)[\s:,\-|]*?(https?:\/\/\S+)\s*$/i);
        if (!m) return { raw, name: null, url: null };
        const name = m[1].replace(/[\s:,\-|]+$/, "").trim();
        const url = m[2].trim();
        return { raw, name: name || null, url };
      });
  }

  function ExerciseLibraryPanel() {
    const [loading, setLoading] = useState(true);
    const [items, setItems] = useState([]);
    const [results, setResults] = useState({});
    const [filter, setFilter] = useState("all");
    const [editingKey, setEditingKey] = useState(null);
    const [manualUrl, setManualUrl] = useState("");
    const [bulkOpen, setBulkOpen] = useState(false);
    const [bulkText, setBulkText] = useState("");
    const [bulkSaving, setBulkSaving] = useState(false);
    const [bulkResult, setBulkResult] = useState(null);

    useEffect(() => {
      if (!sb) { setLoading(false); return; }
      let cancelled = false;
      (async () => {
        const [progRes, entryRes] = await Promise.all([
          sb.from("program_exercises").select("exercise"),
          sb.from("workout_entries").select("exercise")
        ]);
        // Count how many times each exercise shows up across programs + logged
        // workouts — a proxy for how many clients actually see it — so the list
        // can be sorted highest-impact-first. Filling in the demo for something
        // used 40 times matters a lot more than something used once.
        const seen = new Map();
        const counts = new Map();
        [...(progRes.data || []), ...(entryRes.data || [])].forEach((r) => {
          const raw = ((r && r.exercise) || "").trim();
          if (!raw) return;
          const key = exerciseGifKey(raw);
          counts.set(key, (counts.get(key) || 0) + 1);
          if (!seen.has(key)) seen.set(key, raw);
        });
        const list = [...seen.entries()]
          .map(([key, name]) => ({ key, name, count: counts.get(key) || 0 }))
          .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
        if (cancelled) return;
        setItems(list);
        const found = await Promise.all(list.map(async (item) => [item.key, await fetchExerciseGif(item.name)]));
        if (cancelled) return;
        const map = {};
        found.forEach(([key, r]) => { map[key] = r; });
        setResults(map);
        setLoading(false);
      })();
      return () => { cancelled = true; };
    }, []);

    async function handleSaveManual(item) {
      if (!manualUrl.trim()) return;
      await saveManualExerciseGif(item.name, manualUrl.trim());
      setResults((prev) => ({ ...prev, [item.key]: { gifUrl: manualUrl.trim(), frame2Url: null, matchedName: null } }));
      setEditingKey(null);
      setManualUrl("");
    }

    // Matches each pasted line against the exercises already in this library
    // (same normalized-key lookup used everywhere else) so a manager pasting a
    // list from a spreadsheet gets an instant "matched" / "not found" preview
    // before anything is saved.
    const bulkParsed = useMemo(() => {
      return parseBulkExerciseLines(bulkText).map((row) => {
        if (!row.url) return { ...row, status: "error", reason: "Couldn't find a link on this line" };
        if (!row.name) return { ...row, status: "error", reason: "Couldn't find an exercise name on this line" };
        const key = exerciseGifKey(row.name);
        const exact = items.find((it) => it.key === key);
        const fuzzy = !exact ? items.find((it) => it.key.startsWith(key) || key.startsWith(it.key)) : null;
        const match = exact || fuzzy;
        if (!match) return { ...row, status: "error", reason: `No exercise named "${row.name}" in your library — check the spelling` };
        return { ...row, status: "ok", match };
      });
    }, [bulkText, items]);
    const bulkOkRows = bulkParsed.filter((r) => r.status === "ok");

    async function handleBulkSave() {
      if (!bulkOkRows.length || bulkSaving) return;
      setBulkSaving(true);
      await Promise.all(bulkOkRows.map((row) => saveManualExerciseGif(row.match.name, row.url)));
      setResults((prev) => {
        const next = { ...prev };
        bulkOkRows.forEach((row) => { next[row.match.key] = { gifUrl: row.url, frame2Url: null, matchedName: null }; });
        return next;
      });
      setBulkResult({ savedCount: bulkOkRows.length });
      setBulkText("");
      setBulkSaving(false);
    }

    if (loading) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Checking every exercise for a demo…"));
    if (!items.length) return e("div", { style: styles.empty }, e(Icon, { name: "play", size: 26, color: C.ink3 }), e("p", { style: styles.emptyText }, "No exercises yet — once your programs or logged workouts have some, they'll show up here."));

    const missingCount = items.filter((item) => !(results[item.key] && results[item.key].gifUrl)).length;
    const filtered = items.filter((item) => {
      const has = !!(results[item.key] && results[item.key].gifUrl);
      if (filter === "missing") return !has;
      if (filter === "found") return has;
      return true;
    });

    return e("div", null,
      e("p", { style: { ...styles.profileGoalText, marginBottom: 12 } },
        `${items.length} exercise${items.length === 1 ? "" : "s"} used across your programs and logs — `,
        missingCount === 0 ? "every one has a demo." : `${missingCount} still missing a demo.`,
        missingCount > 0 && " Sorted by how often each one's used, so the ones your clients see most are at the top — you don't need to work through the whole list, just as far down as feels worth it."
      ),
      e("div", { style: { display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap", marginBottom: 14 } },
        e("div", { style: { maxWidth: 240, flex: 1, minWidth: 200 } },
          e(Select, {
            value: filter, onChange: setFilter,
            options: [
              { value: "all", label: "All exercises" },
              { value: "missing", label: `Missing a demo (${missingCount})` },
              { value: "found", label: `Has a demo (${items.length - missingCount})` }
            ]
          })
        ),
        !bulkOpen && e("button", { style: { ...styles.demoLinkBtn, marginTop: 0 }, onClick: () => { setBulkOpen(true); setBulkResult(null); } }, "+ Bulk add links")
      ),
      bulkOpen && e("div", { style: { ...styles.clientCard, flexDirection: "column", alignItems: "stretch", gap: 10, cursor: "default", marginBottom: 14 } },
        e("div", null,
          e("span", { style: styles.exerciseName }, "Bulk add demo links"),
          e("p", { style: { ...styles.muscleSubText, marginTop: 4 } },
            "Paste one exercise per line, name then link — works with a dash, colon, comma, or a tab pasted straight from a spreadsheet."
          )
        ),
        e("textarea", {
          style: { ...styles.input, minHeight: 120, fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, resize: "vertical" },
          placeholder: "Bench Press - https://youtu.be/abc123\nSquat - https://youtu.be/def456",
          value: bulkText,
          onChange: (ev) => { setBulkText(ev.target.value); setBulkResult(null); }
        }),
        bulkParsed.length > 0 && e("div", { style: { display: "flex", flexDirection: "column", gap: 5, maxHeight: 170, overflowY: "auto", padding: "2px 0" } },
          bulkParsed.map((row, i) => e("div", { key: i, style: { display: "flex", alignItems: "flex-start", gap: 6, fontSize: 12.5 } },
            e("span", { style: { marginTop: 2, flexShrink: 0 } }, e(Icon, { name: row.status === "ok" ? "check" : "alert", size: 12, color: row.status === "ok" ? C.good : C.critical })),
            e("span", { style: { color: row.status === "ok" ? C.ink2 : C.critical, lineHeight: 1.4 } },
              row.status === "ok" ? `${row.match.name} → link added` : row.reason
            )
          ))
        ),
        bulkResult && e("span", { style: { ...styles.demoNote, color: C.brand } },
          `Saved ${bulkResult.savedCount} link${bulkResult.savedCount === 1 ? "" : "s"}.`
        ),
        e("div", { style: { display: "flex", gap: 8 } },
          e("button", {
            style: { ...styles.saveBtn, width: "auto", flex: 1, marginTop: 0, padding: "11px", opacity: bulkOkRows.length && !bulkSaving ? 1 : 0.5 },
            disabled: !bulkOkRows.length || bulkSaving,
            onClick: handleBulkSave
          }, bulkSaving ? "Saving…" : `Save ${bulkOkRows.length} link${bulkOkRows.length === 1 ? "" : "s"}`),
          e("button", {
            style: { ...styles.demoLinkBtn, marginTop: 0, color: C.ink3, flexShrink: 0 },
            onClick: () => { setBulkOpen(false); setBulkText(""); setBulkResult(null); }
          }, "Close")
        )
      ),
      filtered.length === 0
        ? e("p", { style: styles.emptyText }, "Nothing matches that filter.")
        : e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, filtered.map((item) => {
            const r = results[item.key];
            const has = !!(r && r.gifUrl);
            const isEditing = editingKey === item.key;
            return e("div", { key: item.key, style: { ...styles.clientCard, alignItems: "center" } },
              e("div", { style: { display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 } },
                has
                  ? e("img", { src: r.gifUrl, alt: "", style: { width: 34, height: 34, borderRadius: 8, objectFit: "cover", flexShrink: 0, background: "#0B1526" } })
                  : e("div", { style: { width: 34, height: 34, borderRadius: 8, background: withAlpha(C.critical, 0.1), display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } },
                      e(Icon, { name: "alert", size: 14, color: C.critical })
                    ),
                e("div", { style: { display: "flex", flexDirection: "column", minWidth: 0 } },
                  e("span", { style: styles.exerciseName }, item.name),
                  e("span", { style: styles.muscleSubText },
                    `Used ${item.count}×`, " · ",
                    has ? (r.matchedName ? `Matched: "${r.matchedName}"` : "Custom link") : "No demo found"
                  )
                )
              ),
              !isEditing
                ? e("div", { style: { display: "flex", gap: 12, alignItems: "center", flexShrink: 0 } },
                    !has && e("a", { href: youtubeSearchUrl(item.name), target: "_blank", rel: "noopener noreferrer", style: { ...styles.demoLinkBtn, marginTop: 0 } }, "Search ↗"),
                    e("button", { style: { ...styles.demoLinkBtn, marginTop: 0 }, onClick: () => { setEditingKey(item.key); setManualUrl(""); } }, has ? "Change" : "+ Add link")
                  )
                : e("div", { style: { display: "flex", gap: 6, alignItems: "center", flexShrink: 0 } },
                    e("input", {
                      style: { ...styles.input, width: 150 }, placeholder: "YouTube or image URL",
                      value: manualUrl, onChange: (ev) => setManualUrl(ev.target.value)
                    }),
                    e("button", { style: { ...styles.demoLinkBtn, marginTop: 0, padding: "0 6px" }, onClick: () => handleSaveManual(item) }, "Save"),
                    e("button", { style: { ...styles.demoLinkBtn, marginTop: 0, padding: "0 6px", color: C.ink3 }, onClick: () => setEditingKey(null) }, "✕")
                  )
            );
          }))
    );
  }

  // Owner-only for now (wired in behind isManager, same as the rest of CoachView).
  // Calls a Supabase Edge Function ("ai-chat") which holds the real AI provider
  // key server-side — the key must never live in this client-side file, since
  // anyone can view-source a static site. Until that function is deployed and
  // its secret set, this panel just shows a clear "not set up yet" message
  // instead of a confusing generic failure.
  function AiChatPanel() {
    const [messages, setMessages] = useState([
      { role: "assistant", content: "Hey — ask me anything about training, nutrition, or how to use JimFit." }
    ]);
    const [input, setInput] = useState("");
    const [sending, setSending] = useState(false);
    const [error, setError] = useState("");
    const scrollRef = useRef(null);

    useEffect(() => {
      if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }, [messages, sending]);

    async function handleSend() {
      const text = input.trim();
      if (!text || sending) return;
      if (!sb) { setError("Backend not configured yet."); return; }
      setError("");
      const nextMessages = [...messages, { role: "user", content: text }];
      setMessages(nextMessages);
      setInput("");
      setSending(true);
      try {
        const history = nextMessages.slice(-10).map((m) => ({ role: m.role, content: m.content }));
        const { data, error: err } = await sb.functions.invoke("ai-chat", { body: { message: text, history } });
        if (err || !data || data.error) {
          setError("Couldn't reach the AI chat — it looks like it isn't set up yet (see the setup guide).");
        } else {
          setMessages((prev) => [...prev, { role: "assistant", content: data.reply }]);
        }
      } catch (e) {
        setError("Couldn't reach the AI chat — it looks like it isn't set up yet (see the setup guide).");
      }

        setLoading(true);
        const { error: err } = await sb.auth.resetPasswordForEmail(email.trim(), {
          redirectTo: window.location.origin + window.location.pathname

        if (err) { setError(err.message || "Couldn't send that reset link."); return; }
        setNotice("Check your email for a password reset link.");

      // paid SMS provider wired up to actually work, which was never set up, so
      // it silently failed. WhatsApp number is still kept as a plain contact
      // field on the client's profile — see the client detail page.)
      const identifier = email.trim();

        setError("Enter your email and password.");
        return;
      }

      // whoever added them to the roster. Only clients pick their own.
      if (mode === "signup" && role === "client" && !displayName.trim()) { setError("Enter the name you want to log workouts under."); return; }
      setLoading(true);
      const authField = { email: identifier };
      if (mode === "signup") {

          else localStorage.removeItem(CLIENT_GYM_CODE_KEY);

        const { data, error: err } = await sb.auth.signUp({

  function CalendarMonth({ year, month, sessionCountByDate, selectedDate, onSelectDate, onPrevMonth, onNextMonth }) {
    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = firstOfMonth.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = todayISO();
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);
    const monthLabel = firstOfMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });

    return e("div", { style: styles.calendarWrap },
      e("div", { style: styles.calendarHeader },
        e("button", { style: styles.calendarNavBtn, onClick: onPrevMonth, "aria-label": "Previous month" }, e(Icon, { name: "back", size: 15 })),
        e("span", { style: styles.calendarMonthLabel }, monthLabel),
        e("button", { style: { ...styles.calendarNavBtn, transform: "rotate(180deg)" }, onClick: onNextMonth, "aria-label": "Next month" }, e(Icon, { name: "back", size: 15 }))
      ),
      e("div", { style: styles.calendarWeekRow }, ["S", "M", "T", "W", "T", "F", "S"].map((d, i) => e("span", { key: i, style: styles.calendarWeekday }, d))),
      e("div", { style: styles.calendarGrid }, cells.map((d, i) => {
        if (d == null) return e("div", { key: "empty" + i, style: styles.calendarCellEmpty });
        const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const count = sessionCountByDate[dateStr] || 0;
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDate;
        return e("button", {
          key: dateStr, onClick: () => onSelectDate(dateStr),
          style: { ...styles.calendarCell, ...(isToday && !isSelected ? styles.calendarCellToday : {}), ...(isSelected ? styles.calendarCellSelected : {}) }
        },
          e("span", { style: styles.calendarCellNum }, d),
          count > 0 && e("span", { style: { ...styles.calendarCellDot, ...(isSelected ? { background: C.brandInk } : {}) } })
        );
      }))
    );
  }

  function shiftDateISO(iso, delta) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + delta);
    return d.toISOString().slice(0, 10);
  }

  function hourLabel12(h) {
    const period = h < 12 ? "AM" : "PM";
    const displayH = h % 12 === 0 ? 12 : h % 12;
    return `${displayH} ${period}`;
  }

  function DayTimeline({ daySessions, onSendWhatsapp, onSendEmail, onDelete, sendingId, sendingChannel, past, canPickTrainer, trainerNameById }) {
    const HOURS = [];
    for (let h = 6; h <= 22; h++) HOURS.push(h);
    const byHour = {};
    const other = [];
    daySessions.forEach((s) => {
      const h = s.time ? parseInt(s.time.split(":")[0], 10) : NaN;
      if (Number.isFinite(h) && h >= 6 && h <= 22) (byHour[h] = byHour[h] || []).push(s);
      else other.push(s);
    });
    function rowFor(s) {
      return e(SessionRow, {
        key: s.id, session: s, onSendWhatsapp, onSendEmail, onDelete,
        sendingChannel: sendingId === s.id ? sendingChannel : null, past,
        trainerName: canPickTrainer ? (trainerNameById[s.trainerId] || "Unassigned") : null
      });
    }
    return e("div", { style: styles.timelineWrap },
      HOURS.map((h) => {
        const items = byHour[h] || [];
        return e("div", { key: h, style: styles.timelineRow },
          e("div", { style: styles.timelineHourCol }, e("span", { style: styles.timelineHourLabel }, hourLabel12(h))),
          e("div", { style: styles.timelineBody },
            items.length === 0
              ? e("div", { style: styles.timelineEmptyLine })
              : e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, items.map(rowFor))
          )
        );
      }),
      other.length > 0 && e("div", { style: { marginTop: 14 } },
        e("div", { style: styles.timelineOtherHeading }, "No time set"),
        e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, other.map(rowFor))
      )
    );
  }

  function SessionsPanel({ trainerId = null, canPickTrainer = false, trainers = [], clientOptions = [] }) {
    const [sessions, setSessions] = useState([]);
    const [loaded, setLoaded] = useState(false);
    const [name, setName] = useState("");
    const [phone, setPhone] = useState("");
    const [email, setEmail] = useState("");
    const [date, setDate] = useState(todayISO());
    const [time, setTime] = useState("09:00");
    const [note, setNote] = useState("");
    const [formTrainerId, setFormTrainerId] = useState("");
    const [saving, setSaving] = useState(false);
    const [sendingId, setSendingId] = useState(null);
    const [sendingChannel, setSendingChannel] = useState(null);
    const [error, setError] = useState("");
    const today0 = new Date();
    const [calYear, setCalYear] = useState(today0.getFullYear());
    const [calMonth, setCalMonth] = useState(today0.getMonth());
    const [selectedDate, setSelectedDate] = useState(todayISO());

    function goPrevMonth() {
      if (calMonth === 0) { setCalMonth(11); setCalYear((y) => y - 1); } else { setCalMonth((m) => m - 1); }
    }
    function goNextMonth() {
      if (calMonth === 11) { setCalMonth(0); setCalYear((y) => y + 1); } else { setCalMonth((m) => m + 1); }
    }
    function goToDate(iso) {
      setSelectedDate(iso);
      const d = new Date(iso + "T00:00:00");
      setCalYear(d.getFullYear());
      setCalMonth(d.getMonth());
    }
    function goPrevDay() { goToDate(shiftDateISO(selectedDate, -1)); }
    function goNextDay() { goToDate(shiftDateISO(selectedDate, 1)); }

    const trainerNameById = useMemo(() => {
      const map = {};
      trainers.forEach((t) => { map[t.id] = t.name; });
      return map;
    }, [trainers]);

    useEffect(() => {
      if (!sb) { setLoaded(true); return; }
      let q = sb.from("scheduled_sessions").select("*").order("session_date", { ascending: true });
      if (trainerId) q = q.eq("trainer_id", trainerId);
      q.then(({ data, error: err }) => {
        if (!err && data) {
          setSessions(data.map((r) => ({ id: r.id, name: r.client_name, phone: r.client_phone, email: r.client_email, date: r.session_date, time: r.session_time, note: r.note, waSentAt: r.reminder_sent_at, emailSentAt: r.email_reminder_sent_at, trainerId: r.trainer_id })));
        }
        setLoaded(true);
      });
    }, []);

    async function handleSchedule() {
      if (!name.trim() || (!phone.trim() && !email.trim()) || !date) {
        setError("Add a client name, at least a phone number or email, and a date.");
        return;
      }
      if (!sb) { setError("Backend not configured yet."); return; }
      setSaving(true);
      const assignedTrainerId = canPickTrainer ? (formTrainerId || null) : trainerId;
      const payload = { client_name: name.trim(), client_phone: phone.trim() || null, client_email: email.trim() || null, session_date: date, session_time: time || null, note: note.trim() || null, trainer_id: assignedTrainerId };
      const { data, error: err } = await sb.from("scheduled_sessions").insert([payload]).select();
      setSaving(false);
      if (err || !data) { setError("Couldn't schedule that session. Check the scheduled_sessions table has client_phone and client_email columns (see setup guide)."); return; }
      const row = data[0];
      const mapped = { id: row.id, name: row.client_name, phone: row.client_phone, email: row.client_email, date: row.session_date, time: row.session_time, note: row.note, waSentAt: row.reminder_sent_at, emailSentAt: row.email_reminder_sent_at, trainerId: row.trainer_id };
      setSessions((prev) => [...prev, mapped].sort((a, b) => ((a.date + (a.time || "")) < (b.date + (b.time || "")) ? -1 : 1)));
      setName(""); setPhone(""); setEmail(""); setNote(""); setError("");
    }

    async function handleDeleteSession(id) {
      setSessions((prev) => prev.filter((s) => s.id !== id));
      if (sb) await sb.from("scheduled_sessions").delete().eq("id", id);
    }

    async function handleSendWhatsapp(session) {
      setError("");
      const link = whatsappReminderLink(session);
      if (!link) {
        setError("No phone number saved for this session — delete it and reschedule with a phone number to send a WhatsApp reminder.");
        return;
      }
      // Open WhatsApp before any await, so the browser still treats this as a
      // direct result of the click (otherwise popup blockers can kill it).
      window.open(link, "_blank", "noopener,noreferrer");
      setSendingId(session.id);
      setSendingChannel("whatsapp");
      const sentAt = new Date().toISOString();
      if (sb) await sb.from("scheduled_sessions").update({ reminder_sent_at: sentAt }).eq("id", session.id);
      setSessions((prev) => prev.map((s) => (s.id === session.id ? { ...s, waSentAt: sentAt } : s)));
      setSendingId(null);
      setSendingChannel(null);
    }

    async function handleSendEmail(session) {
      setError("");
      if (!session.email) {
        setError("No email saved for this session — delete it and reschedule with an email to send an email reminder.");
        return;
      }
      if (!EMAILJS_READY || !window.emailjs) {
        setError("Email reminders aren't set up yet — add your EmailJS keys near the top of the file (see the setup guide).");
        return;
      }
      setSendingId(session.id);
      setSendingChannel("email");
      try {

      setAllPayments((prev) => prev.filter((p) => p.client_name !== name));

    async function handleClearWorkouts(name) {
      const ok = window.confirm(`Clear all logged workouts for ${name}? Their profile and payment history stay intact — only session history is removed. Can't be undone.`);
      if (!ok) return;
      setAllEntries((prev) => prev.filter((x) => x.clientName !== name));
      if (sb) await sb.from("workout_entries").delete().eq("client_name", name);
    }

    async function handleAddTrainer() {
      setAddTrainerError("");
      const name = newTrainerName.trim();
      const emailAddr = newTrainerEmail.trim().toLowerCase();
      if (!name) { setAddTrainerError("Enter a name."); return; }
      if (!emailAddr || !emailAddr.includes("@")) { setAddTrainerError("Enter a valid email."); return; }
      if (!sb) { setAddTrainerError("Backend not configured yet."); return; }
      setAddingTrainer(true);
      const { data: existing } = await sb.from("trainers").select("id").eq("email", emailAddr).maybeSingle();
      if (existing) {
        setAddingTrainer(false);
        setAddTrainerError("A trainer with that email already exists.");
        return;
      }
      const { data, error: err } = await sb.from("trainers").insert([{ name, email: emailAddr, invite_code: randomInviteCode() }]).select();
      setAddingTrainer(false);
      if (err || !data) { setAddTrainerError("Couldn't add that trainer. Try again."); return; }
      setTrainers((prev) => [...prev, data[0]].sort((a, b) => (a.name || "").localeCompare(b.name || "")));
      setNewTrainerName(""); setNewTrainerEmail(""); setShowAddTrainer(false);
    }

    async function handleUpdateTrainerField(trainerId, field, value) {
      setTrainers((prev) => prev.map((t) => (t.id === trainerId ? { ...t, [field]: value } : t)));
      if (sb) await sb.from("trainers").update({ [field]: value }).eq("id", trainerId);
    }

    async function handleDeleteTrainer(trainerId) {
      const t = trainers.find((x) => x.id === trainerId);
      if (!t) return;
      if (t.email === SELF_TRAIN_EMAIL) { window.alert("\"Self-Training\" is a built-in bucket for clients without a trainer — it can't be deleted."); return; }
      const clientCount = trainerClientCounts[trainerId] || 0;
      // Deleting here only removes them from the roster — their Supabase Auth
      // login (email + password) keeps working, since that lives in a
      // separate system this app's key can't manage. Say so up front every
      // time, so it never quietly surprises anyone again.
      const loginNote = "\n\nNote: this removes them from your roster, but their login will still work — they'll just no longer be treated as a trainer. To fully block their login, delete their account in Supabase (Authentication → Users).";
      const msg = (clientCount > 0
        ? `Delete ${t.name}? Their ${clientCount} client${clientCount === 1 ? "" : "s"} will become unassigned — you can reassign them anytime.`
        : `Delete ${t.name}? This can't be undone.`) + loginNote;
      const ok = window.confirm(msg);
      if (!ok) return;
      if (sb) {
        await sb.from("client_profiles").update({ trainer_id: null }).eq("trainer_id", trainerId);
        await sb.from("trainers").delete().eq("id", trainerId);
      }
      setTrainers((prev) => prev.filter((x) => x.id !== trainerId));
      setProfiles((prev) => prev.map((p) => (p.trainer_id === trainerId ? { ...p, trainer_id: null } : p)));
      setAllTrainerPayments((prev) => prev.filter((p) => p.trainer_id !== trainerId));
      setSelectedTrainerId(null);
    }

    async function handleAssignTrainer(name, trainerId) {
      if (!profileByName[name]) return;
      setProfiles((prev) => prev.map((p) => (p.client_name === name ? { ...p, trainer_id: trainerId || null } : p)));
      if (sb) await sb.from("client_profiles").update({ trainer_id: trainerId || null }).eq("client_name", name);
    }

  // Jimmy's platform-level view of every self-serve gym: what each owes this
  // month (their percentage of their clients' fees), a note on payment status,
  // and a freeze switch to cut off access if they haven't renewed.
  function GymsBillingPanel() {
    const [loading, setLoading] = useState(true);
    const [gyms, setGyms] = useState([]);
    const [trainerCounts, setTrainerCounts] = useState({});
    const [clientStats, setClientStats] = useState({}); // gymId -> { count, totalDue }
    const [freezingId, setFreezingId] = useState(null);

    useEffect(() => {
      if (!sb) { setLoading(false); return; }
      (async () => {
        const [gymsRes, trainersRes, clientsRes] = await Promise.all([
          sb.from("gyms").select("*").order("created_at", { ascending: false }),
          sb.from("trainers").select("gym_id").not("gym_id", "is", null),
          sb.from("client_profiles").select("gym_id, total_due").not("gym_id", "is", null)
        ]);
        if (!gymsRes.error && gymsRes.data) setGyms(gymsRes.data);
        if (!trainersRes.error && trainersRes.data) {
          const counts = {};
          trainersRes.data.forEach((t) => { counts[t.gym_id] = (counts[t.gym_id] || 0) + 1; });
          setTrainerCounts(counts);
        }
        if (!clientsRes.error && clientsRes.data) {
          const stats = {};
          clientsRes.data.forEach((c) => {
            const s = stats[c.gym_id] || { count: 0, totalDue: 0 };
            s.count += 1;
            s.totalDue += Number(c.total_due) || 0;
            stats[c.gym_id] = s;
          });
          setClientStats(stats);
        }
        setLoading(false);
      })();
    }, []);

    async function updateGymField(gymId, field, value) {
      setGyms((prev) => prev.map((g) => (g.id === gymId ? { ...g, [field]: value } : g)));
      if (sb) await sb.from("gyms").update({ [field]: value }).eq("id", gymId);
    }

    async function toggleFreeze(gym) {
      const nextFrozen = !gym.is_frozen;
      const ok = window.confirm(
        nextFrozen
          ? `Freeze ${gym.name}? Their owner and every trainer in this gym will be signed out and blocked from logging in until you unfreeze it.`
          : `Unfreeze ${gym.name}? Their trainers will be able to log in again.`
      );
      if (!ok) return;
      setFreezingId(gym.id);
      await updateGymField(gym.id, "is_frozen", nextFrozen);
      setFreezingId(null);
    }

    if (loading) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading gyms…"));

    const totalMonthlyCut = gyms.reduce((sum, g) => {
      const count = (clientStats[g.id] || {}).count || 0;
      return sum + count * (Number(g.rate_per_client) || 0);
    }, 0);

    return e("div", null,
      gyms.length > 0 && e(StatTile, { label: "Estimated monthly cut, all gyms", value: Math.round(totalMonthlyCut), unit: "", size: "lg" }),

  // ---- diet plan + macro/water tracking ----

  const DIET_FIELD_MAP = { calories: "calories_target", protein: "protein_target", carbs: "carbs_target", fat: "fat_target", water: "water_target_ml" };

  function macroHit(actual, target, tolerancePct, floorOnly) {
    if (target == null || actual == null) return null;
    if (floorOnly) return actual >= target;
    const lo = target * (1 - tolerancePct);
    const hi = target * (1 + tolerancePct);
    return actual >= lo && actual <= hi;
  }

  // Per-macro status: how far actual intake is from target, and in which direction.
  function macroStatusInfo(actual, target, tolerancePct, floorOnly) {
    if (target == null || actual == null) return null;
    const diff = Math.round(actual - target);
    const hit = macroHit(actual, target, tolerancePct, floorOnly);
    if (hit) return { label: "On target", diff: 0, kind: "good" };
    if (diff > 0) return { label: `${diff} over`, diff, kind: "over" };
    return { label: `${Math.abs(diff)} under`, diff, kind: "under" };
  }

  function macroStatusColors(kind) {
    if (kind === "good") return { color: C.good, background: C.goodSoft };
    if (kind === "over") return { color: C.critical, background: C.criticalSoft };
    return { color: C.brand, background: C.brandSoft };
  }

  function macroDeltaTag(actual, target, tolerancePct, floorOnly) {
    const info = macroStatusInfo(actual, target, tolerancePct, floorOnly);
    if (!info) return null;
    return e("span", { style: { color: macroStatusColors(info.kind).color, fontWeight: 600 } }, ` (${info.label})`);
  }

  function DietTargetTile({ label, value, suffix, editable, onCommit, full }) {
    const [editing, setEditing] = useState(false);

      setEditing(false);
      if (draft === "") { onCommit(null); return; }
      const n = Number(draft);
      if (Number.isNaN(n)) { setDraft(value != null ? String(value) : ""); return; }
      onCommit(n);

    return e("div", { style: { ...styles.dashTile, ...(full ? { gridColumn: "1 / -1" } : {}) } },
      e("span", { style: styles.profileLabel }, label),
      editing

  function MacroStatusRow({ label, suffix, actual, target, tolerancePct, floorOnly }) {
    const info = macroStatusInfo(actual, target, tolerancePct, floorOnly);

      ? macroStatusColors(info.kind)

  const ACTIVITY_LEVELS = [
    { key: "sedentary", label: "Sedentary — little/no exercise", mult: 1.2 },
    { key: "light", label: "Light — 1-3 days/week", mult: 1.375 },
    { key: "moderate", label: "Moderate — 3-5 days/week", mult: 1.55 },
    { key: "active", label: "Active — 6-7 days/week", mult: 1.725 },
    { key: "very_active", label: "Very active — 2x/day training", mult: 1.9 }
  ];
  const GOAL_TYPES = [
    { key: "cut", label: "Cut (fat loss)", mult: 0.8 },
    { key: "maintain", label: "Maintain", mult: 1.0 },
    { key: "lean_bulk", label: "Lean bulk", mult: 1.1 },
    { key: "bulk", label: "Bulk", mult: 1.2 }
  ];

  function defaultActivityKey(daysPerWeek) {
    const d = daysPerWeek || 3;
    if (d <= 1) return "sedentary";
    if (d <= 3) return "light";
    if (d <= 5) return "moderate";
    if (d <= 6) return "active";
    return "very_active";
  }

  // Suggests a daily calorie/macro target from the client's latest BMR reading, an activity
  // multiplier, and a goal adjustment — the trainer picks the levers, then applies the result.
  const FAT_PCT_OPTIONS = [0.2, 0.25, 0.3, 0.35];

  function CalorieCalculator({ latestAssessment, profile, onApply }) {
    const bmr = latestAssessment && latestAssessment.bmr;
    const bodyWeight = (latestAssessment && latestAssessment.weight) || (profile && profile.weight_kg);
    const [activityKey, setActivityKey] = useState(defaultActivityKey(profile && profile.days_per_week));
    const [goalKey, setGoalKey] = useState("maintain");
    const [fatPct, setFatPct] = useState(0.25);
    const [applied, setApplied] = useState(false);

    if (bmr == null) return null;

    const activity = ACTIVITY_LEVELS.find((a) => a.key === activityKey) || ACTIVITY_LEVELS[2];
    const goal = GOAL_TYPES.find((g) => g.key === goalKey) || GOAL_TYPES[1];
    const tdee = Math.round(bmr * activity.mult);
    const suggestedCalories = Math.round(tdee * goal.mult);
    const proteinPerKg = (profile && profile.gender === "Female") ? 1.6 : 2;
    const suggestedProtein = bodyWeight ? Math.round(bodyWeight * proteinPerKg) : null;
    const proteinCals = suggestedProtein ? suggestedProtein * 4 : 0;
    const suggestedFat = Math.round((suggestedCalories * fatPct) / 9);
    const fatCals = suggestedFat * 9;
    const suggestedCarbs = Math.max(0, Math.round((suggestedCalories - proteinCals - fatCals) / 4));

  function DietPanel({ userId, clientName, canManage = false, profile, onUnlockDietPlan }) {

    function mapPlanRow(row) {

    async function handleDeleteMealItem(id) {

    async function commitPlanField(field, value) {
      if (!sb || !userId) return;

    async function commitPlanFields(fields) {

      const dbPayload = {};
      Object.keys(fields).forEach((k) => { if (fields[k] != null) dbPayload[DIET_FIELD_MAP[k]] = fields[k]; });

  // ---- trainer view ----

  // A lightweight, gym-scoped version of the Owner dashboard — for a self-serve
  // gym owner (trainer.is_owner) to run their own gym: see their invite code
  // and assign their gym's clients to trainers. They can no longer add other
  // trainers here — only the manager (Owner dashboard) adds trainers now.
  // Completely separate from CoachView — never touches or shows any other gym's data.
  function GymOwnerView({ trainer }) {
    const [loading, setLoading] = useState(true);
    const [gym, setGym] = useState(null);
    const [gymTrainers, setGymTrainers] = useState([]);
    const [gymClients, setGymClients] = useState([]);
    const [copied, setCopied] = useState(false);

    async function load() {
      if (!sb || !trainer.gym_id) { setLoading(false); return; }
      setLoading(true);
      const [gymRes, trainersRes, clientsRes] = await Promise.all([
        sb.from("gyms").select("*").eq("id", trainer.gym_id).maybeSingle(),
        sb.from("trainers").select("*").eq("gym_id", trainer.gym_id).order("name", { ascending: true }),
        sb.from("client_profiles").select("*").eq("gym_id", trainer.gym_id)
      ]);
      if (!gymRes.error && gymRes.data) setGym(gymRes.data);
      if (!trainersRes.error && trainersRes.data) setGymTrainers(trainersRes.data);
      if (!clientsRes.error && clientsRes.data) setGymClients(clientsRes.data);
      setLoading(false);
    }
    useEffect(() => { load(); }, []);

    function copyCode() {
      if (!trainer.invite_code) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(trainer.invite_code).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);
        }).catch(() => {});
      }
    }

    async function handleAssign(clientName, trainerId) {
      setGymClients((prev) => prev.map((p) => (p.client_name === clientName ? { ...p, trainer_id: trainerId || null } : p)));
      if (sb) await sb.from("client_profiles").update({ trainer_id: trainerId || null }).eq("client_name", clientName).eq("gym_id", trainer.gym_id);
    }

    if (loading) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading your gym…"));
    if (!gym) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Couldn't load your gym."));

    const trainerOptions = [{ value: "", label: "Unassigned" }, ...gymTrainers.map((t) => ({ value: t.id, label: t.name }))];

    return e("div", { style: { padding: "0 18px 24px" } },
      e("div", { style: { ...styles.profileSummary, marginBottom: 20 } },
        e("div", { style: { fontSize: 13, color: C.ink3, marginBottom: 4 } }, gym.name),
        e("div", { style: { fontSize: 12, color: C.ink3, marginBottom: 10 } }, "Share your invite code with clients — they enter it when they sign up so they land with you directly."),
        e("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
          e("span", { style: { fontFamily: "monospace", fontSize: 20, fontWeight: 700, letterSpacing: 2, padding: "6px 12px", background: withAlpha(C.brand, 0.1), borderRadius: 8 } }, trainer.invite_code || "—"),
          trainer.invite_code && e("button", { style: styles.switchModeBtn, onClick: copyCode }, copied ? "Copied!" : "Copy")
        )
      ),
      e("div", { style: styles.sectionHead },
        e("span", { style: styles.sectionTitle }, "Your trainers")
      ),
      gymTrainers.length === 0
        ? e("p", { style: { ...styles.emptyText, marginBottom: 20 } }, "No trainers yet — you're the only one in this gym so far.")
        : e("div", { style: { display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 } }, gymTrainers.map((t) => e("div", { key: t.id, style: styles.clientCard },
            e("div", { style: { display: "flex", flexDirection: "column" } },
              e("span", { style: styles.exerciseName }, t.name, t.is_owner ? " (you)" : ""),
              e("span", { style: styles.muscleSubText }, t.email)
            )
          ))),
      e("div", { style: styles.sectionHead }, e("span", { style: styles.sectionTitle }, "Your clients")),
      gymClients.length === 0
        ? e("p", { style: styles.emptyText }, "No clients have signed up with your invite code yet.")
        : e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, gymClients.map((c) => e("div", { key: c.client_name, style: styles.clientCard },
            e("div", { style: { display: "flex", flexDirection: "column" } },
              e("span", { style: styles.exerciseName }, c.client_name)
            ),
            e(Select, { value: c.trainer_id || "", onChange: (v) => handleAssign(c.client_name, v), options: trainerOptions, style: { minWidth: 140 } })
          )))
    );
  }

  function TrainerView({ trainer, onLogout, theme, onToggleTheme }) {
    const [loading, setLoading] = useState(true);
    const [allEntries, setAllEntries] = useState([]);
    const [profiles, setProfiles] = useState([]);
    const [selectedClient, setSelectedClient] = useState(null);
    const [titleFilter, setTitleFilter] = useState("All");
    const [dateFilter, setDateFilter] = useState("none");
    const [statsRange, setStatsRange] = useState("week");
    const [statsMetric, setStatsMetric] = useState("volume");
    const [detailTab, setDetailTab] = useState("log");
    // Gym owners land straight on "My gym" (where their invite code lives) —
    // otherwise a brand-new self-serve owner opens the app to an empty "My
    // clients" list with no hint that the code is tucked in the side menu.
    const [trainerTab, setTrainerTab] = useState(trainer.is_owner ? "mygym" : "clients");
    const [allPayments, setAllPayments] = useState([]);
    const [headerCodeCopied, setHeaderCodeCopied] = useState(false);
    // Every trainer gets their own invite code (set when the manager adds
    // them) — shown right in the header, on every tab, so it's never hidden
    // behind a menu. Clients enter this code to land directly with this trainer.
    const headerGymCode = trainer.invite_code || null;

    function copyHeaderCode() {
      if (!headerGymCode) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(headerGymCode).then(() => {
          setHeaderCodeCopied(true);
          setTimeout(() => setHeaderCodeCopied(false), 1800);
        }).catch(() => {});
      }
    }
    const [menuOpen, setMenuOpen] = useState(false);

    useEffect(() => {
      if (!sb) { setLoading(false); return; }
      (async () => {
        // Only ever ask the database for this trainer's own assigned clients —
        // never fetch every client's rows and filter them out afterwards.
        const profilesRes = await sb.from("client_profiles").select("*").eq("trainer_id", trainer.id);
        const names = (!profilesRes.error && profilesRes.data) ? profilesRes.data.map((p) => p.client_name) : [];
        if (!profilesRes.error && profilesRes.data) setProfiles(profilesRes.data);
        if (names.length === 0) { setAllEntries([]); setAllPayments([]); setLoading(false); return; }
        const [entriesRes, paymentsRes] = await Promise.all([
          sb.from("workout_entries").select("*").in("client_name", names).order("date", { ascending: false }),
          sb.from("client_payments").select("*").in("client_name", names)
        ]);
        if (!entriesRes.error && entriesRes.data) {
          setAllEntries(entriesRes.data.map((r) => ({ id: r.id, date: r.date, exercise: r.exercise, muscleGroup: r.muscle_group, sets: r.sets, clientName: r.client_name, workoutTitle: r.workout_title })));
        }
        if (!paymentsRes.error && paymentsRes.data) setAllPayments(paymentsRes.data);
        setLoading(false);
      })();
    }, []);

    const myClientNames = useMemo(() => new Set(profiles.map((p) => p.client_name)), [profiles]);

    const myEntries = useMemo(() => allEntries.filter((x) => myClientNames.has(x.clientName)), [allEntries, myClientNames]);
    const myPayments = useMemo(() => allPayments.filter((p) => myClientNames.has(p.client_name)), [allPayments, myClientNames]);

    const paidByName = useMemo(() => {
      const map = {};
      myPayments.forEach((p) => { map[p.client_name] = (map[p.client_name] || 0) + Number(p.amount); });
      return map;
    }, [myPayments]);

    const roster = useMemo(() => {
      const byClient = {};
      allEntries.forEach((x) => { if (myClientNames.has(x.clientName)) (byClient[x.clientName] = byClient[x.clientName] || []).push(x); });
      // Show every client assigned to this trainer, even ones with zero
      // logged sessions yet, so a brand-new assignment doesn't disappear.
      profiles.forEach((p) => { if (!byClient[p.client_name]) byClient[p.client_name] = []; });
      return Object.entries(byClient).map(([name, list]) => {
        const sessions = new Set(list.map((x) => x.date)).size;
        const lastDate = list.reduce((max, x) => (x.date > max ? x.date : max), list[0]?.date || "");
        const vol7 = computeWeekVolume(list);
        return { name, sessions, lastDate, vol7, entries: list };
      }).sort((a, b) => (a.lastDate < b.lastDate ? 1 : -1));
    }, [allEntries, myClientNames, profiles]);

    const profileByName = useMemo(() => {
      const map = {};
      profiles.forEach((p) => { map[p.client_name] = p; });
      return map;
    }, [profiles]);

    async function handleUpdateGoal(name, daysPerWeek) {
      if (!profileByName[name]) return;
      setProfiles((prev) => prev.map((p) => (p.client_name === name ? { ...p, days_per_week: daysPerWeek } : p)));
      if (sb) await sb.from("client_profiles").update({ days_per_week: daysPerWeek }).eq("client_name", name);
    }

    async function handleUpdateTotalDue(name, totalDue) {
      if (!profileByName[name]) return;
      setProfiles((prev) => prev.map((p) => (p.client_name === name ? { ...p, total_due: totalDue } : p)));
      if (sb) await sb.from("client_profiles").update({ total_due: totalDue }).eq("client_name", name);
    }

    async function handleUpdateProfileField(name, field, value) {
      if (!profileByName[name]) return;
      setProfiles((prev) => prev.map((p) => (p.client_name === name ? { ...p, [field]: value } : p)));
      if (sb) await sb.from("client_profiles").update({ [field]: value }).eq("client_name", name);
    }

    function balanceFor(name) {
      const cp = profileByName[name];
      if (!cp || cp.total_due == null) return null;
      return Number(cp.total_due) - (paidByName[name] || 0);
    }

    function goBackToRoster() {
      setSelectedClient(null);
      if (sb) {
        sb.from("client_profiles").select("*").eq("trainer_id", trainer.id).then(({ data, error }) => {
          if (error || !data) return;
          setProfiles(data);
          const names = data.map((p) => p.client_name);
          if (names.length === 0) { setAllPayments([]); return; }
          sb.from("client_payments").select("*").in("client_name", names).then(({ data: pData, error: pErr }) => { if (!pErr && pData) setAllPayments(pData); });
        });
      }
    }

    if (loading) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading your clients…"));

    if (selectedClient) {
      const client = roster.find((r) => r.name === selectedClient);
      const clientProfile = profileByName[client.name];

  function fmtRest(seconds) {
    if (!seconds && seconds !== 0) return "";
    if (seconds < 60) return `${seconds}s`;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return s ? `${m}m ${s}s` : `${m}m`;
  }

  // Tap-to-start rest timer. Counts down locally in the browser — no server
  // round trip needed, so it works instantly between sets.
  function RestTimerChip({ seconds }) {
    const [remaining, setRemaining] = useState(null);
    useEffect(() => {
      if (remaining === null || remaining <= 0) return;
      const id = setTimeout(() => setRemaining((r) => (r === null ? null : r - 1)), 1000);
      return () => clearTimeout(id);
    }, [remaining]);
    if (!seconds) return null;
    const running = remaining !== null && remaining > 0;
    const done = remaining === 0;
    function handleTap(ev) {
      ev.stopPropagation();
      setRemaining(seconds);
    }
    const mm = remaining != null ? Math.floor(remaining / 60) : 0;
    const ss = remaining != null ? remaining % 60 : 0;
    const label = running ? `${mm}:${String(ss).padStart(2, "0")}` : done ? "Rest done" : `Rest ${fmtRest(seconds)}`;
    return e("button", {
      style: {
        ...styles.setChip,
        cursor: "pointer",
        ...(running ? { color: C.brand, borderColor: withAlpha(C.brand, 0.4), background: C.brandSoft } : {}),
        ...(done ? { color: C.good, borderColor: withAlpha(C.good, 0.4), background: C.goodSoft } : {})
      },
      onClick: handleTap
    }, e(Icon, { name: "flame", size: 10, strokeWidth: 2.5 }), label);
  }

  function formatSetsReps(sets, reps) {

  // Parse what someone typed into that one field back into { sets, reps } for
  // storage. Accepts "3x8", "4 x 10-12", "3×8", etc. Anything that doesn't
  // look like "<number>x<rest>" is stored as reps only (sets left blank) so
  // free text like "AMRAP" or "to failure" still works.
  function parseSetsReps(text) {
    const trimmed = (text || "").trim();
    if (!trimmed) return { sets: null, reps: null };
    const match = trimmed.match(/^(\d+)\s*[x×]\s*(.+)$/i);
    if (match) return { sets: Number(match[1]), reps: match[2].trim() || null };
    return { sets: null, reps: trimmed };

  function TrainingLog() {

    const [titleFilter, setTitleFilter] = useState("All");
    const [dateFilter, setDateFilter] = useState("none");
    const [showForm, setShowForm] = useState(false);
    const [tab, setTab] = useState("log");
    const [statsRange, setStatsRange] = useState("week");
    const [statsMetric, setStatsMetric] = useState("volume");
    const [coachUnlocked, setCoachUnlocked] = useState(false);
    const isManager = !!userEmail && MANAGER_EMAILS.includes(userEmail.toLowerCase());

    useEffect(() => {

          const p = JSON.parse(raw);
          setAppName(p.appName || "JimFit");
        }
      } catch (err) {}
      if (!sb) { setNameChecked(true); return; }
      sb.auth.getSession().then(({ data }) => {
        const user = data.session && data.session.user;
        setClientName(deriveClientName(user));
        setUserId(user ? user.id : null);
        setUserEmail(user ? user.email : null);
        setNameChecked(true);
      });
      const { data: authListener } = sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") { setRecoveryMode(true); return; }
        const user = session && session.user;
        setClientName(deriveClientName(user));
        setUserId(user ? user.id : null);
        setUserEmail(user ? user.email : null);
      });
      return () => { authListener && authListener.subscription && authListener.subscription.unsubscribe(); };
    }, []);

    async function handleRecoveryDone() {
      const { data } = await sb.auth.getSession();
      const user = data.session && data.session.user;
      setClientName(deriveClientName(user));
      setUserId(user ? user.id : null);
      setUserEmail(user ? user.email : null);
      setRecoveryMode(false);
    }

    useEffect(() => {
      if (!userEmail || !sb) { setTrainerChecked(true); return; }
      setTrainerChecked(false);
      // Same reasoning as the client_profiles fetch below: avoid .maybeSingle()
      // so a stray duplicate trainer row (same email twice) can never make
      // the app fail to recognize a real trainer's login.
      sb.from("trainers").select("*").eq("email", userEmail).order("id", { ascending: true }).limit(1).then(async ({ data, error: err }) => {
        const trainerRow = !err && data && data.length ? data[0] : null;
        // Safety net: catches an already-open session too, not just fresh logins —
        // if their gym gets frozen while they're signed in, the next reload boots them.
        if (trainerRow && trainerRow.gym_id) {
          const { data: gymRow } = await sb.from("gyms").select("is_frozen").eq("id", trainerRow.gym_id).maybeSingle();
          if (gymRow && gymRow.is_frozen) {
            await sb.auth.signOut();
            setTrainerInfo(null);
            setClientName(null);
            setUserId(null);
            setUserEmail(null);
            setProfile(null);
            setTrainerChecked(true);

          }

        setTrainerInfo(trainerRow);
        setTrainerChecked(true);

    }, [userEmail]);

    useEffect(() => {
      if (!userId || trainerInfo || !sb) { setProfileChecked(true); return; }
      setProfileChecked(false);
      // Not .maybeSingle() on purpose: that call errors out (and silently
      // looks like "no profile") if this user_id ever has more than one row
      // — which is exactly what caused the duplicate-profile bug. Taking the
      // oldest row instead means a stray duplicate can never make the app
      // think someone has no profile and prompt them to make another one.
      sb.from("client_profiles").select("*").eq("user_id", userId).order("created_at", { ascending: true }).limit(1).then(({ data, error: err }) => {

      if (prevWeekVolume <= 0) return weekVolume > 0 ? { dir: "up", text: "new" } : null;

      if (pct === 0) return { dir: "flat", text: "flat" };

    async function handleSave() {
      const cleanSets = sets.map((s) => ({ reps: Number(s.reps), weight: Number(s.weight), rest: s.rest ? Number(s.rest) : null })).filter((s) => s.reps > 0 && !Number.isNaN(s.weight) && s.weight >= 0);
      if (!exercise.trim() || cleanSets.length === 0) {

        clearTimeout(errorTimer.current);
        errorTimer.current = setTimeout(() => setError(""), 3000);
        return;
      }
      if (!sb) { setError("Backend not configured yet."); return; }
      setSaving(true);
      const payload = { date, exercise: exercise.trim(), muscle_group: muscleGroup, workout_title: sessionTitle.trim() || null, sets: cleanSets };
      const { data, error: err } = editingId
        ? await sb.from("workout_entries").update(payload).eq("id", editingId).select()
        : await sb.from("workout_entries").insert([{ ...payload, client_name: clientName }]).select();

      if (err || !data) {
        setError("Couldn't save. Try again.");
        clearTimeout(errorTimer.current);
        errorTimer.current = setTimeout(() => setError(""), 3000);
        return;
      }
      const row = data[0];
      const mapped = { id: row.id, date: row.date, exercise: row.exercise, muscleGroup: row.muscle_group, sets: row.sets, workoutTitle: row.workout_title };

<script>
  // Service worker: makes the app resilient to a dropped connection mid-session
  // (e.g. spotty gym wifi) by falling back to the last-loaded copy instead of
  // going blank. It is deliberately network-FIRST, not cache-first — every visit
  // with a connection always fetches the live index.html, so updates still reach
  // every client automatically with no new link, exactly as before. The cache is
  // only ever used when there's truly no connection to fall back on.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
