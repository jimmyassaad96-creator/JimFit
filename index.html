  const ACTIVITY_LEVELS = [
    { key: "sedentary", label: "Sedentary — little/no exercise", mult: 1.2 },
    { key: "light", label: "Light — 1-3 days/week", mult: 1.375 },
    { key: "moderate", label: "Moderate — 3-5 days/week", mult: 1.55 },
    { key: "active", label: "Active — 6-7 days/week", mult: 1.725 },
    { key: "very_active", label: "Very active — 2x/day training", mult: 1.9 }
  ];
  const GOAL_TYPES = [
    { key: "cut", label: "Cut (fat loss)", mult: 0.8 },
    { key: "maintain", label: "Maintain", mult: 1.0 },
    { key: "lean_bulk", label: "Lean bulk", mult: 1.1 },
    { key: "bulk", label: "Bulk", mult: 1.2 }
  ];

  function defaultActivityKey(daysPerWeek) {
    const d = daysPerWeek || 3;
    if (d <= 1) return "sedentary";
    if (d <= 3) return "light";
    if (d <= 5) return "moderate";
    if (d <= 6) return "active";
    return "very_active";
  }

  // Suggests a daily calorie/macro target from the client's latest BMR reading, an activity
  // multiplier, and a goal adjustment — the trainer picks the levers, then applies the result.
  const FAT_PCT_OPTIONS = [0.2, 0.25, 0.3, 0.35];

  function CalorieCalculator({ latestAssessment, profile, onApply }) {
    const bmr = latestAssessment && latestAssessment.bmr;
    const bodyWeight = (latestAssessment && latestAssessment.weight) || (profile && profile.weight_kg);
    const [activityKey, setActivityKey] = useState(defaultActivityKey(profile && profile.days_per_week));
    const [goalKey, setGoalKey] = useState("maintain");
    const [fatPct, setFatPct] = useState(0.25);
    const [applied, setApplied] = useState(false);

    if (bmr == null) return null;

    const activity = ACTIVITY_LEVELS.find((a) => a.key === activityKey) || ACTIVITY_LEVELS[2];
    const goal = GOAL_TYPES.find((g) => g.key === goalKey) || GOAL_TYPES[1];
    const tdee = Math.round(bmr * activity.mult);
    const suggestedCalories = Math.round(tdee * goal.mult);
    const proteinPerKg = (profile && profile.gender === "Female") ? 1.6 : 2;
    const suggestedProtein = bodyWeight ? Math.round(bodyWeight * proteinPerKg) : null;
    const proteinCals = suggestedProtein ? suggestedProtein * 4 : 0;
    const suggestedFat = Math.round((suggestedCalories * fatPct) / 9);
    const fatCals = suggestedFat * 9;
    const suggestedCarbs = Math.max(0, Math.round((suggestedCalories - proteinCals - fatCals) / 4));

    return e("div", { style: { ...styles.card, marginBottom: 14 } },
      e("span", { style: styles.profileLabel }, "Calorie calculator (from BMR)"),
      e("div", { style: { display: "flex", gap: 10, marginTop: 8, marginBottom: 10, flexWrap: "wrap" } },
        e("select", { style: { ...styles.input, flex: "1 1 160px" }, value: activityKey, onChange: (ev) => { setActivityKey(ev.target.value); setApplied(false); } },
          ACTIVITY_LEVELS.map((a) => e("option", { key: a.key, value: a.key }, a.label))
        ),
        e("select", { style: { ...styles.input, flex: "1 1 120px" }, value: goalKey, onChange: (ev) => { setGoalKey(ev.target.value); setApplied(false); } },
          GOAL_TYPES.map((g) => e("option", { key: g.key, value: g.key }, g.label))
        )
      ),
      e("div", { style: { marginBottom: 10 } },
        e("span", { style: { ...styles.profileLabel, marginBottom: 6 } }, "Fat % of calories"),
        e("select", { style: styles.input, value: String(fatPct), onChange: (ev) => { setFatPct(Number(ev.target.value)); setApplied(false); } },
          FAT_PCT_OPTIONS.map((p) => e("option", { key: p, value: String(p) }, `${Math.round(p * 100)}% — carbs fill the rest`))
        )
      ),
      e("p", { style: { ...styles.profileGoalText, marginBottom: 6 } },
        `${bmr} kcal BMR × ${activity.mult} activity = ${tdee} kcal maintenance, × ${goal.mult} for ${goal.label.split(" (")[0].toLowerCase()} = `,
        e("span", { style: { color: C.brand, fontWeight: 700 } }, `${suggestedCalories} kcal/day`)
      ),
      e("p", { style: { ...styles.profileGoalText, marginBottom: 12, fontSize: 12 } },
        bodyWeight != null
          ? `Suggested split (protein at ${proteinPerKg}g/kg, fat at ${Math.round(fatPct * 100)}%): ${suggestedProtein}g protein · ${suggestedCarbs}g carbs · ${suggestedFat}g fat`
          : "Add a body weight in Assessments to also get a suggested macro split."
      ),
      e("button", {
        style: { ...styles.saveBtn, marginTop: 0, ...(applied ? { background: C.good } : {}) },
        onClick: () => { onApply({ calories: suggestedCalories, protein: suggestedProtein, carbs: suggestedCarbs, fat: suggestedFat }); setApplied(true); }
      }, applied ? "Applied to targets ✓" : "Apply to daily targets")
    );
  }

  function DietPanel({ userId, clientName, canManage = false, profile, onUnlockDietPlan }) {
    const [plan, setPlan] = useState(null);
    const [planLoaded, setPlanLoaded] = useState(false);
    const [logs, setLogs] = useState([]);
    const [logsLoaded, setLogsLoaded] = useState(false);
    const [latestAssessment, setLatestAssessment] = useState(null);
    const [mealPlanDraft, setMealPlanDraft] = useState("");
    const [editingMealPlan, setEditingMealPlan] = useState(false);
    const [unlocking, setUnlocking] = useState(false);
    const [unlockAmount, setUnlockAmount] = useState("");
    const [unlockDate, setUnlockDate] = useState(todayISO());
    const [unlockSaving, setUnlockSaving] = useState(false);
    const [unlockError, setUnlockError] = useState("");
    const [mealItems, setMealItems] = useState([]);
    const [mealItemsLoaded, setMealItemsLoaded] = useState(false);
    const [addMealTarget, setAddMealTarget] = useState(null); // meal_label — add a food item to this existing meal
    const [newMealOpen, setNewMealOpen] = useState(false); // adding a brand-new meal (with its own label)
    const [editMealItemId, setEditMealItemId] = useState(null);
    const [mealItemForm, setMealItemForm] = useState(BLANK_MEAL_ITEM_FORM);
    const [mealItemSaving, setMealItemSaving] = useState(false);
    const [mealItemError, setMealItemError] = useState("");
    const [logDate, setLogDate] = useState(todayISO());
    const [logCalories, setLogCalories] = useState("");
    const [logProtein, setLogProtein] = useState("");
    const [logCarbs, setLogCarbs] = useState("");
    const [logFat, setLogFat] = useState("");

  // ---- trainer view ----

  // A lightweight, gym-scoped version of the Owner dashboard — for a self-serve
  // gym owner (trainer.is_owner) to run their own gym: see their invite code
  // and assign their gym's clients to trainers. They can no longer add other
  // trainers here — only the manager (Owner dashboard) adds trainers now.
  // Completely separate from CoachView — never touches or shows any other gym's data.
  function GymOwnerView({ trainer }) {
    const [loading, setLoading] = useState(true);
    const [gym, setGym] = useState(null);
    const [gymTrainers, setGymTrainers] = useState([]);
    const [gymClients, setGymClients] = useState([]);
    const [copied, setCopied] = useState(false);

    async function load() {
      if (!sb || !trainer.gym_id) { setLoading(false); return; }
      setLoading(true);
      const [gymRes, trainersRes, clientsRes] = await Promise.all([
        sb.from("gyms").select("*").eq("id", trainer.gym_id).maybeSingle(),
        sb.from("trainers").select("*").eq("gym_id", trainer.gym_id).order("name", { ascending: true }),
        sb.from("client_profiles").select("*").eq("gym_id", trainer.gym_id)
      ]);
      if (!gymRes.error && gymRes.data) setGym(gymRes.data);
      if (!trainersRes.error && trainersRes.data) setGymTrainers(trainersRes.data);
      if (!clientsRes.error && clientsRes.data) setGymClients(clientsRes.data);
      setLoading(false);
    }
    useEffect(() => { load(); }, []);

    function copyCode() {
      if (!trainer.invite_code) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(trainer.invite_code).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);
        }).catch(() => {});
      }
    }

    async function handleAssign(clientName, trainerId) {
      setGymClients((prev) => prev.map((p) => (p.client_name === clientName ? { ...p, trainer_id: trainerId || null } : p)));
      if (sb) await sb.from("client_profiles").update({ trainer_id: trainerId || null }).eq("client_name", clientName).eq("gym_id", trainer.gym_id);
    }

    if (loading) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading your gym…"));
    if (!gym) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Couldn't load your gym."));

    const trainerOptions = [{ value: "", label: "Unassigned" }, ...gymTrainers.map((t) => ({ value: t.id, label: t.name }))];

    return e("div", { style: { padding: "0 18px 24px" } },
      e("div", { style: { ...styles.profileSummary, marginBottom: 20 } },
        e("div", { style: { fontSize: 13, color: C.ink3, marginBottom: 4 } }, gym.name),
        e("div", { style: { fontSize: 12, color: C.ink3, marginBottom: 10 } }, "Share your invite code with clients — they enter it when they sign up so they land with you directly."),
        e("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
          e("span", { style: { fontFamily: "monospace", fontSize: 20, fontWeight: 700, letterSpacing: 2, padding: "6px 12px", background: withAlpha(C.brand, 0.1), borderRadius: 8 } }, trainer.invite_code || "—"),
          trainer.invite_code && e("button", { style: styles.switchModeBtn, onClick: copyCode }, copied ? "Copied!" : "Copy")
        )
      ),
      e("div", { style: styles.sectionHead },
        e("span", { style: styles.sectionTitle }, "Your trainers")
      ),
      gymTrainers.length === 0
        ? e("p", { style: { ...styles.emptyText, marginBottom: 20 } }, "No trainers yet — you're the only one in this gym so far.")
        : e("div", { style: { display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 } }, gymTrainers.map((t) => e("div", { key: t.id, style: styles.clientCard },
            e("div", { style: { display: "flex", flexDirection: "column" } },
              e("span", { style: styles.exerciseName }, t.name, t.is_owner ? " (you)" : ""),
              e("span", { style: styles.muscleSubText }, t.email)
            )
          ))),
      e("div", { style: styles.sectionHead }, e("span", { style: styles.sectionTitle }, "Your clients")),
      gymClients.length === 0
        ? e("p", { style: styles.emptyText }, "No clients have signed up with your invite code yet.")
        : e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, gymClients.map((c) => e("div", { key: c.client_name, style: styles.clientCard },
            e("div", { style: { display: "flex", flexDirection: "column" } },
              e("span", { style: styles.exerciseName }, c.client_name)
            ),
            e(Select, { value: c.trainer_id || "", onChange: (v) => handleAssign(c.client_name, v), options: trainerOptions, style: { minWidth: 140 } })
          )))
    );
  }

    const [loading, setLoading] = useState(true);

    const [dateFilter, setDateFilter] = useState("none");
    const [statsRange, setStatsRange] = useState("week");
    const [statsMetric, setStatsMetric] = useState("volume");
    const [detailTab, setDetailTab] = useState("log");
    // Gym owners land straight on "My gym" (where their invite code lives) —
    // otherwise a brand-new self-serve owner opens the app to an empty "My
    // clients" list with no hint that the code is tucked in the side menu.
    const [trainerTab, setTrainerTab] = useState(trainer.is_owner ? "mygym" : "clients");
    const [allPayments, setAllPayments] = useState([]);
    const [headerCodeCopied, setHeaderCodeCopied] = useState(false);
    // Every trainer gets their own invite code (set when the manager adds
    // them) — shown right in the header, on every tab, so it's never hidden
    // behind a menu. Clients enter this code to land directly with this trainer.
    const headerGymCode = trainer.invite_code || null;

    function copyHeaderCode() {
      if (!headerGymCode) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(headerGymCode).then(() => {
          setHeaderCodeCopied(true);
          setTimeout(() => setHeaderCodeCopied(false), 1800);
        }).catch(() => {});
      }
    }
    const [menuOpen, setMenuOpen] = useState(false);

    useEffect(() => {
      if (!sb) { setLoading(false); return; }
      (async () => {
        // Only ever ask the database for this trainer's own assigned clients —
        // never fetch every client's rows and filter them out afterwards.
        const profilesRes = await sb.from("client_profiles").select("*").eq("trainer_id", trainer.id);
        const names = (!profilesRes.error && profilesRes.data) ? profilesRes.data.map((p) => p.client_name) : [];
        if (!profilesRes.error && profilesRes.data) setProfiles(profilesRes.data);
        if (names.length === 0) { setAllEntries([]); setAllPayments([]); setLoading(false); return; }
        const [entriesRes, paymentsRes] = await Promise.all([
          sb.from("workout_entries").select("*").in("client_name", names).order("date", { ascending: false }),
          sb.from("client_payments").select("*").in("client_name", names)
        ]);
        if (!entriesRes.error && entriesRes.data) {
          setAllEntries(entriesRes.data.map((r) => ({ id: r.id, date: r.date, exercise: r.exercise, muscleGroup: r.muscle_group, sets: r.sets, clientName: r.client_name, workoutTitle: r.workout_title })));
        }
        if (!paymentsRes.error && paymentsRes.data) setAllPayments(paymentsRes.data);
        setLoading(false);
      })();
    }, []);

    const myClientNames = useMemo(() => new Set(profiles.map((p) => p.client_name)), [profiles]);

    const myEntries = useMemo(() => allEntries.filter((x) => myClientNames.has(x.clientName)), [allEntries, myClientNames]);
    const myPayments = useMemo(() => allPayments.filter((p) => myClientNames.has(p.client_name)), [allPayments, myClientNames]);

    const paidByName = useMemo(() => {
      const map = {};
      myPayments.forEach((p) => { map[p.client_name] = (map[p.client_name] || 0) + Number(p.amount); });
      return map;
    }, [myPayments]);

    const roster = useMemo(() => {
      const byClient = {};
      allEntries.forEach((x) => { if (myClientNames.has(x.clientName)) (byClient[x.clientName] = byClient[x.clientName] || []).push(x); });
      // Show every client assigned to this trainer, even ones with zero
      // logged sessions yet, so a brand-new assignment doesn't disappear.
      profiles.forEach((p) => { if (!byClient[p.client_name]) byClient[p.client_name] = []; });
      return Object.entries(byClient).map(([name, list]) => {
        const sessions = new Set(list.map((x) => x.date)).size;
        const lastDate = list.reduce((max, x) => (x.date > max ? x.date : max), list[0]?.date || "");
        const vol7 = computeWeekVolume(list);
        return { name, sessions, lastDate, vol7, entries: list };
      }).sort((a, b) => (a.lastDate < b.lastDate ? 1 : -1));
    }, [allEntries, myClientNames, profiles]);

    const profileByName = useMemo(() => {
      const map = {};
      profiles.forEach((p) => { map[p.client_name] = p; });
      return map;
    }, [profiles]);

    async function handleUpdateGoal(name, daysPerWeek) {
      if (!profileByName[name]) return;
      setProfiles((prev) => prev.map((p) => (p.client_name === name ? { ...p, days_per_week: daysPerWeek } : p)));
      if (sb) await sb.from("client_profiles").update({ days_per_week: daysPerWeek }).eq("client_name", name);
    }

    async function handleUpdateTotalDue(name, totalDue) {
      if (!profileByName[name]) return;
      setProfiles((prev) => prev.map((p) => (p.client_name === name ? { ...p, total_due: totalDue } : p)));
      if (sb) await sb.from("client_profiles").update({ total_due: totalDue }).eq("client_name", name);
    }

    async function handleUpdateProfileField(name, field, value) {
      if (!profileByName[name]) return;
      setProfiles((prev) => prev.map((p) => (p.client_name === name ? { ...p, [field]: value } : p)));
      if (sb) await sb.from("client_profiles").update({ [field]: value }).eq("client_name", name);
    }

    function balanceFor(name) {
      const cp = profileByName[name];
      if (!cp || cp.total_due == null) return null;
      return Number(cp.total_due) - (paidByName[name] || 0);
    }

    function goBackToRoster() {

                e("button", { style: styles.deleteBtn, onClick: () => handleDeleteProgram(p.id), "aria-label": "Delete program" }, e(Icon, { name: "trash", size: 15 }))
              )
            ),

          e("div", { style: styles.dayHead }, day.label),
          e("div", { style: { display: "flex", flexDirection: "column", gap: 8, marginTop: 8 } },
            day.rows.map((ex) => (

                ? e(ExerciseForm, { key: ex.id, values: form, onChange: setForm, onSave: handleSaveExercise, onCancel: closeExerciseForm, saving, showDayField: true, saveLabel: "Save changes" })
                : e(ProgramExerciseRow, { key: ex.id, ex, canManage, onEdit: (row) => openEditRow(p.id, row), onDelete: (id) => handleDeleteExercise(p.id, id) })
            ))
          ),
          canManage && (
            addTarget && addTarget.programId === p.id && addTarget.dayLabel === day.label
              ? e(ExerciseForm, { values: form, onChange: setForm, onSave: handleSaveExercise, onCancel: closeExerciseForm, saving, showDayField: false })
              : e("button", { style: styles.demoLinkBtn, onClick: () => openAddToDay(p.id, day.label) }, "+ Add exercise")
          )
        )),
        canManage && e("div", { style: { marginTop: 16 } },
          newDayFor === p.id
            ? e(ExerciseForm, { values: form, onChange: setForm, onSave: handleSaveExercise, onCancel: closeExerciseForm, saving, showDayField: true, saveLabel: "Add day" })
            : e("button", { style: styles.demoLinkBtn, onClick: () => openAddNewDay(p.id) }, "+ Add a new day")
        )
      ))
    );
  }

  // ---- main app ----

  function TrainingLog() {
    const [welcomeSeen, setWelcomeSeen] = useState(false);
    const [clientName, setClientName] = useState(null);
    const [userId, setUserId] = useState(null);
    const [userEmail, setUserEmail] = useState(null);
    const [nameChecked, setNameChecked] = useState(false);
    const [recoveryMode, setRecoveryMode] = useState(false);
    const [trainerChecked, setTrainerChecked] = useState(false);
    const [trainerInfo, setTrainerInfo] = useState(null);
    const [profileChecked, setProfileChecked] = useState(false);
    const [profile, setProfile] = useState(null);
    const [loaded, setLoaded] = useState(false);
    const [entries, setEntries] = useState([]);
    const unit = "kg"; // locked to kg — no lb toggle
    const [appName, setAppName] = useState("JimFit");
    const [editingName, setEditingName] = useState(false);
    const [nameDraft, setNameDraft] = useState("");
    const [titleFilter, setTitleFilter] = useState("All");
    const [dateFilter, setDateFilter] = useState("none");
    const [showForm, setShowForm] = useState(false);
    const [tab, setTab] = useState("log");
    const [statsRange, setStatsRange] = useState("week");
    const [statsMetric, setStatsMetric] = useState("volume");
    const [coachUnlocked, setCoachUnlocked] = useState(false);
    const isManager = !!userEmail && MANAGER_EMAILS.includes(userEmail.toLowerCase());
    const [editingId, setEditingId] = useState(null);
    const [date, setDate] = useState(todayISO());
    const [sessionTitle, setSessionTitle] = useState("");
    const [exercise, setExercise] = useState("");
    const [muscleGroup, setMuscleGroup] = useState("Full Body");
    const [muscleTouched, setMuscleTouched] = useState(false);
    const [sets, setSets] = useState([{ reps: "", weight: "", rest: "" }]);
    const [saving, setSaving] = useState(false);
    const errorTimer = useRef(null);
    const [error, setError] = useState("");

    useEffect(() => {
      try {
        const raw = localStorage.getItem(PREF_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          setAppName(p.appName || "JimFit");
        }
      } catch (err) {}
      if (!sb) { setNameChecked(true); return; }
      sb.auth.getSession().then(({ data }) => {
        const user = data.session && data.session.user;
        setClientName(deriveClientName(user));
        setUserId(user ? user.id : null);
        setUserEmail(user ? user.email : null);
        setNameChecked(true);
      });
      const { data: authListener } = sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") { setRecoveryMode(true); return; }
        const user = session && session.user;
        setClientName(deriveClientName(user));
        setUserId(user ? user.id : null);
        setUserEmail(user ? user.email : null);
      });
      return () => { authListener && authListener.subscription && authListener.subscription.unsubscribe(); };
    }, []);

    async function handleRecoveryDone() {
      const { data } = await sb.auth.getSession();
      const user = data.session && data.session.user;
      setClientName(deriveClientName(user));
      setUserId(user ? user.id : null);
      setUserEmail(user ? user.email : null);
      setRecoveryMode(false);
    }

    useEffect(() => {
      if (!userEmail || !sb) { setTrainerChecked(true); return; }
      setTrainerChecked(false);
      // Same reasoning as the client_profiles fetch below: avoid .maybeSingle()
      // so a stray duplicate trainer row (same email twice) can never make
      // the app fail to recognize a real trainer's login.
      sb.from("trainers").select("*").eq("email", userEmail).order("id", { ascending: true }).limit(1).then(async ({ data, error: err }) => {
        const trainerRow = !err && data && data.length ? data[0] : null;
        // Safety net: catches an already-open session too, not just fresh logins —
        // if their gym gets frozen while they're signed in, the next reload boots them.
        if (trainerRow && trainerRow.gym_id) {
          const { data: gymRow } = await sb.from("gyms").select("is_frozen").eq("id", trainerRow.gym_id).maybeSingle();
          if (gymRow && gymRow.is_frozen) {
            await sb.auth.signOut();
            setTrainerInfo(null);
            setClientName(null);
            setUserId(null);
            setUserEmail(null);
            setProfile(null);
            setTrainerChecked(true);
            return;
          }
        }
        setTrainerInfo(trainerRow);
        setTrainerChecked(true);
      });
    }, [userEmail]);

    useEffect(() => {
      if (!userId || trainerInfo || !sb) { setProfileChecked(true); return; }
      setProfileChecked(false);
      // Not .maybeSingle() on purpose: that call errors out (and silently
      // looks like "no profile") if this user_id ever has more than one row
      // — which is exactly what caused the duplicate-profile bug. Taking the
      // oldest row instead means a stray duplicate can never make the app
      // think someone has no profile and prompt them to make another one.
      sb.from("client_profiles").select("*").eq("user_id", userId).order("created_at", { ascending: true }).limit(1).then(({ data, error: err }) => {
        setProfile(!err && data && data.length ? data[0] : null);
        setProfileChecked(true);
      });
    }, [userId, trainerInfo]);

    const [myTrainerName, setMyTrainerName] = useState(null);
    useEffect(() => {
      if (!sb || !profile || !profile.trainer_id) { setMyTrainerName(null); return; }
      sb.from("trainers").select("name").eq("id", profile.trainer_id).maybeSingle().then(({ data, error: err }) => {
        setMyTrainerName(!err && data ? data.name : null);
      });
    }, [profile && profile.trainer_id]);

    useEffect(() => {
      if (!clientName || !sb) { setLoaded(true); return; }
      sb.from("workout_entries").select("*").eq("client_name", clientName).order("date", { ascending: false }).then(({ data, error: err }) => {
        if (!err && data) setEntries(data.map((r) => ({ id: r.id, date: r.date, exercise: r.exercise, muscleGroup: r.muscle_group, sets: r.sets, workoutTitle: r.workout_title })));
        setLoaded(true);
      });
    }, [clientName]);

    function persistPrefs(nextName) {
      localStorage.setItem(PREF_KEY, JSON.stringify({ appName: nextName !== undefined ? nextName : appName }));
    }
    async function handleLogout() {
      // Always clear local state, even if signOut hangs or errors (a stale
      // or already-invalid session can do this) — otherwise "Log out" can
      // look completely dead with nothing on screen telling you why.
      try {
        if (sb) await sb.auth.signOut();
      } catch (err) {}
      setClientName(null);
      setUserId(null);
      setUserEmail(null);
      setTrainerInfo(null);
      setProfile(null);
    }

    const weekVolume = useMemo(() => computeWeekVolume(entries), [entries]);
    const prevWeekVolume = useMemo(() => computePrevWeekVolume(entries), [entries]);
    const delta = useMemo(() => {
      if (prevWeekVolume <= 0) return weekVolume > 0 ? { dir: "up", text: "new" } : null;
      const pct = Math.round(((weekVolume - prevWeekVolume) / prevWeekVolume) * 100);
      if (pct === 0) return { dir: "flat", text: "flat" };
      return { dir: pct > 0 ? "up" : "down", text: `${pct > 0 ? "+" : ""}${pct}%` };
    }, [weekVolume, prevWeekVolume]);

    function updateSetRow(idx, field, val) { setSets((p) => p.map((s, i) => (i === idx ? { ...s, [field]: val } : s))); }
    function addSetRow() { setSets((p) => [...p, { reps: "", weight: "", rest: "" }]); }
    function removeSetRow(idx) { setSets((p) => (p.length === 1 ? p : p.filter((_, i) => i !== idx))); }
    function handleExerciseChange(val) { setExercise(val); if (!muscleTouched) setMuscleGroup(guessMuscleGroup(val)); }
    function resetForm() { setDate(todayISO()); setExercise(""); setMuscleGroup("Full Body"); setMuscleTouched(false); setSets([{ reps: "", weight: "", rest: "" }]); setEditingId(null); }
    function openNewExercise() { setEditingId(null); resetForm(); setShowForm(true); }
    function closeSheet() { setShowForm(false); setEditingId(null); }
    function startEdit(entry) {
      setEditingId(entry.id);
      setDate(entry.date);
      setSessionTitle(entry.workoutTitle || "");
      setExercise(entry.exercise);
      setMuscleGroup(entry.muscleGroup || "Full Body");
      setMuscleTouched(true);
      setSets(entry.sets.map((s) => ({ reps: String(s.reps), weight: String(s.weight), rest: s.rest != null ? String(s.rest) : "" })));
      setShowForm(true);
    }
    function startDuplicate(entry) {
      setEditingId(null);
      setDate(todayISO());
      setSessionTitle(entry.workoutTitle || "");
      setExercise(entry.exercise);
      setMuscleGroup(entry.muscleGroup || "Full Body");
      setMuscleTouched(true);
      setSets(entry.sets.map((s) => ({ reps: String(s.reps), weight: String(s.weight), rest: s.rest != null ? String(s.rest) : "" })));
      setShowForm(true);
    }

    async function handleSave() {
      const cleanSets = sets.map((s) => ({ reps: Number(s.reps), weight: Number(s.weight), rest: s.rest ? Number(s.rest) : null })).filter((s) => s.reps > 0 && !Number.isNaN(s.weight) && s.weight >= 0);
      if (!exercise.trim() || cleanSets.length === 0) {
        setError("Add an exercise and at least one valid set.");
        clearTimeout(errorTimer.current);
        errorTimer.current = setTimeout(() => setError(""), 3000);
        return;
      }
      if (!sb) { setError("Backend not configured yet."); return; }
      setSaving(true);
      const payload = { date, exercise: exercise.trim(), muscle_group: muscleGroup, workout_title: sessionTitle.trim() || null, sets: cleanSets };
      const { data, error: err } = editingId
        ? await sb.from("workout_entries").update(payload).eq("id", editingId).select()
        : await sb.from("workout_entries").insert([{ ...payload, client_name: clientName }]).select();
      setSaving(false);
      if (err || !data) {
        setError("Couldn't save. Try again.");
        clearTimeout(errorTimer.current);
        errorTimer.current = setTimeout(() => setError(""), 3000);
        return;
      }
      const row = data[0];
      const mapped = { id: row.id, date: row.date, exercise: row.exercise, muscleGroup: row.muscle_group, sets: row.sets, workoutTitle: row.workout_title };
      setEntries((prev) => (editingId ? prev.map((x) => (x.id === editingId ? mapped : x)) : [mapped, ...prev]));
      resetForm();
      setShowForm(false);
    }
    async function handleDelete(id) {
      setEntries((prev) => prev.filter((x) => x.id !== id));
      if (sb) await sb.from("workout_entries").delete().eq("id", id);
    }
    function startEditingName() { setNameDraft(appName); setEditingName(true); }
    function commitName() {
      const trimmed = nameDraft.trim();
      const nextName = trimmed || appName;
      setAppName(nextName);
      setEditingName(false);
      persistPrefs(nextName);
    }

    if (!nameChecked) return null;
    if (recoveryMode) return e(ResetPasswordScreen, { onDone: handleRecoveryDone });
    if (!clientName) {
      if (!welcomeSeen) return e(WelcomeGate, { onContinue: () => setWelcomeSeen(true) });
      return e(AuthGate, {});
    }
    if (!trainerChecked) return null;
    if (trainerInfo) return e(TrainerView, { trainer: trainerInfo, onLogout: handleLogout });
    if (!profileChecked) return null;
    if (!profile) return e(ProfileGate, { userId, clientName, onDone: (p) => setProfile(p) });

    return e("div", { style: styles.app },
      e("header", { style: styles.header },
        e("div", { style: styles.headerLeft },
          e(BrandMark, { size: 34 }),
          editingName
            ? e("input", {
                autoFocus: true, value: nameDraft, onChange: (ev) => setNameDraft(ev.target.value), onBlur: commitName,
                onKeyDown: (ev) => { if (ev.key === "Enter") commitName(); if (ev.key === "Escape") setEditingName(false); },
                maxLength: 28, style: styles.titleInput
              })
            : e("h1", { style: styles.title, onClick: startEditingName, title: "Tap to rename" }, appName),
          myTrainerName && e("span", {
            title: "Your trainer",
            style: {
              display: "flex", alignItems: "center", gap: 6, marginLeft: 4,
              background: withAlpha(C.brand, 0.12), color: C.brand, borderRadius: 20, padding: "4px 10px",
              fontFamily: "'JetBrains Mono', monospace", fontSize: 11, fontWeight: 700, letterSpacing: 0.5
            }
          }, myTrainerName)
        ),
        e("div", { style: styles.headerRight },
          e(StatTile, { label: "7-day volume", value: weekVolume, unit, delta }),
          e("button", { style: styles.logoutBtn, onClick: handleLogout }, e(Icon, { name: "logout", size: 13 }), "Log out")
        )
      ),
      tab === "log" && e(React.Fragment, null,
        e("div", { style: { padding: "16px 18px 0", display: "flex", justifyContent: "flex-end" } },
          e("button", { style: styles.newBtn, onClick: openNewExercise }, e(Icon, { name: "plus", size: 15, strokeWidth: 3 }), "New exercise")
        ),
        error && e("div", { style: styles.errorBanner }, e(Icon, { name: "x", size: 13, color: C.critical }), error),
        !loaded ? e("div", { style: styles.empty }, "Loading your log…") : e(LogFeed, { entries, unit, titleFilter, setTitleFilter, dateFilter, setDateFilter, onDelete: handleDelete, onEdit: startEdit, onDuplicate: startDuplicate })
      ),
      tab === "stats" && e(StatsPanel, { entries, unit, statsRange, setStatsRange, statsMetric, setStatsMetric }),
      tab === "progress" && e("div", { style: { padding: "16px 18px 0" } },
        e(WeeklyRecapCard, { entries, daysPerWeek: profile ? profile.days_per_week : null }),
        e(MilestoneBadges, { entries }),
        e(ProgressPanel, { userId, clientName, canManage: true }),
        profile && e(SessionGoalCard, { entries, daysPerWeek: profile.days_per_week }),
        e(TrainingHeatmap, { entries }),
        e(PersonalRecordsPanel, { entries, unit }),
        e("div", { style: { ...styles.sectionHead, marginTop: 28 } }, e("span", { style: styles.sectionTitle }, "Body composition")),
        e(AssessmentPanel, { userId, clientName, canManage: false }),
        e("div", { style: { ...styles.sectionHead, marginTop: 28 } }, e("span", { style: styles.sectionTitle }, "Measurements")),
        e(MeasurementsPanel, { userId, clientName, canManage: false }),
        e("div", { style: { ...styles.sectionHead, marginTop: 28 } }, e("span", { style: styles.sectionTitle }, "Payments")),
        e(PaymentsPanel, { userId, clientName, canManage: false, totalDue: profile ? profile.total_due : null }),
        e("div", { style: { ...styles.sectionHead, marginTop: 28 } }, e("span", { style: styles.sectionTitle }, "Diet plan")),
        e(DietPanel, { userId, clientName, canManage: false, profile })
      ),
      tab === "programs" && e("div", { style: { padding: "16px 18px 0" } }, e(ProgramsPanel, { canManage: isManager, clientName })),
      tab === "coach" && isManager && e(CoachView, { unlocked: coachUnlocked, onUnlock: () => setCoachUnlocked(true) }),
      e("nav", { style: styles.bottomNav }, [
        { id: "log", icon: "dumbbell", label: "Log" },
        { id: "stats", icon: "activity", label: "Muscles" },
        { id: "progress", icon: "camera", label: "Progress" },
        { id: "programs", icon: "calendar", label: "Programs" },
        isManager && { id: "coach", icon: "users", label: "Owner" }
      ].filter(Boolean).map((n) => e("button", { key: n.id, style: styles.navBtn, onClick: () => setTab(n.id) },
        e("span", { style: { ...styles.navIndicator, ...(tab === n.id ? styles.navIndicatorActive : {}) } }),
        e(Icon, { name: n.icon, size: 18, color: tab === n.id ? C.brand : C.ink3 }),
        e("span", { style: { color: tab === n.id ? C.brand : C.ink3 } }, n.label)
      ))),
      showForm && e("div", { style: styles.overlay, onClick: closeSheet },
        e("div", { style: styles.sheet, onClick: (ev) => ev.stopPropagation() },
          e("div", { style: styles.sheetHeader },
            e("span", { style: styles.sheetTitle }, editingId ? "Edit exercise" : "New exercise"),
            e("button", { style: styles.closeBtn, onClick: closeSheet }, e(Icon, { name: "x", size: 18 }))
          ),
          e("label", { style: styles.formLabel }, "Date"),
          e("input", { type: "date", value: date, onChange: (ev) => setDate(ev.target.value), style: styles.input }),
          e("label", { style: styles.formLabel }, "Workout title (optional)"),
          e("input", { list: "workout-title-suggestions", type: "text", value: sessionTitle, placeholder: "e.g. Push, Legs, Upper Body", onChange: (ev) => setSessionTitle(ev.target.value), style: styles.input }),
          e("datalist", { id: "workout-title-suggestions" }, WORKOUT_TITLES.map((t) => e("option", { key: t, value: t }))),
          e("label", { style: styles.formLabel }, "Exercise"),
          e("input", { list: "lift-suggestions", type: "text", value: exercise, placeholder: "e.g. Bench Press", onChange: (ev) => handleExerciseChange(ev.target.value), style: styles.input }),
          e("datalist", { id: "lift-suggestions" }, COMMON_LIFTS.map((l) => e("option", { key: l, value: l }))),
          e("label", { style: styles.formLabel }, "Muscle group"),
          e(Select, { value: muscleGroup, onChange: (v) => { setMuscleGroup(v); setMuscleTouched(true); }, options: MUSCLE_GROUPS, style: { width: "100%" } }),
          e("label", { style: styles.formLabel }, "Sets"),
          e("div", { style: styles.setRows },
            e("div", { style: styles.setRowHeader }, e("span", { style: styles.setColLabel }, "SET"), e("span", { style: styles.setColLabel }, "REPS"), e("span", { style: styles.setColLabel }, `WEIGHT (${unit.toUpperCase()})`), e("span", { style: styles.setColLabel }, "REST (S)"), e("span", null)),
            sets.map((s, i) => e("div", { key: i, style: styles.setRow },
              e("span", { style: styles.setIndex }, i + 1),
              e("input", { type: "number", min: "0", value: s.reps, onChange: (ev) => updateSetRow(i, "reps", ev.target.value), style: styles.setInput, placeholder: "8" }),
              e("input", { type: "number", min: "0", step: "0.5", value: s.weight, onChange: (ev) => updateSetRow(i, "weight", ev.target.value), style: styles.setInput, placeholder: "60" }),
              e("input", { type: "number", min: "0", value: s.rest, onChange: (ev) => updateSetRow(i, "rest", ev.target.value), style: styles.setInput, placeholder: "90" }),
              e("button", { style: styles.rowDelete, onClick: () => removeSetRow(i), disabled: sets.length === 1, "aria-label": "Remove set" }, e(Icon, { name: "x", size: 14 }))
            ))
          ),
          e("button", { style: styles.addSetBtn, onClick: addSetRow }, e(Icon, { name: "plus", size: 13, strokeWidth: 3 }), "Add set"),
          e("button", { style: { ...styles.saveBtn, ...(saving ? styles.btnDisabled : {}) }, onClick: handleSave, disabled: saving }, e(Icon, { name: "flame", size: 16 }), saving ? "Saving…" : editingId ? "Save changes" : "Save entry")
        )
      )
    );
  }

  const styles = {

    avatar: { width: 36, height: 36, borderRadius: "50%", background: C.brandSoft, color: C.brand, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 14, flexShrink: 0 },
    rosterVol: { fontFamily: "'JetBrains Mono', monospace", fontSize: 15, fontWeight: 700, color: C.brand },

    programCard: { background: C.card, border: `1px solid ${C.cardBorder}`, borderRadius: 14, padding: "16px 16px 18px", marginTop: 16 },
    programHeader: { display: "flex", flexDirection: "column", gap: 2 },
    dayHead: { fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: C.brand, fontWeight: 600 },
    programExerciseRow: { background: "rgba(255,255,255,0.03)", border: `1px solid ${C.cardBorder}`, borderRadius: 10, padding: "10px 12px" }
  };

  const root = ReactDOM.createRoot(document.getElementById("root"));
  // Guarantee the branded splash (#__strain_loading, in the static HTML
  // above) is visible for at least MIN_SPLASH_MS from true page-load start
  // (stamped at the very top of <head>, before the CDN scripts). On a fast
  // / cached connection the whole boot can finish in well under a frame,
  // which made the splash invisible in practice. On a slow connection this
  // adds no extra wait at all, since the CDN load already ate the budget.
  var MIN_SPLASH_MS = 550;
  var __bootStart = window.__jimfitBootStart || Date.now();
  var __wait = Math.max(0, MIN_SPLASH_MS - (Date.now() - __bootStart));
  setTimeout(function () { root.render(e(TrainingLog, null)); }, __wait);
})();
</script>
<script>
  // Service worker: makes the app resilient to a dropped connection mid-session
  // (e.g. spotty gym wifi) by falling back to the last-loaded copy instead of
  // going blank. It is deliberately network-FIRST, not cache-first — every visit
  // with a connection always fetches the live index.html, so updates still reach
  // every client automatically with no new link, exactly as before. The cache is
  // only ever used when there's truly no connection to fall back on.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
