<script>
  function showDiag(title, detail) {
    var root = document.getElementById("root");
    if (!root) return;
    root.innerHTML = '<div style="min-height:100vh;background:#0B1526;color:#EDBAB3;font-family:monospace;padding:24px;white-space:pre-wrap;line-height:1.5;">' +
      '<h2 style="color:#C1443A;margin-bottom:12px;">' + title + '</h2>' +
      '<div style="color:#B0A991;font-size:13px;">' + detail + '</div>' +
      '</div>';
  }
  var OUR_CDN_HOSTS = ["unpkg.com", "cdn.jsdelivr.net", "fonts.googleapis.com"];
  function isOurResource(url) {
    if (!url) return false;
    try {
      var host = new URL(url, location.href).hostname;
      return OUR_CDN_HOSTS.indexOf(host) !== -1;
    } catch (e) { return false; }
  }
  function isFromExtension(filename) {
    return !!filename && (filename.indexOf("extension://") !== -1 || filename.indexOf("chrome-extension") !== -1);
  }
  window.addEventListener("error", function (e) {
    if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      var url = e.target.src || e.target.href;
      if (!isOurResource(url)) return;
      showDiag("A required resource failed to load", "Blocked or unreachable: " + url + "\n\nThis is usually an ad blocker, browser extension, or network/firewall blocking the CDN. Try disabling ad blockers for this page, or try a different network/browser.");
      return;
    }
    if (isFromExtension(e.filename)) return;
    var root = document.getElementById("root");
    if (root && root.querySelector("#__strain_loading")) {
      showDiag("Something failed to load", (e.message || "Unknown error") + (e.filename ? ("\n\nFile: " + e.filename + ":" + e.lineno) : ""));
    }
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var msg = String(e.reason && e.reason.message ? e.reason.message : e.reason);
    if (/extension/i.test(msg)) return;
    var root = document.getElementById("root");
    if (root && root.querySelector("#__strain_loading")) {
      showDiag("A background request failed", msg);
    }
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.querySelector("#__strain_loading")) {
      showDiag("Still loading after 8 seconds", "The app scripts (React/Supabase) haven't finished running. This usually means:\n\n1. An ad blocker or privacy extension is blocking unpkg.com or jsdelivr.net\n2. Your network/firewall is blocking those CDNs\n3. A slow connection\n\nTry: disabling browser extensions for this page, switching networks, or opening in a different browser.");
    }
  }, 8000);

        }, options.map((o) => e("option", { key: o, value: o }, o)))
      );
    }

    const displayValue = value != null && value !== "" ? `${value}${suffix}` : placeholder;

    return e("div", block ? { style: { marginTop: 10 } } : null,
      e("span", { style: styles.profileLabel }, label),
      editing
        ? e("input", {
            type: type === "number" ? "number" : "text", autoFocus: true,
            style: { ...styles.input, marginTop: block ? 4 : 2, padding: block ? "9px 10px" : "6px 8px", fontSize: block ? 14 : 13.5 },
            value: draft, onChange: (ev) => setDraft(ev.target.value), onBlur: commit,
            onKeyDown: (ev) => { if (ev.key === "Enter") commit(); if (ev.key === "Escape") { setDraft(value != null ? String(value) : ""); setEditing(false); } }
          })
        : e(block ? "p" : "span", {
            style: block ? { ...styles.profileGoalText, cursor: "pointer" } : { ...styles.profileValue, cursor: "pointer" },
            onClick: () => setEditing(true), title: "Tap to edit"
          }, displayValue)
    );
  }

  function Select({ value, onChange, options, style }) {
    const norm = options.map((o) => (typeof o === "string" ? { value: o, label: o } : o));
    return e("div", { style: { position: "relative", ...style } },
      e("select", {
        value, onChange: (ev) => onChange(ev.target.value),
        style: styles.select
      }, norm.map((o) => e("option", { key: o.value, value: o.value }, o.label))),
      e("div", { style: styles.selectChevron }, e(Icon, { name: "chevron", size: 14, color: C.ink3 }))
    );

  function StatTile({ label, value, unit, delta, size = "md" }) {
    return e("div", { style: styles.statTile }, [
      e("span", { key: "l", style: styles.statTileLabel }, label),
      e("div", { key: "v", style: { display: "flex", alignItems: "baseline", gap: 6, flexWrap: "wrap" } }, [
        e("span", { key: "n", style: size === "lg" ? styles.statTileValueLg : styles.statTileValue }, typeof value === "number" ? value.toLocaleString() : value),
        unit && e("span", { key: "u", style: styles.statTileUnit }, unit),
        delta ? e("span", { key: "d", style: { ...styles.deltaChip, color: delta.dir === "up" ? C.good : delta.dir === "down" ? C.critical : C.ink3, background: delta.dir === "up" ? C.goodSoft : delta.dir === "down" ? C.criticalSoft : "transparent" } }, [
          delta.dir !== "flat" && e(Icon, { key: "i", name: delta.dir === "up" ? "trendUp" : "trendDown", size: 11, strokeWidth: 2.5 }),
          e("span", { key: "t" }, delta.text)
        ]) : null
      ])

  // ---- feed / plates ----

  // ---- exercise demo animations ----
  // Free, keyless lookup against the "free-exercise-db" open dataset (public domain / Unlicense,
  // safe for a paid or resold product) — 873 exercises, each with two position photos we flip
  // between to fake a simple animation. It's one plain JSON file (no flaky paginated API), so
  // it's pulled into our own Supabase table (exercise_catalog) ONE TIME EVER — whoever taps
  // "Show demo" first triggers it, everyone after just reads from our own table — and matched
  // by name ourselves. Results are cached in Supabase (table: exercise_gifs) so we only ever
  // look an exercise name up once, and a trainer/manager can paste their own link to override.
  const exerciseGifMemCache = {};

  function exerciseGifKey(name) {
    return (name || "").trim().toLowerCase();
  }

  // Try the name as typed, then a naive singular/plural flip of its last word
  // ("Squats" <-> "Squat"), so a trainer typing either form still finds a match.
  function exerciseSearchVariants(name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return [];
    const words = trimmed.split(/\s+/);
    const last = words[words.length - 1];
    const flipped = /s$/i.test(last) && last.length > 1
      ? [...words.slice(0, -1), last.slice(0, -1)].join(" ")
      : [...words.slice(0, -1), last + "s"].join(" ");
    return flipped.toLowerCase() === trimmed.toLowerCase() ? [trimmed] : [trimmed, flipped];
  }

  function pickBestExerciseMatch(list, name) {
    const key = exerciseGifKey(name);
    if (!list || !list.length) return null;
    const exact = list.find((x) => (x.name || "").trim().toLowerCase() === key);
    if (exact) return exact;
    const startsWith = list.find((x) => (x.name || "").trim().toLowerCase().startsWith(key));
    if (startsWith) return startsWith;
    const contains = list.filter((x) => (x.name || "").trim().toLowerCase().includes(key));
    if (contains.length) {
      // Prefer the shortest matching name — closest to what was actually typed,
      // rather than a longer variant that happens to contain the same words.
      return contains.sort((a, b) => (a.name || "").length - (b.name || "").length)[0];
    }
    return list[0];
  }

  const FREE_EXERCISE_DB_JSON = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json";
  const FREE_EXERCISE_DB_IMAGE_BASE = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";

  let exerciseCatalogSyncPromise = null;
  async function ensureExerciseCatalogSynced() {
    if (!sb) return;
    if (exerciseCatalogSyncPromise) return exerciseCatalogSyncPromise;
    exerciseCatalogSyncPromise = (async () => {
      try {
        const { count } = await sb.from("exercise_catalog").select("exercise_id", { count: "exact", head: true });
        if (count && count > 0) return;
      } catch (e) { return; /* table missing — nothing we can do until the setup SQL is run */ }
      try {
        const res = await fetch(FREE_EXERCISE_DB_JSON);
        if (!res.ok) return;
        const list = await res.json();
        // De-dupe by exercise id — otherwise saving a batch with the same id twice makes the
        // database reject the whole batch ("cannot affect row a second time").
        const seenIds = new Set();
        const rows = [];
        (Array.isArray(list) ? list : []).forEach((x) => {
          if (!x || !x.id || !x.name || !Array.isArray(x.images) || !x.images.length) return;
          if (seenIds.has(x.id)) return;
          seenIds.add(x.id);
          rows.push({
            exercise_id: x.id,
            name: x.name,
            gif_url: FREE_EXERCISE_DB_IMAGE_BASE + encodeURI(x.images[0]),
            frame2_url: x.images[1] ? FREE_EXERCISE_DB_IMAGE_BASE + encodeURI(x.images[1]) : null,
          });
        });
        for (let i = 0; i < rows.length; i += 300) {
          const { error } = await sb.from("exercise_catalog").upsert(rows.slice(i, i + 300));
          if (error) { console.error("exercise_catalog upsert failed", error); break; }
        }
      } catch (e) { /* offline/blocked — per-name lookups will just come up empty this time */ }
    })();
    return exerciseCatalogSyncPromise;
  }
  window.ensureExerciseCatalogSynced = ensureExerciseCatalogSynced; // exposed for debugging

  async function fetchExerciseGif(name) {
    const key = exerciseGifKey(name);
    if (!key) return null;
    if (key in exerciseGifMemCache) return exerciseGifMemCache[key];
    // 1) Check our own cache first (covers both auto-found and manually-added links).
    if (sb) {
      try {
        const { data } = await sb.from("exercise_gifs").select("gif_url, frame2_url, matched_name").eq("name_key", key).limit(1).maybeSingle();
        if (data && data.gif_url) {
          const result = { gifUrl: data.gif_url, frame2Url: data.frame2_url || null, matchedName: data.matched_name || null };
          exerciseGifMemCache[key] = result;
          return result;
        }
      } catch (e) { /* table may not exist yet — fall through */ }
    }
    // 2) Search our own local copy of the exercise catalog (syncing it first if needed).
    if (sb) {
      await ensureExerciseCatalogSynced();
      try {
        // Treat spaces/hyphens as interchangeable ("Push Up" vs "Push-Up") by turning each
        // run of whitespace/dashes in the search term into a wildcard, so naming-convention
        // differences between what a trainer types and how the dataset spells it don't miss.
        // Also try a naive singular/plural flip ("Squats" vs "Squat") if the first try is empty.
        for (const variant of exerciseSearchVariants(name)) {
          const searchPattern = `%${variant.replace(/[\s-]+/g, "%")}%`;
          const { data } = await sb.from("exercise_catalog").select("name, gif_url, frame2_url").ilike("name", searchPattern).order("name", { ascending: true }).limit(20);
          if (data && data.length) {
            const found = pickBestExerciseMatch(data.map((x) => ({ name: x.name, gifUrl: x.gif_url, frame2Url: x.frame2_url || null })), name);
            if (found && found.gifUrl) {
              const result = { gifUrl: found.gifUrl, frame2Url: found.frame2Url || null, matchedName: found.name || null };
              exerciseGifMemCache[key] = result;
              sb.from("exercise_gifs").upsert([{ name_key: key, gif_url: found.gifUrl, frame2_url: found.frame2Url || null, matched_name: found.name || null, source: "auto" }]).then(() => {});
              return result;
            }
          }
        }
      } catch (e) { /* catalog table missing or query failed — treat as "no demo available" */ }
    }
    exerciseGifMemCache[key] = null;
    return null;
  }
  window.fetchExerciseGif = fetchExerciseGif; // exposed for debugging

  async function saveManualExerciseGif(name, url) {
    const key = exerciseGifKey(name);
    if (!key || !url) return;
    const result = { gifUrl: url, matchedName: null };
    exerciseGifMemCache[key] = result;
    if (sb) await sb.from("exercise_gifs").upsert([{ name_key: key, gif_url: url, matched_name: null, source: "manual" }]);
  }

  function youtubeEmbedUrl(url) {
    if (!url) return null;
    const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{6,})/);
    return m ? `https://www.youtube.com/embed/${m[1]}` : null;
  }

  function ExerciseDemo({ name }) {
    const [open, setOpen] = useState(false);
    const [loading, setLoading] = useState(false);
    const [result, setResult] = useState(exerciseGifMemCache[exerciseGifKey(name)] || null);
    const [checked, setChecked] = useState(exerciseGifKey(name) in exerciseGifMemCache);
    const [showManual, setShowManual] = useState(false);
    const [manualUrl, setManualUrl] = useState("");

    async function handleOpen() {
      const next = !open;
      setOpen(next);
      if (next && !checked) {
        setLoading(true);
        const r = await fetchExerciseGif(name);
        setResult(r);
        setChecked(true);
        setLoading(false);
      }
    }

    async function handleSaveManual() {
      if (!manualUrl.trim()) return;
      await saveManualExerciseGif(name, manualUrl.trim());
      setResult({ gifUrl: manualUrl.trim(), frame2Url: null, matchedName: null });
      setShowManual(false);
      setManualUrl("");
    }

    const gifUrl = result && result.gifUrl;
    const frame2Url = result && result.frame2Url;
    const matchedName = result && result.matchedName;
    const looksOff = matchedName && exerciseGifKey(matchedName) !== exerciseGifKey(name);
    const ytEmbed = youtubeEmbedUrl(gifUrl);

    // Fake a simple animation by flipping between the exercise's two position photos —
    // the free dataset doesn't have true looping GIFs, but alternating start/end poses
    // reads as "in motion" at a glance, which is what a client actually needs.
    const [frameOn, setFrameOn] = useState(false);
    useEffect(() => {
      if (!open || ytEmbed || !frame2Url) return;
      const id = setInterval(() => setFrameOn((v) => !v), 700);
      return () => clearInterval(id);
    }, [open, ytEmbed, frame2Url]);
    const displaySrc = frame2Url && frameOn ? frame2Url : gifUrl;

    return e("div", { style: { marginTop: open ? 8 : 0 } },
      e("button", { style: styles.demoToggleBtn, onClick: handleOpen },
        e(Icon, { name: "play", size: 12 }), open ? "Hide demo" : "Show demo"),
      open && e("div", { style: styles.demoPanel },
        loading && e("span", { style: styles.demoNote }, "Looking up a demo…"),
        !loading && gifUrl && e("div", null,
          ytEmbed
            ? e("iframe", { src: ytEmbed, style: { ...styles.demoImg, height: 150, border: "none" }, allow: "autoplay; encrypted-media", allowFullScreen: true })
            : e("img", { src: displaySrc, alt: `${name} demo`, style: styles.demoImg }),
          matchedName && e("span", { style: { ...styles.demoNote, display: "block", marginTop: 6 } },
            "Matched: “", matchedName, "”", looksOff ? " — does this look right?" : ""),
          !showManual && e("button", { style: styles.demoLinkBtn, onClick: () => setShowManual(true) },
            looksOff ? "That's not right — add the correct link" : "Not right? Add your own link")
        ),
        !loading && !gifUrl && !showManual && e("div", null,
          e("span", { style: styles.demoNote }, "No demo found for “", name, "”."),
          e("button", { style: styles.demoLinkBtn, onClick: () => setShowManual(true) }, "+ Add your own link")
        ),
        !loading && showManual && e("div", { style: { display: "flex", gap: 8, marginTop: 6, flexWrap: "wrap" } },
          e("input", {
            style: { ...styles.input, flex: 1, minWidth: 160 }, placeholder: "Paste a YouTube link or direct GIF/image URL",
            value: manualUrl, onChange: (ev) => setManualUrl(ev.target.value)
          }),
          e("button", { style: styles.saveBtn, onClick: handleSaveManual }, "Save")
        )
      )
    );
  }

  // Owner-facing screen: every distinct exercise name used anywhere across
  // programs and logged workouts, in one list, with its demo status — so
  // filling in the gaps doesn't mean hunting through every program one at a
  // time. Reuses the exact same lookup/caching "Show demo" uses everywhere
  // else, so what this screen reports always matches what a trainer or
  // client actually sees when they tap "Show demo" themselves.
  function ExerciseLibraryPanel() {
    const [loading, setLoading] = useState(true);
    const [items, setItems] = useState([]);
    const [results, setResults] = useState({});
    const [filter, setFilter] = useState("all");
    const [editingKey, setEditingKey] = useState(null);
    const [manualUrl, setManualUrl] = useState("");

    useEffect(() => {
      if (!sb) { setLoading(false); return; }
      let cancelled = false;
      (async () => {
        const [progRes, entryRes] = await Promise.all([
          sb.from("program_exercises").select("exercise"),
          sb.from("workout_entries").select("exercise")
        ]);
        const seen = new Map();
        [...(progRes.data || []), ...(entryRes.data || [])].forEach((r) => {
          const raw = ((r && r.exercise) || "").trim();
          if (!raw) return;
          const key = exerciseGifKey(raw);
          if (!seen.has(key)) seen.set(key, raw);
        });
        const list = [...seen.entries()].map(([key, name]) => ({ key, name })).sort((a, b) => a.name.localeCompare(b.name));
        if (cancelled) return;
        setItems(list);
        const found = await Promise.all(list.map(async (item) => [item.key, await fetchExerciseGif(item.name)]));
        if (cancelled) return;
        const map = {};
        found.forEach(([key, r]) => { map[key] = r; });
        setResults(map);
        setLoading(false);
      })();
      return () => { cancelled = true; };
    }, []);

    async function handleSaveManual(item) {
      if (!manualUrl.trim()) return;
      await saveManualExerciseGif(item.name, manualUrl.trim());
      setResults((prev) => ({ ...prev, [item.key]: { gifUrl: manualUrl.trim(), frame2Url: null, matchedName: null } }));
      setEditingKey(null);
      setManualUrl("");
    }

    if (loading) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Checking every exercise for a demo…"));
    if (!items.length) return e("div", { style: styles.empty }, e(Icon, { name: "play", size: 26, color: C.ink3 }), e("p", { style: styles.emptyText }, "No exercises yet — once your programs or logged workouts have some, they'll show up here."));

    const missingCount = items.filter((item) => !(results[item.key] && results[item.key].gifUrl)).length;
    const filtered = items.filter((item) => {
      const has = !!(results[item.key] && results[item.key].gifUrl);
      if (filter === "missing") return !has;
      if (filter === "found") return has;
      return true;
    });

    return e("div", null,
      e("p", { style: { ...styles.profileGoalText, marginBottom: 12 } },
        `${items.length} exercise${items.length === 1 ? "" : "s"} used across your programs and logs — `,
        missingCount === 0 ? "every one has a demo." : `${missingCount} still missing a demo.`
      ),
      e("div", { style: { marginBottom: 14, maxWidth: 240 } },
        e(Select, {
          value: filter, onChange: setFilter,
          options: [
            { value: "all", label: "All exercises" },
            { value: "missing", label: `Missing a demo (${missingCount})` },
            { value: "found", label: `Has a demo (${items.length - missingCount})` }
          ]
        })
      ),
      filtered.length === 0
        ? e("p", { style: styles.emptyText }, "Nothing matches that filter.")
        : e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, filtered.map((item) => {
            const r = results[item.key];
            const has = !!(r && r.gifUrl);
            const isEditing = editingKey === item.key;
            return e("div", { key: item.key, style: { ...styles.clientCard, alignItems: "center" } },
              e("div", { style: { display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 } },
                has
                  ? e("img", { src: r.gifUrl, alt: "", style: { width: 34, height: 34, borderRadius: 8, objectFit: "cover", flexShrink: 0, background: "#0B1526" } })
                  : e("div", { style: { width: 34, height: 34, borderRadius: 8, background: withAlpha(C.critical, 0.1), display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } },
                      e(Icon, { name: "alert", size: 14, color: C.critical })
                    ),
                e("div", { style: { display: "flex", flexDirection: "column", minWidth: 0 } },
                  e("span", { style: styles.exerciseName }, item.name),
                  e("span", { style: styles.muscleSubText }, has ? (r.matchedName ? `Matched: "${r.matchedName}"` : "Custom link") : "No demo found")
                )
              ),
              !isEditing
                ? e("button", { style: { ...styles.demoLinkBtn, flexShrink: 0, marginTop: 0 }, onClick: () => { setEditingKey(item.key); setManualUrl(""); } }, has ? "Change" : "+ Add link")
                : e("div", { style: { display: "flex", gap: 6, alignItems: "center", flexShrink: 0 } },
                    e("input", {
                      style: { ...styles.input, width: 150 }, placeholder: "YouTube or image URL",
                      value: manualUrl, onChange: (ev) => setManualUrl(ev.target.value)
                    }),
                    e("button", { style: { ...styles.demoLinkBtn, marginTop: 0, padding: "0 6px" }, onClick: () => handleSaveManual(item) }, "Save"),
                    e("button", { style: { ...styles.demoLinkBtn, marginTop: 0, padding: "0 6px", color: C.ink3 }, onClick: () => setEditingKey(null) }, "✕")
                  )
            );
          }))
    );
  }

  function ExerciseContent({ entry, maxW, unit, onEdit, onDelete, onDuplicate }) {
    const mColor = MUSCLE_COLORS[entry.muscleGroup] || MUSCLE_COLORS["Full Body"];
    return e(React.Fragment, null,
      e("div", { style: styles.cardHeader },
        e("div", { style: styles.cardHeaderLeft },
          e("span", { style: styles.exerciseName }, entry.exercise),
          e("span", { style: styles.muscleTag }, e(Dot, { color: mColor, size: 7 }), entry.muscleGroup || "Full Body")
        ),
        (onEdit || onDelete || onDuplicate) && e("div", { style: styles.cardHeaderActions },
          onDuplicate && e("button", { style: styles.editBtn, onClick: () => onDuplicate(entry), "aria-label": "Duplicate entry", title: "Duplicate this as a new entry today" }, e(Icon, { name: "copy", size: 14 })),
          onEdit && e("button", { style: styles.editBtn, onClick: () => onEdit(entry), "aria-label": "Edit entry" }, e(Icon, { name: "edit", size: 14 })),
          onDelete && e("button", { style: styles.deleteBtn, onClick: () => onDelete(entry.id), "aria-label": "Delete entry" }, e(Icon, { name: "trash", size: 15 }))
        )
      ),
      e("div", { style: styles.setsRow }, entry.sets.map((s, i) => {
        const isPR = maxW > 0 && s.weight === maxW;
        return e(React.Fragment, { key: i },
          e("span", { style: { ...styles.setChip, ...(isPR ? styles.setChipPR : {}) } },
            isPR && e(Icon, { name: "sparkle", size: 10, strokeWidth: 2.5 }),
            e("span", { style: styles.setChipReps }, s.reps), " × ", s.weight, unit,
            isPR && e("span", { style: styles.setChipPRBadge }, "PR")
          ),
          s.rest ? e(RestTimerChip, { seconds: s.rest }) : null
        );
      })),
      e(ExerciseDemo, { name: entry.exercise })
    );
  }

  function LogFeed({ entries, unit, titleFilter, setTitleFilter, dateFilter, setDateFilter, onDelete, onEdit, onDuplicate }) {
    const maxWeightByExercise = useMemo(() => computeMaxWeightByExercise(entries), [entries]);
    const dateOptions = useMemo(() => {
      const dates = Array.from(new Set(entries.map((x) => x.date))).sort((a, b) => (a < b ? 1 : -1));
      return [{ value: "none", label: "Select a date…" }, { value: "All", label: "All dates" }, ...dates.map((d) => ({ value: d, label: fmtDateMed(d) }))];
    }, [entries]);
    const titleOptions = useMemo(() => {
      const titles = Array.from(new Set(entries.map((x) => (x.workoutTitle || "").trim()).filter(Boolean))).sort();
      const hasUntitled = entries.some((x) => !(x.workoutTitle || "").trim());
      const opts = [{ value: "All", label: "All workouts" }, ...titles.map((t) => ({ value: t, label: t }))];
      if (hasUntitled) opts.push({ value: "__untitled__", label: "Untitled" });
      return opts;
    }, [entries]);
    const grouped = useMemo(() => computeGrouped(entries, titleFilter, dateFilter), [entries, titleFilter, dateFilter]);
    const isNoDate = !dateFilter || dateFilter === "none";
    const isFiltered = (titleFilter && titleFilter !== "All") || (dateFilter && dateFilter !== "All" && dateFilter !== "none");
    return e(React.Fragment, null,
      e("div", { style: styles.toolbar },
        e("div", { style: styles.filterWrap },
          e("label", { style: styles.filterLabel }, "Filter by workout"),
          e(Select, { value: titleFilter || "All", onChange: setTitleFilter, options: titleOptions, style: { minWidth: 168 } })
        ),
        setDateFilter && e("div", { style: styles.filterWrap },
          e("label", { style: styles.filterLabel }, "Filter by date"),
          e(Select, { value: dateFilter || "none", onChange: setDateFilter, options: dateOptions, style: { minWidth: 168 } })
        )
      ),
      e("main", { style: styles.feed },
        grouped.length === 0 && e("div", { style: styles.empty },
          e(Icon, { name: "calendar", size: 26, color: C.ink3 }),
          e("p", { style: styles.emptyText },
            entries.length === 0 ? "No sessions logged yet."
              : isNoDate ? "Pick a date above to see that day's log — or choose “All dates”."
              : "No sessions match that filter."
          ),
          entries.length === 0 && e("p", { style: styles.emptySub }, "Tap “New exercise” to start your log.")
        ),
        grouped.map(([d, list]) => e("section", { key: d, style: styles.dayBlock },
          e("div", { style: styles.dayHeader },
            e("span", { style: styles.dayDate }, fmtDate(d)),
            e("span", { style: styles.dayRule }),
            e("span", { style: styles.dayFull }, fmtDateFull(d))
          ),
          groupByTitle(list).map(([title, group]) => {
            if (!title) {
              // Untitled quick-logs: each exercise stands alone as its own card, no big header.
              return e(React.Fragment, { key: "untitled" }, group.map((entry) => {
                const maxW = maxWeightByExercise[exerciseGifKey(entry.exercise)] || 0;
                return e("div", { key: entry.id, style: styles.card }, e(ExerciseContent, { entry, maxW, unit, onEdit, onDelete, onDuplicate }));
              }));
            }
            // Titled workout: one big heading for the whole session, exercises listed
            // underneath as rows inside a single card — it reads (and is saved) as one workout.
            return e("div", { key: title, style: styles.workoutCard },
              e("div", { style: styles.workoutTitleBig }, e(Icon, { name: "tag", size: 15, strokeWidth: 2.5 }), title),

    async function handleSubmit() {
      setError(""); setNotice("");

      if (mode === "forgot") {
        if (!email.trim()) { setError("Enter your email."); return; }
        setLoading(true);

          redirectTo: window.location.origin + window.location.pathname
        });
        setLoading(false);
        if (err) { setError(err.message || "Couldn't send that reset link."); return; }
        setNotice("Check your email for a password reset link.");
        return;
      }
      // Everyone — clients and trainers — signs in with email. (Phone/WhatsApp
      // used to be a second login option here, but Supabase phone auth needs a
      // paid SMS provider wired up to actually work, which was never set up, so
      // it silently failed. WhatsApp number is still kept as a plain contact
      // field on the client's profile — see the client detail page.)
      const identifier = email.trim();
      if (!identifier || !password) {
        setError("Enter your email and password.");
        return;
      }
      // Trainers don't type a display name — their name is already set by
      // whoever added them to the roster. Only clients pick their own.
      if (mode === "signup" && role === "client" && !displayName.trim()) { setError("Enter the name you want to log workouts under."); return; }
      setLoading(true);
      const authField = { email: identifier };
      if (mode === "signup") {

          else localStorage.removeItem(CLIENT_GYM_CODE_KEY);

          ...authField,
          password,
          options: { data: { display_name: displayName.trim() } }
        });
        if (err) { setLoading(false); setError(err.message || "Couldn't create your account."); return; }
        if (data && data.session) { setLoading(false); return; } // signed in immediately, onAuthStateChange picks it up
        setLoading(false);
        setNotice("Account created! Check your email to confirm it, then log in below.");
        setMode("login");
      } else {
        const { error: err } = await sb.auth.signInWithPassword({ ...authField, password });
        if (err) { setLoading(false); setError(err.message || "Couldn't log you in."); return; }
        // Whether this account is actually a trainer is decided in exactly one
        // place after this: the top-level app check that runs right after
        // login, matching this email against the trainers roster the manager
        // maintains. There's no second check here — one source of truth.
        setLoading(false);

      setError("");
      if (!sb) { setError("Backend not configured yet."); return; }
      setSaving(true);
      let gymId = null;
      let trainerId = null;
      const rawCode = localStorage.getItem(CLIENT_GYM_CODE_KEY);
      if (rawCode) {
        const { data: trainerRow } = await sb.from("trainers").select("id, gym_id").eq("invite_code", rawCode).maybeSingle();
        if (trainerRow) { trainerId = trainerRow.id; gymId = trainerRow.gym_id || null; }
        localStorage.removeItem(CLIENT_GYM_CODE_KEY);
      }
      // No code at all (or a bad one)? Same as above — bucket them under
      // "Self-Training" instead of leaving them unassigned.
      if (!trainerId) {
        const selfRow = await ensureSelfTrainRow();
        if (selfRow) trainerId = selfRow.id;
      }
      // Bare-minimum profile row — everything can be filled in later from the
      // client's detail page. This just unblocks getting into the app (and
      // being assignable to a trainer) without answering every question now.
      const payload = {
        user_id: userId,
        client_name: clientName,
        gym_id: gymId,
        trainer_id: trainerId,
        age: null,
        gender: "Prefer not to say",
        height_cm: null,
        weight_kg: null,
        days_per_week: Number(daysPerWeek),
        has_medical_condition: false,
        medical_details: null,
        goal: null
      };
      const { data, error: err } = await sb.from("client_profiles").insert([payload]).select();
      setSaving(false);
      if (err || !data) { setError("Couldn't skip right now. Try again, or fill in the form instead."); return; }
      onDone(data[0]);
    }

    return e("div", { style: styles.profileGateWrap },
      e("div", { style: styles.profileGateCard },
        e("div", { style: { textAlign: "center", marginBottom: 6 } },
          e(BrandMark, {}),
          e("h1", { style: styles.gateTitle }, "Tell us about yourself"),
          e("p", { style: { ...styles.gateSub, margin: "6px auto 4px" } }, "Client profile — fill this out so your coach can tailor your training, or skip it for now.")
        ),
        e("label", { style: styles.formLabel }, "Age"),
        e("input", { type: "number", min: "0", autoFocus: true, style: styles.input, placeholder: "e.g. 29", value: age, onChange: (ev) => setAge(ev.target.value) }),
        e("label", { style: styles.formLabel }, "Gender"),
        e(Select, { value: gender, onChange: setGender, options: ["Male", "Female", "Other", "Prefer not to say"], style: { width: "100%" } }),
        e("label", { style: styles.formLabel }, "Height (cm)"),
        e("input", { type: "number", min: "0", style: styles.input, placeholder: "e.g. 178", value: height, onChange: (ev) => setHeight(ev.target.value) }),
        e("label", { style: styles.formLabel }, "Weight (kg)"),
        e("input", { type: "number", min: "0", step: "0.5", style: styles.input, placeholder: "e.g. 82", value: weight, onChange: (ev) => setWeight(ev.target.value) }),
        e("label", { style: styles.formLabel }, "Days per week you can train"),
        e(Select, { value: daysPerWeek, onChange: setDaysPerWeek, options: ["1", "2", "3", "4", "5", "6", "7"], style: { width: "100%" } }),
        e("label", { style: styles.formLabel }, "Any medical conditions or injuries?"),
        e(Segmented, { options: [{ label: "No", value: "no" }, { label: "Yes", value: "yes" }], value: hasMedical, onChange: setHasMedical }),
        hasMedical === "yes" && e("textarea", {
          style: { ...styles.input, marginTop: 10, minHeight: 70, resize: "vertical", fontFamily: "'Inter', sans-serif" },
          placeholder: "Briefly describe (e.g. lower back injury, asthma)…",
          value: medicalDetails, onChange: (ev) => setMedicalDetails(ev.target.value)
        }),
        e("label", { style: styles.formLabel }, "What's your main goal?"),
        e("textarea", {
          style: { ...styles.input, minHeight: 60, resize: "vertical", fontFamily: "'Inter', sans-serif" },
          placeholder: "e.g. Build muscle, lose fat, get stronger…",
          value: goal, onChange: (ev) => setGoal(ev.target.value)
        }),
        error && e("span", { style: styles.inlineError }, error),
        e("div", { style: { display: "flex", gap: 8, marginTop: 22 } },
          e("button", {
            style: { ...styles.saveBtn, marginTop: 0, flex: 1, ...(saving ? styles.btnDisabled : {}) }, disabled: saving, onClick: handleSave
          }, saving ? "Saving…" : "Continue"),
          e("button", {
            style: { ...styles.waterAddBtn, flex: "0 0 110px", ...(saving ? styles.btnDisabled : {}) }, disabled: saving, onClick: handleSkip
          }, "Skip for now")
        )
      )
    );

  // ---- session reminders ----

  function SessionRow({ session, onSendWhatsapp, onSendEmail, onDelete, sendingChannel, past, trainerName }) {
    const contactBits = [];
    if (session.phone) contactBits.push(session.phone);
    if (session.email) contactBits.push(session.email);
    const sendingWa = sendingChannel === "whatsapp";
    const sendingEmail = sendingChannel === "email";
    return e("div", { style: { ...styles.card, ...(past ? { opacity: 0.55 } : {}) } },
      e("div", { style: styles.cardHeader },
        e("div", { style: styles.cardHeaderLeft },
          e("span", { style: styles.exerciseName }, session.name),
          e("span", { style: styles.muscleSubText },
            session.time || "—", session.note ? ` · ${session.note}` : "", " · ", contactBits.length ? contactBits.join(" · ") : "no contact saved",
            trainerName ? ` · ${trainerName}` : ""
          )
        ),
        e("div", { style: styles.cardHeaderActions },
          e("button", { style: styles.deleteBtn, onClick: () => onDelete(session.id), "aria-label": "Delete session" }, e(Icon, { name: "trash", size: 15 }))
        )
      ),
      e("div", { style: { display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" } },
        session.phone && e("button", {
          style: { ...styles.sendReminderBtn, ...(sendingWa ? styles.btnDisabled : {}) },
          disabled: !!sendingChannel,
          onClick: () => onSendWhatsapp(session)
        }, e(Icon, { name: "chat", size: 14 }), sendingWa ? "Opening…" : session.waSentAt ? "Resend via WhatsApp" : "Send via WhatsApp"),
        session.email && e("button", {
          style: { ...styles.sendReminderBtn, ...(sendingEmail ? styles.btnDisabled : {}) },
          disabled: !!sendingChannel,
          onClick: () => onSendEmail(session)
        }, e(Icon, { name: "mail", size: 14 }), sendingEmail ? "Sending…" : session.emailSentAt ? "Resend via email" : "Send via email"),
        session.waSentAt && e("span", { style: styles.sentTag }, e(Icon, { name: "check", size: 11, strokeWidth: 2.5 }), "WhatsApp opened ", fmtDateMed(session.waSentAt.slice(0, 10))),
        session.emailSentAt && e("span", { style: styles.sentTag }, e(Icon, { name: "check", size: 11, strokeWidth: 2.5 }), "Email sent ", fmtDateMed(session.emailSentAt.slice(0, 10)))
      )
    );
  }

  function buildReminderMessage(session) {
    let msg = `Hi ${session.name}, this is a reminder for your training session on ${fmtDateFull(session.date)}`;
    if (session.time) msg += ` at ${session.time}`;
    msg += ".";
    if (session.note) msg += ` ${session.note}.`;
    msg += " See you then!";
    return msg;
  }
  function whatsappReminderLink(session) {
    const digits = (session.phone || "").replace(/\D/g, "");
    if (!digits) return null;
    return `https://wa.me/${digits}?text=${encodeURIComponent(buildReminderMessage(session))}`;
  }

  function CalendarMonth({ year, month, sessionCountByDate, selectedDate, onSelectDate, onPrevMonth, onNextMonth }) {
    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = firstOfMonth.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = todayISO();
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);
    const monthLabel = firstOfMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });

    return e("div", { style: styles.calendarWrap },
      e("div", { style: styles.calendarHeader },
        e("button", { style: styles.calendarNavBtn, onClick: onPrevMonth, "aria-label": "Previous month" }, e(Icon, { name: "back", size: 15 })),
        e("span", { style: styles.calendarMonthLabel }, monthLabel),
        e("button", { style: { ...styles.calendarNavBtn, transform: "rotate(180deg)" }, onClick: onNextMonth, "aria-label": "Next month" }, e(Icon, { name: "back", size: 15 }))
      ),
      e("div", { style: styles.calendarWeekRow }, ["S", "M", "T", "W", "T", "F", "S"].map((d, i) => e("span", { key: i, style: styles.calendarWeekday }, d))),
      e("div", { style: styles.calendarGrid }, cells.map((d, i) => {
        if (d == null) return e("div", { key: "empty" + i, style: styles.calendarCellEmpty });
        const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const count = sessionCountByDate[dateStr] || 0;
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDate;
        return e("button", {
          key: dateStr, onClick: () => onSelectDate(dateStr),
          style: { ...styles.calendarCell, ...(isToday && !isSelected ? styles.calendarCellToday : {}), ...(isSelected ? styles.calendarCellSelected : {}) }
        },
          e("span", { style: styles.calendarCellNum }, d),
          count > 0 && e("span", { style: { ...styles.calendarCellDot, ...(isSelected ? { background: C.brandInk } : {}) } })
        );
      }))
    );
  }

  function shiftDateISO(iso, delta) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + delta);
    return d.toISOString().slice(0, 10);
  }

  function hourLabel12(h) {
    const period = h < 12 ? "AM" : "PM";
    const displayH = h % 12 === 0 ? 12 : h % 12;
    return `${displayH} ${period}`;
  }

  function DayTimeline({ daySessions, onSendWhatsapp, onSendEmail, onDelete, sendingId, sendingChannel, past, canPickTrainer, trainerNameById }) {
    const HOURS = [];
    for (let h = 6; h <= 22; h++) HOURS.push(h);
    const byHour = {};
    const other = [];
    daySessions.forEach((s) => {
      const h = s.time ? parseInt(s.time.split(":")[0], 10) : NaN;
      if (Number.isFinite(h) && h >= 6 && h <= 22) (byHour[h] = byHour[h] || []).push(s);
      else other.push(s);
    });
    function rowFor(s) {
      return e(SessionRow, {
        key: s.id, session: s, onSendWhatsapp, onSendEmail, onDelete,
        sendingChannel: sendingId === s.id ? sendingChannel : null, past,
        trainerName: canPickTrainer ? (trainerNameById[s.trainerId] || "Unassigned") : null
      });
    }
    return e("div", { style: styles.timelineWrap },
      HOURS.map((h) => {
        const items = byHour[h] || [];
        return e("div", { key: h, style: styles.timelineRow },
          e("div", { style: styles.timelineHourCol }, e("span", { style: styles.timelineHourLabel }, hourLabel12(h))),
          e("div", { style: styles.timelineBody },
            items.length === 0
              ? e("div", { style: styles.timelineEmptyLine })
              : e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, items.map(rowFor))
          )
        );
      }),
      other.length > 0 && e("div", { style: { marginTop: 14 } },
        e("div", { style: styles.timelineOtherHeading }, "No time set"),
        e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, other.map(rowFor))
      )
    );
  }

  function SessionsPanel({ trainerId = null, canPickTrainer = false, trainers = [], clientOptions = [] }) {
    const [sessions, setSessions] = useState([]);
    const [loaded, setLoaded] = useState(false);
    const [name, setName] = useState("");
    const [phone, setPhone] = useState("");
    const [email, setEmail] = useState("");
    const [date, setDate] = useState(todayISO());
    const [time, setTime] = useState("09:00");
    const [note, setNote] = useState("");
    const [formTrainerId, setFormTrainerId] = useState("");
    const [saving, setSaving] = useState(false);
    const [sendingId, setSendingId] = useState(null);
    const [sendingChannel, setSendingChannel] = useState(null);
    const [error, setError] = useState("");
    const today0 = new Date();
    const [calYear, setCalYear] = useState(today0.getFullYear());
    const [calMonth, setCalMonth] = useState(today0.getMonth());
    const [selectedDate, setSelectedDate] = useState(todayISO());

    function goPrevMonth() {
      if (calMonth === 0) { setCalMonth(11); setCalYear((y) => y - 1); } else { setCalMonth((m) => m - 1); }
    }
    function goNextMonth() {
      if (calMonth === 11) { setCalMonth(0); setCalYear((y) => y + 1); } else { setCalMonth((m) => m + 1); }
    }
    function goToDate(iso) {
      setSelectedDate(iso);
      const d = new Date(iso + "T00:00:00");
      setCalYear(d.getFullYear());
      setCalMonth(d.getMonth());
    }
    function goPrevDay() { goToDate(shiftDateISO(selectedDate, -1)); }
    function goNextDay() { goToDate(shiftDateISO(selectedDate, 1)); }

    const trainerNameById = useMemo(() => {
      const map = {};
      trainers.forEach((t) => { map[t.id] = t.name; });
      return map;
    }, [trainers]);

    useEffect(() => {
      if (!sb) { setLoaded(true); return; }
      let q = sb.from("scheduled_sessions").select("*").order("session_date", { ascending: true });
      if (trainerId) q = q.eq("trainer_id", trainerId);
      q.then(({ data, error: err }) => {
        if (!err && data) {
          setSessions(data.map((r) => ({ id: r.id, name: r.client_name, phone: r.client_phone, email: r.client_email, date: r.session_date, time: r.session_time, note: r.note, waSentAt: r.reminder_sent_at, emailSentAt: r.email_reminder_sent_at, trainerId: r.trainer_id })));
        }
        setLoaded(true);
      });
    }, []);

    async function handleSchedule() {
      if (!name.trim() || (!phone.trim() && !email.trim()) || !date) {
        setError("Add a client name, at least a phone number or email, and a date.");
        return;
      }
      if (!sb) { setError("Backend not configured yet."); return; }
      setSaving(true);
      const assignedTrainerId = canPickTrainer ? (formTrainerId || null) : trainerId;
      const payload = { client_name: name.trim(), client_phone: phone.trim() || null, client_email: email.trim() || null, session_date: date, session_time: time || null, note: note.trim() || null, trainer_id: assignedTrainerId };
      const { data, error: err } = await sb.from("scheduled_sessions").insert([payload]).select();
      setSaving(false);
      if (err || !data) { setError("Couldn't schedule that session. Check the scheduled_sessions table has client_phone and client_email columns (see setup guide)."); return; }
      const row = data[0];
      const mapped = { id: row.id, name: row.client_name, phone: row.client_phone, email: row.client_email, date: row.session_date, time: row.session_time, note: row.note, waSentAt: row.reminder_sent_at, emailSentAt: row.email_reminder_sent_at, trainerId: row.trainer_id };
      setSessions((prev) => [...prev, mapped].sort((a, b) => ((a.date + (a.time || "")) < (b.date + (b.time || "")) ? -1 : 1)));
      setName(""); setPhone(""); setEmail(""); setNote(""); setError("");
    }

    async function handleDeleteSession(id) {
      setSessions((prev) => prev.filter((s) => s.id !== id));
      if (sb) await sb.from("scheduled_sessions").delete().eq("id", id);
    }

    async function handleSendWhatsapp(session) {
      setError("");
      const link = whatsappReminderLink(session);
      if (!link) {
        setError("No phone number saved for this session — delete it and reschedule with a phone number to send a WhatsApp reminder.");
        return;
      }
      // Open WhatsApp before any await, so the browser still treats this as a
      // direct result of the click (otherwise popup blockers can kill it).
      window.open(link, "_blank", "noopener,noreferrer");
      setSendingId(session.id);
      setSendingChannel("whatsapp");
      const sentAt = new Date().toISOString();
      if (sb) await sb.from("scheduled_sessions").update({ reminder_sent_at: sentAt }).eq("id", session.id);
      setSessions((prev) => prev.map((s) => (s.id === session.id ? { ...s, waSentAt: sentAt } : s)));
      setSendingId(null);
      setSendingChannel(null);
    }

    async function handleSendEmail(session) {
      setError("");
      if (!session.email) {
        setError("No email saved for this session — delete it and reschedule with an email to send an email reminder.");
        return;
      }
      if (!EMAILJS_READY || !window.emailjs) {
        setError("Email reminders aren't set up yet — add your EmailJS keys near the top of the file (see the setup guide).");
        return;
      }
      setSendingId(session.id);
      setSendingChannel("email");
      try {
        await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_name: session.name,
          to_email: session.email,
          session_date: fmtDateFull(session.date),
          session_time: session.time || "",
          note: session.note || ""
        });
        const sentAt = new Date().toISOString();
        if (sb) await sb.from("scheduled_sessions").update({ email_reminder_sent_at: sentAt }).eq("id", session.id);
        setSessions((prev) => prev.map((s) => (s.id === session.id ? { ...s, emailSentAt: sentAt } : s)));
      } catch (err) {
        const detail = (err && (err.text || err.message)) ? ` (${err.text || err.message})` : "";
        setError("Couldn't send that email — double check your EmailJS service/template IDs and public key." + detail);
      }
      setSendingId(null);
      setSendingChannel(null);
    }

    const sessionCountByDate = useMemo(() => {
      const map = {};
      sessions.forEach((s) => { map[s.date] = (map[s.date] || 0) + 1; });
      return map;
    }, [sessions]);
    const daySessions = useMemo(() => sessions
      .filter((s) => s.date === selectedDate)
      .sort((a, b) => ((a.time || "") < (b.time || "") ? -1 : 1)), [sessions, selectedDate]);
    const isDayPast = selectedDate < todayISO();

    if (!loaded) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading rota…"));

    return e("div", null,
      e("div", { style: styles.sessionForm },
        e("div", { style: styles.sessionFormRow },
          e("input", { style: styles.input, list: "rota-client-list", placeholder: "Client name", value: name, onChange: (ev) => setName(ev.target.value) }),
          e("input", { style: styles.input, type: "tel", placeholder: "Phone (for WhatsApp)", value: phone, onChange: (ev) => setPhone(ev.target.value) })
        ),
        e("datalist", { id: "rota-client-list" }, clientOptions.map((n) => e("option", { key: n, value: n }))),
        e("div", { style: styles.sessionFormRow },
          e("input", { style: styles.input, type: "email", placeholder: "Email (optional)", value: email, onChange: (ev) => setEmail(ev.target.value) })
        ),
        e("div", { style: styles.sessionFormRow },
          e("input", { style: styles.input, type: "date", value: date, onChange: (ev) => setDate(ev.target.value) }),
          e("input", { style: styles.input, type: "time", value: time, onChange: (ev) => setTime(ev.target.value) })
        ),
        canPickTrainer && e("select", {
          value: formTrainerId, onChange: (ev) => setFormTrainerId(ev.target.value),
          style: { ...styles.input, marginBottom: 10 }
        }, [e("option", { key: "", value: "" }, "Unassigned"), ...trainers.map((t) => e("option", { key: t.id, value: t.id }, t.name))]),
        e("input", { style: { ...styles.input, marginBottom: 12 }, placeholder: "Note (optional) — e.g. \"Upper body day\"", value: note, onChange: (ev) => setNote(ev.target.value) }),
        error && e("div", { style: { ...styles.errorBanner, marginBottom: 12 } }, e(Icon, { name: "x", size: 13, color: C.critical }), error),
        e("button", { style: { ...styles.saveBtn, marginTop: 0, ...(saving ? styles.btnDisabled : {}) }, disabled: saving, onClick: handleSchedule }, e(Icon, { name: "calendar", size: 15 }), saving ? "Scheduling…" : "Schedule session")
      ),
      e(CalendarMonth, {
        year: calYear, month: calMonth, sessionCountByDate, selectedDate,
        onSelectDate: goToDate, onPrevMonth: goPrevMonth, onNextMonth: goNextMonth
      }),
      e("div", { style: { ...styles.sectionHead, marginTop: 18, flexDirection: "row", alignItems: "center", justifyContent: "space-between" } },
        e("button", { style: styles.calendarNavBtn, onClick: goPrevDay, "aria-label": "Previous day" }, e(Icon, { name: "back", size: 15 })),
        e("span", { style: styles.sectionTitle }, fmtDateFull(selectedDate)),
        e("button", { style: { ...styles.calendarNavBtn, transform: "rotate(180deg)" }, onClick: goNextDay, "aria-label": "Next day" }, e(Icon, { name: "back", size: 15 }))
      ),
      e(DayTimeline, {
        daySessions, onSendWhatsapp: handleSendWhatsapp, onSendEmail: handleSendEmail, onDelete: handleDeleteSession,
        sendingId, sendingChannel, past: isDayPast,
        canPickTrainer, trainerNameById
      })
    );
  }

  // ---- dashboard (totals for trainers + manager) ----

  function DashboardStatGrid({ stats }) {
    const tiles = [
      { label: "Sessions today", value: String(stats.sessionsToday) },
      { label: "Sessions this month", value: String(stats.sessionsMonth) },
      { label: "Collected this month", value: `$${stats.monthPaid.toLocaleString()}` },
      { label: "Collected all-time", value: `$${stats.totalPaid.toLocaleString()}` }
    ];
    return e("div", { style: styles.dashGrid }, tiles.map((t) => e("div", { key: t.label, style: styles.dashTile },
      e("span", { style: styles.profileLabel }, t.label),
      e("span", { style: styles.dashTileValue }, t.value)
    )));
  }

  function MonthlyBreakdownPanel({ entries, payments }) {
    const [selectedMonth, setSelectedMonth] = useState(null);
    const months = useMemo(() => computeMonthlyBreakdown(entries, payments), [entries, payments]);
    const sessionRows = useMemo(() => {
      if (!selectedMonth) return [];
      const seen = new Set();
      const rows = [];
      entries.forEach((x) => {
        if (!x.date || x.date.slice(0, 7) !== selectedMonth) return;
        const key = x.clientName + "|" + x.date;
        if (seen.has(key)) return;
        seen.add(key);
        rows.push({ name: x.clientName, date: x.date });
      });
      return rows.sort((a, b) => (a.date < b.date ? 1 : -1));
    }, [entries, selectedMonth]);
    const paymentRows = useMemo(() => {
      if (!selectedMonth) return [];
      return payments
        .filter((p) => p.paid_on && p.paid_on.slice(0, 7) === selectedMonth)
        .sort((a, b) => (a.paid_on < b.paid_on ? 1 : -1));
    }, [payments, selectedMonth]);

    if (selectedMonth) {
      const monthPaidTotal = paymentRows.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);

      return e("div", null,
        e("div", { style: { marginTop: 22, marginBottom: 4 } },
          e("button", { style: styles.monthBackBtn, onClick: () => setSelectedMonth(null) }, e(Icon, { name: "back", size: 16 }), "All months")
        ),
        e("div", { style: { padding: "2px 0 14px" } }, e("span", { style: styles.gateTitleSmall }, fmtMonthLabel(selectedMonth))),
        e("div", { style: styles.dashGrid },
          e("div", { style: styles.dashTile }, e("span", { style: styles.profileLabel }, "Sessions"), e("span", { style: styles.dashTileValue }, String(sessionRows.length))),
          e("div", { style: styles.dashTile }, e("span", { style: styles.profileLabel }, "Collected"), e("span", { style: styles.dashTileValue }, `$${monthPaidTotal.toLocaleString()}`))
        ),
        e("div", { style: { ...styles.sectionHead, marginTop: 22 } }, e("span", { style: styles.sectionTitle }, "Sessions")),

    const paidByName = useMemo(() => {

    }, [allPayments]);

    const paidByTrainerId = useMemo(() => {
      const map = {};

      return map;
    }, [allTrainerPayments]);

    const roster = useMemo(() => {
      const byClient = {};
      allEntries.forEach((x) => { (byClient[x.clientName] = byClient[x.clientName] || []).push(x); });
      // Every registered client shows up here, even ones who haven't logged a
      // single workout yet — otherwise a brand-new client is invisible and can
      // never get assigned to a trainer in the first place.
      profiles.forEach((p) => { if (!byClient[p.client_name]) byClient[p.client_name] = []; });
      return Object.entries(byClient).map(([name, list]) => {
        const sessions = new Set(list.map((x) => x.date)).size;
        const lastDate = list.reduce((max, x) => (x.date > max ? x.date : max), list[0]?.date || "");
        const vol7 = computeWeekVolume(list);
        return { name, sessions, lastDate, vol7, entries: list };
      }).sort((a, b) => (a.lastDate < b.lastDate ? 1 : -1));
    }, [allEntries, profiles]);

    const profileByName = useMemo(() => {

      const t = trainers.find((tr) => tr.id === trainerId);
      return t ? t.name : "Unassigned";

    function balanceFor(name) {
      const cp = profileByName[name];
      if (!cp || cp.total_due == null) return null;
      return Number(cp.total_due) - (paidByName[name] || 0);

    function trainerBalanceFor(trainerId) {
      const t = trainers.find((tr) => tr.id === trainerId);

      if (!ok) return;
      setAllEntries((prev) => prev.filter((x) => x.clientName !== name));

    async function handleDeleteTrainer(trainerId) {
      const t = trainers.find((x) => x.id === trainerId);
      if (!t) return;
      if (t.email === SELF_TRAIN_EMAIL) { window.alert("\"Self-Training\" is a built-in bucket for clients without a trainer — it can't be deleted."); return; }
      const clientCount = trainerClientCounts[trainerId] || 0;
      // Deleting here only removes them from the roster — their Supabase Auth
      // login (email + password) keeps working, since that lives in a
      // separate system this app's key can't manage. Say so up front every
      // time, so it never quietly surprises anyone again.
      const loginNote = "\n\nNote: this removes them from your roster, but their login will still work — they'll just no longer be treated as a trainer. To fully block their login, delete their account in Supabase (Authentication → Users).";
      const msg = (clientCount > 0
        ? `Delete ${t.name}? Their ${clientCount} client${clientCount === 1 ? "" : "s"} will become unassigned — you can reassign them anytime.`

  // Jimmy's platform-level view of every self-serve gym: what each owes this
  // month (their percentage of their clients' fees), a note on payment status,
  // and a freeze switch to cut off access if they haven't renewed.
  function GymsBillingPanel() {
    const [loading, setLoading] = useState(true);
    const [gyms, setGyms] = useState([]);
    const [trainerCounts, setTrainerCounts] = useState({});
    const [clientStats, setClientStats] = useState({}); // gymId -> { count, totalDue }
    const [freezingId, setFreezingId] = useState(null);

    useEffect(() => {
      if (!sb) { setLoading(false); return; }
      (async () => {
        const [gymsRes, trainersRes, clientsRes] = await Promise.all([
          sb.from("gyms").select("*").order("created_at", { ascending: false }),
          sb.from("trainers").select("gym_id").not("gym_id", "is", null),
          sb.from("client_profiles").select("gym_id, total_due").not("gym_id", "is", null)
        ]);
        if (!gymsRes.error && gymsRes.data) setGyms(gymsRes.data);
        if (!trainersRes.error && trainersRes.data) {
          const counts = {};
          trainersRes.data.forEach((t) => { counts[t.gym_id] = (counts[t.gym_id] || 0) + 1; });
          setTrainerCounts(counts);
        }
        if (!clientsRes.error && clientsRes.data) {
          const stats = {};
          clientsRes.data.forEach((c) => {
            const s = stats[c.gym_id] || { count: 0, totalDue: 0 };
            s.count += 1;
            s.totalDue += Number(c.total_due) || 0;
            stats[c.gym_id] = s;
          });
          setClientStats(stats);
        }
        setLoading(false);
      })();
    }, []);

    async function updateGymField(gymId, field, value) {
      setGyms((prev) => prev.map((g) => (g.id === gymId ? { ...g, [field]: value } : g)));
      if (sb) await sb.from("gyms").update({ [field]: value }).eq("id", gymId);
    }

    async function toggleFreeze(gym) {
      const nextFrozen = !gym.is_frozen;
      const ok = window.confirm(
        nextFrozen
          ? `Freeze ${gym.name}? Their owner and every trainer in this gym will be signed out and blocked from logging in until you unfreeze it.`
          : `Unfreeze ${gym.name}? Their trainers will be able to log in again.`
      );
      if (!ok) return;
      setFreezingId(gym.id);
      await updateGymField(gym.id, "is_frozen", nextFrozen);
      setFreezingId(null);
    }

    if (loading) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading gyms…"));

    const totalMonthlyCut = gyms.reduce((sum, g) => {
      const count = (clientStats[g.id] || {}).count || 0;
      return sum + count * (Number(g.rate_per_client) || 0);
    }, 0);

    return e("div", null,
      gyms.length > 0 && e(StatTile, { label: "Estimated monthly cut, all gyms", value: Math.round(totalMonthlyCut), unit: "", size: "lg" }),
      gyms.length === 0 && e("div", { style: styles.empty }, e(Icon, { name: "users", size: 26, color: C.ink3 }), e("p", { style: styles.emptyText }, "No self-serve gyms have signed up yet.")),
      e("div", { style: { display: "flex", flexDirection: "column", gap: 14, marginTop: gyms.length > 0 ? 18 : 0 } }, gyms.map((g) => {
        const stats = clientStats[g.id] || { count: 0, totalDue: 0 };
        const rate = Number(g.rate_per_client) || 0;
        const cut = stats.count * rate;
        return e("div", { key: g.id, style: styles.profileSummary },
          e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 } },
            e("div", null,
              e("div", { style: styles.exerciseName }, g.name),
              e("div", { style: styles.muscleSubText }, g.owner_email)
            ),
            e("span", { style: { ...styles.goalChip, ...(g.is_frozen ? styles.goalChipBad : styles.goalChipGood) } }, g.is_frozen ? "Frozen" : "Active")
          ),
          e("div", { style: styles.muscleSubText }, `${trainerCounts[g.id] || 0} trainer${(trainerCounts[g.id] || 0) === 1 ? "" : "s"} · ${stats.count} client${stats.count === 1 ? "" : "s"} · code ${g.invite_code || "—"}`),
          e("div", { style: styles.profileSummaryGrid },
            e(EditableStat, { label: "Rate per client ($/mo)", value: g.rate_per_client, suffix: "$", onCommit: (v) => updateGymField(g.id, "rate_per_client", v != null ? v : 0) }),
            e("div", null,
              e("span", { style: styles.profileLabel }, "Est. monthly cut"),
              e("p", { style: styles.profileValue }, `$${Math.round(cut).toLocaleString()}`)
            )
          ),
          e(EditableStat, { label: "Billing note", value: g.billing_note, type: "text", block: true, placeholder: "e.g. Paid through August", onCommit: (v) => updateGymField(g.id, "billing_note", v) }),
          e("button", {
            style: { ...styles.saveBtn, marginTop: 12, ...(g.is_frozen ? {} : { background: C.criticalStrong }), ...(freezingId === g.id ? styles.btnDisabled : {}) },
            disabled: freezingId === g.id,
            onClick: () => toggleFreeze(g)
          }, freezingId === g.id ? "Working…" : g.is_frozen ? "Unfreeze this gym" : "Freeze this gym")
        );
      }))
    );
  }

  // ---- progress photos ----

  function ProgressPanel({ userId, clientName, canManage = false }) {
    const [photos, setPhotos] = useState([]);
    const [loaded, setLoaded] = useState(false);
    const [uploading, setUploading] = useState(false);
    const [takenOn, setTakenOn] = useState(todayISO());
    const [note, setNote] = useState("");
    const [error, setError] = useState("");
    const fileInputRef = useRef(null);
    // Which two photos are picked for the before/after comparison — defaults
    // to earliest vs. most recent (the obvious pair), but a client or trainer
    // can pick any two dates instead, e.g. two specific check-ins to compare.
    const [compareLeftId, setCompareLeftId] = useState(null);
    const [compareRightId, setCompareRightId] = useState(null);

    useEffect(() => {
      if (!userId || !sb) { setPhotos([]); setLoaded(true); return; }
      setLoaded(false);
      sb.from("progress_photos").select("*").eq("user_id", userId).order("taken_on", { ascending: true }).then(async ({ data, error: err }) => {
        if (err || !data) { setPhotos([]); setLoaded(true); return; }
        const withUrls = await Promise.all(data.map(async (r) => {
          const { data: signed } = await sb.storage.from("progress-photos").createSignedUrl(r.storage_path, 3600);
          return { id: r.id, takenOn: r.taken_on, note: r.note, path: r.storage_path, url: signed ? signed.signedUrl : null };
        }));
        setPhotos(withUrls);
        setLoaded(true);
      });
    }, [userId]);

    async function handleUpload(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      setError("");
      if (!sb || !userId) { setError("Backend not configured yet."); return; }
      setUploading(true);
      const path = `${userId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, "")}`;
      const { error: upErr } = await sb.storage.from("progress-photos").upload(path, file);
      if (upErr) { setUploading(false); setError("Couldn't upload that photo. Try again."); return; }
      const { data, error: insErr } = await sb.from("progress_photos").insert([{
        user_id: userId, client_name: clientName, storage_path: path, taken_on: takenOn, note: note.trim() || null
      }]).select();
      setUploading(false);
      if (insErr || !data) { setError("Photo uploaded but couldn't save the record. Try again."); return; }
      const { data: signed } = await sb.storage.from("progress-photos").createSignedUrl(path, 3600);
      const row = data[0];
      setPhotos((prev) => [...prev, { id: row.id, takenOn: row.taken_on, note: row.note, path, url: signed ? signed.signedUrl : null }].sort((a, b) => (a.takenOn < b.takenOn ? -1 : 1)));
      setNote("");
      if (fileInputRef.current) fileInputRef.current.value = "";
    }

    async function handleDeletePhoto(photo) {
      const ok = window.confirm("Delete this photo? This can't be undone.");
      if (!ok) return;
      setPhotos((prev) => prev.filter((p) => p.id !== photo.id));
      if (sb) {
        await sb.from("progress_photos").delete().eq("id", photo.id);
        await sb.storage.from("progress-photos").remove([photo.path]);
      }
    }

    if (!loaded) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading photos…"));

    const first = photos.length > 0 ? photos[0] : null;
    const last = photos.length > 1 ? photos[photos.length - 1] : null;
    const photoOptions = photos.map((p) => ({ value: p.id, label: fmtDateMed(p.takenOn) + (p.note ? ` — ${p.note}` : "") }));
    const compareLeft = photos.find((p) => p.id === compareLeftId) || first;
    const compareRight = photos.find((p) => p.id === compareRightId) || last;

    return e("div", null,
      canManage && e("div", { style: styles.sessionForm },
        e("label", { style: styles.formLabel }, "Date"),
        e("input", { type: "date", value: takenOn, max: todayISO(), onChange: (ev) => setTakenOn(ev.target.value), style: styles.input }),
        e("input", { style: { ...styles.input, marginTop: 10, marginBottom: 12 }, placeholder: 'Note (optional) — e.g. "Week 4"', value: note, onChange: (ev) => setNote(ev.target.value) }),
        error && e("div", { style: { ...styles.errorBanner, marginBottom: 12 } }, e(Icon, { name: "x", size: 13, color: C.critical }), error),
        e("input", { ref: fileInputRef, type: "file", accept: "image/*", onChange: handleUpload, disabled: uploading, style: { display: "none" }, id: "progress-photo-input" }),
        e("label", { htmlFor: "progress-photo-input", style: { ...styles.saveBtn, ...(uploading ? styles.btnDisabled : {}), display: "flex", justifyContent: "center", cursor: uploading ? "default" : "pointer" } },
          e(Icon, { name: "camera", size: 16 }), uploading ? "Uploading…" : "Add progress photo"
        )
      ),
      photos.length === 0 && e("div", { style: styles.empty }, e(Icon, { name: "camera", size: 24, color: C.ink3 }), e("p", { style: styles.emptyText }, "No progress photos yet.")),
      first && last && e(React.Fragment, null,

  // ---- payments ----

  function PaymentsPanel({ userId, clientName, canManage = false, totalDue, onUpdateTotalDue, table = "client_payments", idField = "user_id", nameField = "client_name" }) {
    const [payments, setPayments] = useState([]);
    const [loaded, setLoaded] = useState(false);
    const [date, setDate] = useState(todayISO());
    const [amount, setAmount] = useState("");
    const [note, setNote] = useState("");
    const [saving, setSaving] = useState(false);
    const [error, setError] = useState("");
    const [dueDraft, setDueDraft] = useState(totalDue != null ? String(totalDue) : "");
    const [editingDue, setEditingDue] = useState(false);

    useEffect(() => { setDueDraft(totalDue != null ? String(totalDue) : ""); }, [totalDue]);

    useEffect(() => {
      if (!userId || !sb) { setPayments([]); setLoaded(true); return; }
      setLoaded(false);
      sb.from(table).select("*").eq(idField, userId).order("paid_on", { ascending: false }).then(({ data, error: err }) => {
        if (!err && data) {
          setPayments(data.map((r) => ({ id: r.id, date: r.paid_on, amount: Number(r.amount), note: r.note })));
        } else {
          setPayments([]);
        }
        setLoaded(true);
      });
    }, [userId, table, idField]);

    async function handleSave() {
      setError("");
      if (!date) { setError("Pick a date."); return; }
      const amt = Number(amount);
      if (!amount || Number.isNaN(amt) || amt <= 0) { setError("Enter a valid payment amount."); return; }
      if (!sb || !userId) { setError("Backend not configured yet."); return; }
      setSaving(true);
      const payload = { [idField]: userId, [nameField]: clientName, amount: amt, paid_on: date, note: note.trim() || null };
      const { data, error: err } = await sb.from(table).insert([payload]).select();
      setSaving(false);
      if (err || !data) { setError("Couldn't save that payment. Try again."); return; }
      const row = data[0];
      setPayments((prev) => [{ id: row.id, date: row.paid_on, amount: Number(row.amount), note: row.note }, ...prev]);
      setAmount(""); setNote(""); setDate(todayISO());
    }

    async function handleDelete(id) {
      setPayments((prev) => prev.filter((p) => p.id !== id));
      if (sb) await sb.from(table).delete().eq("id", id);
    }

    function commitDue() {
      setEditingDue(false);
      if (dueDraft === "") { if (onUpdateTotalDue) onUpdateTotalDue(null); return; }
      const n = Number(dueDraft);
      if (Number.isNaN(n) || n < 0) { setDueDraft(totalDue != null ? String(totalDue) : ""); return; }
      if (onUpdateTotalDue) onUpdateTotalDue(n);
    }

    if (!loaded) return e("div", { style: styles.empty }, e("p", { style: styles.emptyText }, "Loading payments…"));

    const totalPaid = payments.reduce((sum, p) => sum + p.amount, 0);
    const due = totalDue != null ? Number(totalDue) : null;
    const balance = due != null ? due - totalPaid : null;
    const isPaidUp = balance != null && balance <= 0;

    return e("div", null,
      e("div", { style: styles.paymentSummaryCard },
        e("div", { style: styles.profileSummaryGrid },
          e("div", null,
            e("span", { style: styles.profileLabel }, "Total package"),
            canManage
              ? (editingDue
                  ? e("input", {
                      type: "number", min: "0", step: "1", autoFocus: true,
                      style: { ...styles.input, marginTop: 2, padding: "6px 8px", fontSize: 13.5 },
                      value: dueDraft, onChange: (ev) => setDueDraft(ev.target.value), onBlur: commitDue,
                      onKeyDown: (ev) => { if (ev.key === "Enter") commitDue(); if (ev.key === "Escape") { setDueDraft(totalDue != null ? String(totalDue) : ""); setEditingDue(false); } }
                    })
                  : e("span", { style: { ...styles.profileValue, cursor: "pointer" }, onClick: () => setEditingDue(true), title: "Tap to edit" }, due != null ? due.toLocaleString() : "Set amount"))
              : e("span", { style: styles.profileValue }, due != null ? due.toLocaleString() : "—")
          ),
          e("div", null, e("span", { style: styles.profileLabel }, "Paid so far"), e("span", { style: styles.profileValue }, totalPaid.toLocaleString())),
          e("div", null,
            e("span", { style: styles.profileLabel }, "Balance"),
            e("span", { style: { ...styles.profileValue, color: balance == null ? C.ink : (isPaidUp ? C.good : C.critical) } }, balance != null ? `${Math.abs(balance).toLocaleString()}${balance > 0 ? " due" : balance < 0 ? " credit" : " paid up"}` : "—")
          )
        )
      ),
      canManage && e("div", { style: { ...styles.sessionForm, marginTop: 14 } },
        e("label", { style: styles.formLabel }, "Date"),
        e("input", { type: "date", value: date, max: todayISO(), onChange: (ev) => setDate(ev.target.value), style: styles.input }),
        e("label", { style: { ...styles.formLabel, marginTop: 10 } }, "Amount paid"),
        e("input", { type: "number", min: "0", step: "0.01", style: styles.input, value: amount, onChange: (ev) => setAmount(ev.target.value) }),
        e("input", { style: { ...styles.input, marginTop: 10, marginBottom: 12 }, placeholder: "Note (optional)", value: note, onChange: (ev) => setNote(ev.target.value) }),
        error && e("div", { style: { ...styles.errorBanner, marginBottom: 12 } }, e(Icon, { name: "x", size: 13, color: C.critical }), error),
        e("button", { style: { ...styles.saveBtn, marginTop: 0, ...(saving ? styles.btnDisabled : {}) }, disabled: saving, onClick: handleSave }, e(Icon, { name: "check", size: 15 }), saving ? "Saving…" : "Log payment")
      ),
      payments.length === 0 && e("div", { style: styles.empty }, e(Icon, { name: "activity", size: 24, color: C.ink3 }), e("p", { style: styles.emptyText }, "No payments logged yet.")),
      payments.length > 0 && e(React.Fragment, null,
        e("div", { style: { ...styles.sectionHead, marginTop: 22 } }, e("span", { style: styles.sectionTitle }, "History")),
        e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } }, payments.map((p) => e("div", { key: p.id, style: styles.assessmentRow },
          e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
            e("span", { style: styles.profileLabel }, fmtDate(p.date)),
            canManage && e("button", { style: styles.deleteBtn, onClick: () => handleDelete(p.id), "aria-label": "Delete payment" }, e(Icon, { name: "trash", size: 13 }))
          ),
          e("span", { style: { ...styles.profileValue, display: "block", marginTop: 4 } }, p.amount.toLocaleString()),
          p.note && e("p", { style: styles.profileGoalText }, p.note)
        )))
      )
    );
  }

  // ---- diet plan + macro/water tracking ----

  const DIET_FIELD_MAP = { calories: "calories_target", protein: "protein_target", carbs: "carbs_target", fat: "fat_target", water: "water_target_ml" };

  function macroHit(actual, target, tolerancePct, floorOnly) {
    if (target == null || actual == null) return null;
    if (floorOnly) return actual >= target;
    const lo = target * (1 - tolerancePct);
    const hi = target * (1 + tolerancePct);
    return actual >= lo && actual <= hi;
  }

  // Per-macro status: how far actual intake is from target, and in which direction.
  function macroStatusInfo(actual, target, tolerancePct, floorOnly) {
    if (target == null || actual == null) return null;
    const diff = Math.round(actual - target);
    const hit = macroHit(actual, target, tolerancePct, floorOnly);
    if (hit) return { label: "On target", diff: 0, kind: "good" };
    if (diff > 0) return { label: `${diff} over`, diff, kind: "over" };
    return { label: `${Math.abs(diff)} under`, diff, kind: "under" };
  }

  function macroStatusColors(kind) {
    if (kind === "good") return { color: C.good, background: C.goodSoft };
    if (kind === "over") return { color: C.critical, background: C.criticalSoft };
    return { color: C.brand, background: C.brandSoft };
  }

  function macroDeltaTag(actual, target, tolerancePct, floorOnly) {
    const info = macroStatusInfo(actual, target, tolerancePct, floorOnly);
    if (!info) return null;
    return e("span", { style: { color: macroStatusColors(info.kind).color, fontWeight: 600 } }, ` (${info.label})`);
  }

  function DietTargetTile({ label, value, suffix, editable, onCommit, full }) {
    const [editing, setEditing] = useState(false);
    const [draft, setDraft] = useState(value != null ? String(value) : "");
    useEffect(() => { setDraft(value != null ? String(value) : ""); }, [value]);
    function commit() {
      setEditing(false);
      if (draft === "") { onCommit(null); return; }
      const n = Number(draft);
      if (Number.isNaN(n)) { setDraft(value != null ? String(value) : ""); return; }
      onCommit(n);
    }
    return e("div", { style: { ...styles.dashTile, ...(full ? { gridColumn: "1 / -1" } : {}) } },
      e("span", { style: styles.profileLabel }, label),
      editing
        ? e("input", {
            type: "number", autoFocus: true, style: { ...styles.input, marginTop: 4, padding: "6px 8px", fontSize: 15 },
            value: draft, onChange: (ev) => setDraft(ev.target.value), onBlur: commit,
            onKeyDown: (ev) => { if (ev.key === "Enter") commit(); if (ev.key === "Escape") { setDraft(value != null ? String(value) : ""); setEditing(false); } }
          })
        : e("span", {
            style: { ...styles.dashTileValue, fontSize: 18, ...(editable ? { cursor: "pointer" } : {}) },
            onClick: () => editable && setEditing(true)
          }, value != null ? `${value}${suffix}` : (editable ? "Set" : "—"))
    );
  }

  function MacroStatusRow({ label, suffix, actual, target, tolerancePct, floorOnly }) {
    const info = macroStatusInfo(actual, target, tolerancePct, floorOnly);
    const chipStyle = info
      ? macroStatusColors(info.kind)
      : { color: C.ink3, background: "rgba(255,255,255,0.04)" };
    const chipLabel = info ? info.label : (target == null ? "No target" : "Not logged");
    return e("div", { style: styles.macroStatusRow },
      e("div", null,
        e("span", { style: styles.profileLabel }, label),
        e("span", { style: { ...styles.profileValue, display: "block" } },
          actual != null ? `${actual}${suffix}` : "—",
          target != null ? e("span", { style: { color: C.ink3, fontWeight: 500 } }, ` / ${target}${suffix}`) : null
        )
      ),
      e("span", { style: { ...styles.goalChip, color: chipStyle.color, background: chipStyle.background } }, chipLabel)
